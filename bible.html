/** --- DATA UTILITIES --- **/
function walkItems(items, map, versionKey, useOrgId, buffer, context) {
  if (!items) return;
  for (const item of items) {
    let previousActiveVid = context.activeVid;
    if (item.attrs?.verseId) {
      let keyVid = item.attrs.verseId;
      if (useOrgId && item.attrs.verseOrgIds && item.attrs.verseOrgIds.length > 0) keyVid = item.attrs.verseOrgIds[0];
      context.activeVid = keyVid;
      context.lastSeenVid = keyVid;
      if (!map[keyVid]) map[keyVid] = {};
      if (!map[keyVid][versionKey]) map[keyVid][versionKey] = { text: [], displayVid: item.attrs.verseId };
      if (buffer && buffer.text.length > 0) { map[keyVid][versionKey].text.push(...buffer.text); buffer.text = []; }
    }
    if (item.type === 'text' && item.text) {
        if (context.activeVid) {
            if (map[context.activeVid] && map[context.activeVid][versionKey]) map[context.activeVid][versionKey].text.push(item.text);
        } else if (item.text.trim().length > 0) {
            if (context.lastSeenVid) {
                if (map[context.lastSeenVid] && map[context.lastSeenVid][versionKey]) map[context.lastSeenVid][versionKey].text.push(item.text);
            } else if (buffer) { buffer.text.push(item.text); }
        }
    }
    if (item.items && item.items.length > 0) walkItems(item.items, map, versionKey, useOrgId, buffer, context);
    context.activeVid = previousActiveVid;
  }
}

function processContent(contentArray, map, versionKey, useOrgId = false) {
  if (!contentArray) return;
  const buffer = { text: [] };
  const context = { activeVid: null, lastSeenVid: null };
  for (const section of contentArray) { if (section.items) walkItems(section.items, map, versionKey, useOrgId, buffer, context); }
}

function getBasePath() {
    // If serving from /GEN/1/ -> Go up two levels
    if (window.location.pathname.match(/\/([A-Z0-9]{3})\/(\d+)(\/|\/index\.html)?$/)) {
        return '../../';
    }
    return '';
}

async function loadDailyBread(dateFolder) {
  const basePath = getBasePath();

  // Try local first, fallback to mt-sin.ai
  let manifestRes = await fetch(`${basePath}data/${dateFolder}/manifest.json`).catch(() => null);

  // If local fetch fails or returns 404, fallback to production API
  let actualBasePath = basePath;
  if (!manifestRes || !manifestRes.ok) {
    actualBasePath = "https://mt-sin.ai/365DBR/";
    manifestRes = await fetch(`${actualBasePath}data/${dateFolder}/manifest.json`);
  }

  if (!manifestRes.ok) throw new Error(`Manifest for folder ${dateFolder} not found.`);
  const manifest = await manifestRes.json();
  const verseMap = {};
  const availableKeys = new Set(['original']);

  const results = await Promise.all(
    manifest.files.map(async fileName => {
        const res = await fetch(`${actualBasePath}data/${dateFolder}/${fileName}`);
        if (!res.ok) throw new Error(`Failed to load ${fileName}`);
        return await res.json();
    })
  );

  results.forEach((source) => {
    const data = source.data;
    if (!data) return;
    if (data.content) processContent(data.content, verseMap, 'original', false);
    if (data.parallels) {
      data.parallels.forEach(parallel => {
         const matchedKey = Object.keys(TRANSLATION_REGISTRY).find(key => {
            const config = TRANSLATION_REGISTRY[key];
            if (!config.idPrefix) return false;
            if (parallel.bibleId.includes(config.idPrefix)) return true;
            if (config.altIds && config.altIds.some(id => parallel.bibleId === id)) return true;
            return false;
         });
         if (matchedKey && parallel.content) {
            processContent(parallel.content, verseMap, matchedKey, true);
            availableKeys.add(matchedKey);
         }
      });
    }
  });

  const sortedKeys = Array.from(availableKeys).filter(k => k !== 'original');
  // ⚡ Bolt Optimization: Use for...in loops to avoid allocating intermediate arrays (Object.keys/values)
  // during critical data loading phase. Reduces GC pressure on mobile devices.
  for (const vid in verseMap) {
      const verseData = verseMap[vid];
      for (const key in verseData) {
          const entry = verseData[key];
          if (entry.text && Array.isArray(entry.text)) {
              const config = TRANSLATION_REGISTRY[key];
              const separator = config && config.isHebrewGreek ? '' : ' ';
              entry.text = entry.text.join(separator);
          }
      }
  }
  return { verseMap, label: manifest.label, availableTranslations: sortedKeys };
}

function getSectionIndex(vid) {
    if (!vid) return -1;
    const book = vid.substring(0, 3);
    if (book === 'PSA') return 2;
    if (book === 'PRO') return 3;
    return NT_BOOKS.has(book) ? 1 : 0;
}

function CopyButton({ text, reference, version, ...props }) {
    const [status, setStatus] = useState('idle');
    useEffect(() => { setStatus('idle'); }, [text, reference]);
    const handleCopy = async (e) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        try {
            setStatus('copying');
            await navigator.clipboard.writeText(`${text}\n— ${reference} (${version})`);
            setStatus('copied');
            setTimeout(() => setStatus('idle'), 2000);
        } catch (err) { setStatus('idle'); }
    };
    return (
        <button {...props} onClick={handleCopy} type="button" className="ml-2 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden" aria-label={status === 'copied' ? "Copied" : "Copy verse"} title={status === 'copied' ? "Copied!" : `Copy ${version}`}>

const VerseGroup = React.memo(function VerseGroup({ group, verseMap, dynamicSlots, isActive, isDimmed, isPlaying }) {
    const vid = group[0];
    const book = vid.substring(0, 3);

        if (isPlaying) return;
        const selection = window.getSelection();
        if (selection && selection.type === 'Range' && selection.toString().length > 0) return;
        const el = document.getElementById(`verse-${vid}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    const renderedSlots = useMemo(() => {
        const getSlotContent = (slot) => {
            if (!slot || !slot.source) return { text: '', displayLabel: '' };
            let fullText = '', displayLabel = '', contributing = [];

                const data = verseMap[gVid];
                const slotData = data ? data[slot.source] : null;
                if (slotData && slotData.text) {

                    contributing.push(slotData.displayVid || gVid);
                }
            });
            if (contributing.length > 0) {
                const s = contributing[0].split('.').map((p,i) => i>0 ? parseInt(p) : p);
                const e = contributing[contributing.length - 1].split('.').map((p,i) => i>0 ? parseInt(p) : p);
                const bName = BOOK_NAMES[s[0]] || s[0];
                if (contributing[0] === contributing[contributing.length-1]) displayLabel = `${bName} ${s[1]}:${s[2]}`;
                else if (s[0] === e[0]) displayLabel = s[1] === e[1] ? `${bName} ${s[1]}:${s[2]}-${e[2]}` : `${bName} ${s[1]}:${s[2]}-${e[1]}:${e[2]}`;
                else displayLabel = `${bName} ${s[1]}:${s[2]} - ${BOOK_NAMES[e[0]]||e[0]} ${e[1]}:${e[2]}`;
            } else if (group.length > 0) {
                const [b, c, v] = group[0].split('.');
                displayLabel = `${BOOK_NAMES[b] || b} ${c}:${v}`;
            }
            return { text: fullText, displayLabel };
        };
        const getLabel = (slot) => typeof slot.label === 'function' ? slot.label(isHebrew) : slot.label;
        return {
            top: { ...getSlotContent(dynamicSlots.top), label: getLabel(dynamicSlots.top), config: dynamicSlots.top },
            middle: { ...getSlotContent(dynamicSlots.middle), label: getLabel(dynamicSlots.middle), config: dynamicSlots.middle },
            bottom: { ...getSlotContent(dynamicSlots.bottom), label: getLabel(dynamicSlots.bottom), config: dynamicSlots.bottom, attribution: dynamicSlots.bottom.attribution }
        };
    }, [group, verseMap, dynamicSlots, isHebrew]);

    return (
        <div id={`verse-${vid}`} onClick={handleVerseClick} className={`verse-block group transition-all duration-700 scroll-mt-12 md:scroll-mt-14 ${isDimmed ? 'opacity-10 grayscale' : 'opacity-100'} ${!isPlaying ? 'cursor-pointer' : ''}`}>
            <div className={`flex flex-col gap-1 transition-all duration-500 ${isActive ? 'scale-[1.01]' : 'scale-100'}`}>
            {/* Top Slot */}
            <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-900 border-amber-600 shadow-md' : 'bg-stone-50/50 border-stone-100'}`}>

                        <span>{renderedSlots.top.displayLabel}</span>

                    <span className={isActive ? 'text-white' : 'text-stone-500'}>{renderedSlots.top.text}</span>

                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>{renderedSlots.middle.label}</span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-black uppercase mb-0.5 ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>

function ScrollToTop() {
  const [show, setShow] = useState(false);

  useEffect(() => {
    let ticking = false;
    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          setShow(window.scrollY > 400);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <button
      onClick={scrollToTop}
      aria-label="Scroll to top"
      title="Scroll to top"
      className={`fixed bottom-20 right-4 z-40 p-2 rounded-full bg-stone-900/80 text-white shadow-xl transition-all duration-300 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 print:hidden ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
    >
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  );
}

function BibleBrowseDialog({ isOpen, onClose, index, availableBooks, onSelect }) {
    const [step, setStep] = useState('testament');
    const [testament, setTestament] = useState(null);
    const [book, setBook] = useState(null);
    const [chapter, setChapter] = useState(null);
    const [sortDesc, setSortDesc] = useState(false);
    const [chunkIndex, setChunkIndex] = useState(0);

    // Reset when opened
    useEffect(() => {
        if (isOpen) {
            setStep('testament');
            setTestament(null);
            setBook(null);
            setChapter(null);
            setSortDesc(false);
            setChunkIndex(0);
        }
    }, [isOpen]);

    if (!isOpen) return null;

    const CHUNK_SIZE = 50;

    const handleBack = () => {
        if (step === 'verse') { setStep('chapter'); setChunkIndex(0); }
        else if (step === 'chapter') { setStep('book'); setChunkIndex(0); }
        else if (step === 'book') setStep('testament');
    };

    const handleTestamentSelect = (t) => { setTestament(t); setStep('book'); setSortDesc(false); };
    const handleBookSelect = (b) => { setBook(b); setStep('chapter'); setChunkIndex(0); };
    const handleChapterSelect = (c) => { setChapter(c); setStep('verse'); setChunkIndex(0); };
    const handleVerseSelect = (v) => { onSelect(book, chapter, v); onClose(); };

    // Data Preparation
    const OT_BOOKS = BIBLE_BOOK_ORDER.slice(0, 39);
    const NT_BOOKS = BIBLE_BOOK_ORDER.slice(39);

    let displayBooks = [];
    if (step === 'book') {
        displayBooks = testament === 'OT' ? OT_BOOKS : NT_BOOKS;
        if (sortDesc) {
            displayBooks = [...displayBooks].sort((a, b) => BOOK_NAMES[a].localeCompare(BOOK_NAMES[b]));
        }
    }

    let chunks = [];
    let currentItems = [];

    if (step === 'chapter' && book) {
        // Independent of reading plan, use VERSE_COUNTS length for chapter count
        const totalChapters = VERSE_COUNTS[book] ? VERSE_COUNTS[book].length : 1;
        const chapters = Array.from({ length: totalChapters }, (_, i) => i + 1);
        for (let i = 0; i < chapters.length; i += CHUNK_SIZE) {
            chunks.push(chapters.slice(i, i + CHUNK_SIZE));
        }
        currentItems = chunks[chunkIndex] || [];
    }

    if (step === 'verse' && book && chapter) {
        // Source of truth for verses
        const totalVerses = (VERSE_COUNTS[book] && VERSE_COUNTS[book][chapter - 1]) || 1;
        const verses = Array.from({ length: totalVerses }, (_, i) => i + 1);
        for (let i = 0; i < verses.length; i += CHUNK_SIZE) {
            chunks.push(verses.slice(i, i + CHUNK_SIZE));
        }
        currentItems = chunks[chunkIndex] || [];
    }

    return (
        <div className="fixed inset-0 z-[100] bg-stone-50 flex flex-col md:items-center md:justify-center md:bg-black/60 md:backdrop-blur-sm md:p-4 transition-opacity">
            <div className="flex-1 w-full bg-stone-50 flex flex-col md:max-w-2xl md:h-[85vh] md:rounded-xl md:shadow-2xl overflow-hidden border border-stone-200">

                {/* Ultra-Dense Header */}
                <div className="flex-none bg-white border-b border-stone-300 shadow-sm z-20 sticky top-0">
                    <div className="flex items-center justify-between px-2 py-1.5 h-12">
                        {/* Left: Back & Breadcrumb */}
                        <div className="flex items-center gap-2 overflow-hidden flex-1">
                            {step !== 'testament' && (
                                <button onClick={handleBack} className="p-1.5 text-stone-600 hover:bg-stone-100 rounded focus:outline-none focus:ring-2 focus:ring-amber-500 shrink-0" aria-label="Back">
                                    <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
                                </button>
                            )}
                            <div className="font-serif font-black uppercase text-stone-800 tracking-tight truncate text-sm sm:text-base leading-none">
                                {step === 'testament' && "Browse Bible"}
                                {step === 'book' && `${testament === 'OT' ? 'Old' : 'New'} Testament`}
                                {step === 'chapter' && `${BOOK_NAMES[book]}`}
                                {step === 'verse' && `${BOOK_NAMES[book]} ${chapter}`}
                            </div>
                        </div>

                        {/* Right: Controls */}
                        <div className="flex items-center gap-1 shrink-0">
                            {step === 'book' && (
                                <button onClick={() => setSortDesc(!sortDesc)} className="flex items-center gap-1 text-stone-600 font-bold text-[10px] uppercase bg-stone-100 hover:bg-stone-200 px-2 py-1.5 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 mr-1 border border-stone-200">
                                    {sortDesc ? 'A-Z' : '#'}
                                    {sortDesc ? (
                                        <svg className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" /></svg>
                                    ) : (
                                        <svg className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4" /></svg>
                                    )}
                                </button>
                            )}
                            <button onClick={onClose} className="p-1.5 text-stone-500 hover:text-stone-800 hover:bg-stone-100 rounded focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="Close dialog">
                                <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>
                    </div>

                    {/* Tight Chunk Selectors (Only if needed) */}
                    {(step === 'chapter' || step === 'verse') && chunks.length > 1 && (
                        <div className="flex flex-nowrap overflow-x-auto gap-1 px-2 pb-1.5 no-scrollbar bg-stone-50 border-t border-stone-200 pt-1">
                            {chunks.map((chunk, idx) => (
                                <button key={idx} onClick={() => setChunkIndex(idx)} className={`px-3 py-1 text-[11px] font-black tracking-tight whitespace-nowrap rounded-sm transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 border ${chunkIndex === idx ? 'bg-amber-600 text-white border-amber-700 shadow-inner' : 'bg-white text-stone-600 border-stone-300 hover:bg-stone-100'}`}>
                                    {`${chunk[0]}-${chunk[chunk.length-1]}`}
                                </button>
                            ))}
                        </div>
                    )}
                </div>

                {/* Main Content Scroll Area */}
                <div className="flex-1 overflow-y-auto p-2 bg-stone-100">

                    {step === 'testament' && (
                        <div className="flex flex-col gap-3 h-full justify-center px-4 py-8">
                            <button onClick={() => handleTestamentSelect('OT')} className="flex-1 min-h-[140px] max-h-[200px] bg-white border-2 border-stone-300 rounded-xl flex flex-col items-center justify-center gap-1 shadow-sm hover:border-amber-500 hover:bg-amber-50 transition-all focus:outline-none focus:ring-4 focus:ring-amber-500/50">
                                <span className="text-4xl sm:text-5xl font-serif font-black uppercase text-stone-800 tracking-tighter">Old</span>
                                <span className="text-xl sm:text-2xl font-serif italic text-stone-500">Testament</span>
                            </button>
                            <button onClick={() => handleTestamentSelect('NT')} className="flex-1 min-h-[140px] max-h-[200px] bg-white border-2 border-stone-300 rounded-xl flex flex-col items-center justify-center gap-1 shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all focus:outline-none focus:ring-4 focus:ring-blue-500/50">
                                <span className="text-4xl sm:text-5xl font-serif font-black uppercase text-stone-800 tracking-tighter">New</span>
                                <span className="text-xl sm:text-2xl font-serif italic text-stone-500">Testament</span>
                            </button>
                        </div>
                    )}

                    {step === 'book' && (
                        <div className="grid grid-cols-4 sm:grid-cols-5 gap-1.5 sm:gap-2 content-start">
                            {displayBooks.map(b => (
                                <button key={b} onClick={() => handleBookSelect(b)} className="bg-white border border-stone-300 rounded p-1.5 flex flex-col items-center justify-center shadow-sm hover:border-amber-500 hover:bg-amber-50 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 min-h-[64px]">
                                    <span className="text-lg sm:text-xl font-black text-stone-900 uppercase leading-none">{b}</span>
                                    <span className="text-[9px] sm:text-[10px] text-stone-500 truncate w-full text-center mt-1 leading-none">{BOOK_NAMES[b]}</span>
                                </button>
                            ))}
                        </div>
                    )}

                    {(step === 'chapter' || step === 'verse') && (
                        <div className="grid grid-cols-5 sm:grid-cols-7 gap-1.5 sm:gap-2 content-start pb-8">
                            {currentItems.map(item => (
                                <button key={item} onClick={() => step === 'chapter' ? handleChapterSelect(item) : handleVerseSelect(item)} className="bg-white border border-stone-300 rounded shadow-sm hover:border-amber-500 hover:bg-amber-50 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 flex items-center justify-center aspect-square text-lg sm:text-xl font-black text-stone-800 leading-none">
                                    {item}
                                </button>
                            ))}
                        </div>
                    )}

                </div>
            </div>
        </div>
    );
}

function App() {

  const [index, setIndex] = useState(null); // { GEN: { 1: [days], ... }, ... }
  const [availableBooks, setAvailableBooks] = useState([]);

  const [selectedBook, setSelectedBook] = useState(null);
  const [selectedChapter, setSelectedChapter] = useState(null);

  // Data for View
  const [verseMap, setVerseMap] = useState(null);
  const [sortedVids, setSortedVids] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [isBrowseOpen, setIsBrowseOpen] = useState(false);

  // Translation State
  const [availableTranslations, setAvailableTranslations] = useState([]);
  const [focalTranslation, setFocalTranslation] = useState('lsv');
  const [compareTranslation, setCompareTranslation] = useState('kjv');
  const [isCompareOpen, setIsCompareOpen] = useState(false);
  const [isFocalOpen, setIsFocalOpen] = useState(false);

  // Playback
  const [playbackStatus, setPlaybackStatus] = useState('stopped');
  const [playbackVerseId, setPlaybackVerseId] = useState(null);
  const [activeVerseId, setActiveVerseId] = useState(null);
  const activeVerseIdRef = useRef(activeVerseId);
  useEffect(() => { activeVerseIdRef.current = activeVerseId; }, [activeVerseId]);
  const playbackStatusRef = useRef(playbackStatus);
  useEffect(() => { playbackStatusRef.current = playbackStatus; }, [playbackStatus]);
  const synthRef = useRef(window.speechSynthesis);

  // Persistence: Scroll Target
  const [targetScrollVerse, setTargetScrollVerse] = useState(null);

  // 1. Build Index on Mount
  useEffect(() => {
    const initIndex = async () => {
        try {
            // Cache busting to ensure fresh data
            const basePath = getBasePath();
            const res = await fetch(`${basePath}data/readings.json?v=` + new Date().getTime());
            if (!res.ok) throw new Error(`Failed to load readings.json: ${res.status}`);
            const readings = await res.json();
            console.log("Loaded readings:", readings.length);

            const newIndex = {};
            const books = new Set();

            readings.forEach(day => {
                if (!day.api_format) return;
                const ranges = day.api_format.split(',');
                ranges.forEach(range => {
                    const subRanges = range.split(';');
                    subRanges.forEach(part => {
                        // GEN.1.1-GEN.1.31
                        const [start, end] = part.split('-');
                        if (!end) return; // Guard against malformed ranges
                        const [sBook, sCh] = start.split('.');
                        const [eBook, eCh] = end.split('.');

                        const sBookIdx = BIBLE_BOOK_ORDER_MAP.get(sBook);
                        const eBookIdx = BIBLE_BOOK_ORDER_MAP.get(eBook);

                        if (sBookIdx === undefined || eBookIdx === undefined) {
                            console.warn("Unknown book code:", sBook, eBook);
                            return;
                        }

                        // Iterate Books
                        for (let bIdx = sBookIdx; bIdx <= eBookIdx; bIdx++) {
                            const book = BIBLE_BOOK_ORDER[bIdx];
                            books.add(book);
                            if (!newIndex[book]) newIndex[book] = {};

                            const isStartBook = (bIdx === sBookIdx);
                            const isEndBook = (bIdx === eBookIdx);

                            // Chapter Logic (Heuristic for sparse data)
                            // If same book range: iterate chapters sCh to eCh
                            if (isStartBook && isEndBook) {
                                for (let c = parseInt(sCh); c <= parseInt(eCh); c++) {
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                            } else {
                                // Cross book: Index the known endpoints
                                if (isStartBook) {
                                    const c = parseInt(sCh);
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                                if (isEndBook) {
                                    const c = parseInt(eCh); // Usually ends at specific chapter
                                    // Also index chapter 1? Usually cross-book implies full chapters in between.
                                    // For now, strict index: only what's explicitly in range endpoints if multi-book is complex.
                                    // But typically "DEU.33.1-JOS.1.18" -> DEU 33, JOS 1.
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);

                                    // Assume Chapter 1 is present if eCh > 1?
                                    if (c > 1) {
                                         if (!newIndex[book][1]) newIndex[book][1] = [];
                                         if (!newIndex[book][1].includes(day.day)) newIndex[book][1].push(day.day);
                                    }
                                }
                            }
                        }
                    });
                });
            });

            setIndex(newIndex);
            const bookList = Array.from(books).sort((a,b) => (BIBLE_BOOK_ORDER_MAP.get(a)||0) - (BIBLE_BOOK_ORDER_MAP.get(b)||0));
            console.log("Books found:", bookList);
            if (bookList.length === 0) {
                setError("No books found in index. Please verify data.");
            } else {
                setAvailableBooks(bookList);

                // Initialize State from URL or LocalStorage
                const params = new URLSearchParams(window.location.search);
                let urlBook = params.get('book');
                let urlChapter = params.get('chapter');
                const urlVerse = params.get('verse');

                // Support Path-based routing (Static Site Generation)
                // Format: .../GEN/1/...
                const pathMatch = window.location.pathname.match(/\/([A-Z0-9]{3})\/(\d+)(\/|\/index\.html)?$/);
                if (pathMatch) {
                    urlBook = pathMatch[1];
                    urlChapter = pathMatch[2];
                }

                if (urlBook && urlChapter && newIndex[urlBook] && newIndex[urlBook][urlChapter]) {
                    setSelectedBook(urlBook);
                    setSelectedChapter(urlChapter);
                    if (urlVerse) setTargetScrollVerse(`${urlBook}.${urlChapter}.${urlVerse}`);
                } else {
                    try {
                        const saved = localStorage.getItem('bible_browser_state');
                        if (saved) {
                            const state = JSON.parse(saved);
                            if (state.book && state.chapter && newIndex[state.book] && newIndex[state.book][state.chapter]) {
                                setSelectedBook(state.book);
                                setSelectedChapter(state.chapter);
                                if (state.verseId) setTargetScrollVerse(state.verseId);
                            } else {
                                setIsBrowseOpen(true);
                            }
                        } else {
                            setIsBrowseOpen(true);
                        }
                    } catch (e) { console.warn("Failed to load state", e); setIsBrowseOpen(true); }
                }
            }
            setLoading(false);
        } catch (e) {
            console.error(e);
            setError(`Failed to load Bible Index: ${e.message}`);
            setLoading(false);
        }
    };
    initIndex();
  }, []);

  // Auto-open Dialog if no book is selected
  useEffect(() => {
      if (!loading && !selectedBook) {
          setIsBrowseOpen(true);
      }
  }, [loading, selectedBook]);


  // Persistence & URL Sync
  useEffect(() => {
      if (loading || !selectedBook || !selectedChapter) return;

      const save = () => {
          // Force the URL to prioritize targetScrollVerse until it is explicitly cleared
          const vToSave = targetScrollVerse || activeVerseId || activeVerseIdRef.current;
          const state = { book: selectedBook, chapter: selectedChapter, verseId: vToSave };
          localStorage.setItem('bible_browser_state', JSON.stringify(state));

          const url = new URL(window.location);
          url.searchParams.set('book', selectedBook);
          url.searchParams.set('chapter', selectedChapter);

          if (vToSave) {
              const parts = vToSave.split('.');
              if (parts.length === 3) url.searchParams.set('verse', parts[2]);
          } else {
              url.searchParams.delete('verse');
          }
          window.history.replaceState({}, '', url);
      };

      // Debounce saves
      const handler = setTimeout(save, 500);
      return () => clearTimeout(handler);
  }, [selectedBook, selectedChapter, activeVerseId, loading, targetScrollVerse]); // Ensure targetScrollVerse is in dependency array

  // Scroll Restoration
  useEffect(() => {
      // Don't attempt scroll until loading is finished and data is present
      if (!loading && targetScrollVerse && verseMap && sortedVids.length > 0) {

          let cleanTarget = targetScrollVerse;
          if (cleanTarget.split('.').length === 3) {
             const [b, c, v] = cleanTarget.split('.');
             cleanTarget = `${b}.${c}.${parseInt(v)}`; // ensure v is clean integer string
          }

          // If the targetScrollVerse is exactly in our sortedVids (e.g. from the dialog), use it immediately
          let resolvedVid = sortedVids.includes(cleanTarget) ? cleanTarget : null;

          // We search verseMap to see if the focalTranslation (or any translation) has a matching displayVid.
          if (!resolvedVid) {
              const searchTarget = cleanTarget;
              for (const vid of sortedVids) {
                  const translations = verseMap[vid];
                  if (!translations) continue;

                  // Check focal first
                  if (focalTranslation && translations[focalTranslation]?.displayVid === searchTarget) {
                      resolvedVid = vid;
                      break;
                  }

                  // Fallback to checking any translation
                  for (const key in translations) {
                      if (translations[key]?.displayVid === searchTarget) {
                          resolvedVid = vid;
                          break;
                      }
                  }
                  if (resolvedVid) {
                      console.log("Resolved via translation displayVid:", resolvedVid);
                      break;
                  }
              }
          }

          // Third fallback: we know it's missing from the data exactly, but maybe it's combined into a range
          // Check if any visible display string contains the target verse (e.g., "PSA.119.150-PSA.119.151")
          if (!resolvedVid && cleanTarget.split('.').length === 3) {
              const [, , targetV] = cleanTarget.split('.');
              const targetInt = parseInt(targetV);

              for (const vid of sortedVids) {
                  const translations = verseMap[vid];
                  if (!translations) continue;

                  const fData = translations[focalTranslation];
                  if (fData && fData.displayVid) {
                     const parts = fData.displayVid.split('-');
                     if (parts.length === 2 && parts[0].includes('.') && parts[1].includes('.')) {
                         const startV = parseInt(parts[0].split('.')[2]);
                         const endV = parseInt(parts[1].split('.')[2]);
                         if (targetInt >= startV && targetInt <= endV) {
                             resolvedVid = vid;
                             console.log("Resolved via translation displayVid range fallback:", resolvedVid);
                             break;
                         }
                     }
                  }
              }
          }

          // Final fallback: if the target verse is completely missing (not in ranges or exact IDs),
          // fallback to the closest preceding verse to at least get them to the right general area,
          // instead of failing silently and causing URL to clear/overwrite.
          if (!resolvedVid && cleanTarget.split('.').length === 3) {
              const targetV = parseInt(cleanTarget.split('.')[2]);
              let bestDiff = Infinity;

              for (const vId of sortedVids) {
                  const curV = parseInt(vId.split('.')[2]);
                  const diff = Math.abs(curV - targetV);
                  if (diff < bestDiff) {
                      bestDiff = diff;
                      resolvedVid = vId;
                  }
              }
              console.log("Resolved via closest visible verse fallback:", resolvedVid);
          }

          if (!resolvedVid && sortedVids.length > 0) {
              resolvedVid = sortedVids[0];
          }

          // Exact match was handled above.
          // If the target verse doesn't exist in our sparse data, default to the closest visible verse
          // to prevent the target scroll loop from clearing the URL entirely.
          if (!resolvedVid) {
              // Attempt to find the closest verse in the chapter
              const [b, c, v] = cleanTarget.split('.');
              const targetV = parseInt(v);
              let closestVid = sortedVids[0];
              let minDiff = Infinity;

              for (const vId of sortedVids) {
                  const curV = parseInt(vId.split('.')[2]);
                  const diff = Math.abs(curV - targetV);
                  if (diff < minDiff) {
                      minDiff = diff;
                      closestVid = vId;
                  }
              }
              resolvedVid = closestVid;
          }

          if (resolvedVid) {
              let attempts = 0;
              let foundAndScrolled = 0;
              const tryScroll = () => {
                  const el = document.getElementById(`verse-${resolvedVid}`);
                  if (el) {
                      el.scrollIntoView({ behavior: 'auto', block: 'center' });
                      setActiveVerseId(resolvedVid);
                      foundAndScrolled++;

                      if (foundAndScrolled < 3) {
                          setTimeout(tryScroll, 150);
                      } else {
                          // Final scroll using smooth behavior to ensure it lands exactly where intended
                          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                          setTargetScrollVerse(null);
                      }
                  } else if (attempts < 20) {
                      attempts++;
                      setTimeout(tryScroll, 50);
                  } else {
                      setTargetScrollVerse(null);
                  }
              };
              setTimeout(tryScroll, 50);
          } else {
             setTargetScrollVerse(null);
          }
      }
  }, [loading, targetScrollVerse, verseMap, sortedVids, focalTranslation]);

  // 2. Load Content when Selection Changes
  useEffect(() => {
    if (!selectedBook || !selectedChapter || !index) return;

    const loadContent = async () => {
        setLoading(true);
        setError(null);
        setVerseMap(null);

        try {
            const days = index[selectedBook][selectedChapter];
            if (!days || days.length === 0) throw new Error("No data found for this chapter.");

            // Load all relevant days
            const dayDataList = await Promise.all(days.map(d => loadDailyBread(d)));

            // Merge maps
            const mergedMap = {};
            const keys = new Set();

            dayDataList.forEach(d => {
                if (d.verseMap) {
                    Object.assign(mergedMap, d.verseMap);
                    d.availableTranslations.forEach(k => keys.add(k));
                }
            });

            // Filter for Selected Chapter (Strict Prefix Match: "GEN.1.")
            // Note: Use dot to avoid "GEN.11" matching "GEN.1" prefix logic if naive.
            // Map known discrepancies between standard 3-letter codes and the raw USFM/OSIS data codes
            const BOOK_MAP = {
                'SON': 'SNG', // Song of Solomon
                'JOE': 'JOL', // Joel
                'NAH': 'NAM'  // Nahum
            };
            const dataBook = BOOK_MAP[selectedBook] || selectedBook;
            const prefix = `${dataBook}.${selectedChapter}.`;
            const filteredVids = Object.keys(mergedMap).filter(vid => vid.startsWith(prefix));

            if (filteredVids.length === 0) throw new Error("Chapter content missing from data.");

            // Sort
            filteredVids.sort((a,b) => {
               const vA = parseInt(a.split('.')[2]);
               const vB = parseInt(b.split('.')[2]);
               return vA - vB;
            });

            // Map the matched keys back to the standard selectedBook code (e.g. SNG -> SON)
            // This ensures all downstream consumers like targetScrollVerse which use 'SON' work perfectly.
            const normalizedFilteredVids = filteredVids.map(vid => vid.replace(`${dataBook}.`, `${selectedBook}.`));

            const finalMap = {};
            filteredVids.forEach((vid, i) => {
                const normalizedVid = normalizedFilteredVids[i];
                finalMap[normalizedVid] = mergedMap[vid];
            });

            setVerseMap(finalMap);
            setSortedVids(normalizedFilteredVids);
            setAvailableTranslations(Array.from(keys));



            // Initial Translation Set
            if (keys.size > 0) {
               if (!focalTranslation || !keys.has(focalTranslation)) setFocalTranslation(keys.has('lsv') ? 'lsv' : Array.from(keys)[0]);
               if (!compareTranslation || !keys.has(compareTranslation)) setCompareTranslation(keys.has('kjv') ? 'kjv' : Array.from(keys)[0]);
            }

            setLoading(false);
        } catch (e) {
            console.error(e);
            setError(e.message);
            setLoading(false);
        }
    };
    loadContent();
  }, [selectedBook, selectedChapter, index]);

  // Dynamic Slots & Grouping
  const dynamicSlots = useMemo(() => {
    if (!focalTranslation || !compareTranslation) return { top: TRANSLATION_REGISTRY.original, middle: {}, bottom: {} };
    const focalConfig = TRANSLATION_REGISTRY[focalTranslation];
    const compareConfig = TRANSLATION_REGISTRY[compareTranslation];
    return {
        top: TRANSLATION_REGISTRY.original,
        middle: { source: compareTranslation, label: compareConfig?.label || compareTranslation.toUpperCase(), isHebrewGreek: false },
        bottom: { source: focalTranslation, label: focalConfig?.label || focalTranslation.toUpperCase(), isFocal: true, isHebrewGreek: false, attribution: focalConfig?.attribution }
    };
  }, [focalTranslation, compareTranslation]);

  const groupedVids = useMemo(() => {
      if (!sortedVids.length) return [];
      // Simple grouping for now: Single verses unless special case needed
      // Reusing logic from index.html if needed, but for lookup simple array is mostly fine.
      // But let's keep consistency.
      const groups = [];
      let i = 0;
      while (i < sortedVids.length) {
          groups.push([sortedVids[i]]);
          i++;
      }
      return groups;
  }, [sortedVids]);

  // Observer for Scroll Tracking
  useEffect(() => {
    if (playbackStatus === 'playing' || loading || !verseMap || groupedVids.length === 0 || targetScrollVerse) return;
    const observer = new IntersectionObserver((entries) => {
      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        // Sort by distance to "reading line" (approx 120px from top)
        const bestEntry = intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top - 120) - Math.abs(b.boundingClientRect.top - 120))[0];
        setActiveVerseId(bestEntry.target.id.replace('verse-', ''));
      }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });

    groupedVids.forEach((group) => {
      const vid = group[0];
      const el = document.getElementById(`verse-${vid}`);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [playbackStatus, loading, verseMap, groupedVids]);

  // Audio Playback
  const playVerse = (vid) => {
      // Simplified playback for browser: Just speak the focal text
      window.speechSynthesis.cancel();
      setPlaybackVerseId(vid);

      const text = verseMap[vid]?.[dynamicSlots.bottom.source]?.text;
      if (!text) return;

      const u = new SpeechSynthesisUtterance(text.replace(/YHWH/g, 'Yaw-weigh').replace(/[\[\]]/g, ''));
      u.onend = () => {
          if (playbackStatusRef.current !== 'playing') return;
          const idx = sortedVids.indexOf(vid);
          if (idx < sortedVids.length - 1) playVerse(sortedVids[idx+1]);
          else setPlaybackStatus('stopped');
      };
      window.speechSynthesis.speak(u);

      const el = document.getElementById(`verse-${vid}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  const navigateVerse = (direction) => {
      if (!sortedVids || sortedVids.length === 0) return;
      let currentIndex = -1;
      if (activeVerseIdRef.current) currentIndex = sortedVids.indexOf(activeVerseIdRef.current);
      if (currentIndex === -1 && direction > 0) currentIndex = -1;
      else if (currentIndex === -1 && direction < 0) currentIndex = 0;
      let nextIndex = currentIndex + direction;
      if (nextIndex < 0) nextIndex = 0;
      if (nextIndex >= sortedVids.length) nextIndex = sortedVids.length - 1;
      if (nextIndex !== currentIndex) {
          const nextVid = sortedVids[nextIndex];
          setActiveVerseId(nextVid);
          const el = document.getElementById(`verse-${nextVid}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
  };

  const handleToggle = () => {
      if (playbackStatus === 'playing') {
          window.speechSynthesis.pause();
          setPlaybackStatus('paused');
      } else if (playbackStatus === 'paused') {
          window.speechSynthesis.resume();
          setPlaybackStatus('playing');
      } else {
          setPlaybackStatus('playing');
          playVerse(activeVerseIdRef.current || sortedVids[0]);
      }
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
      switch(e.key) {
        case 'ArrowUp': e.preventDefault(); navigateVerse(-1); break;
        case 'ArrowDown': e.preventDefault(); navigateVerse(1); break;
        case 'k': case 'K': handleToggle(); break;
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [sortedVids, playbackStatus]);

  return (
    <div className="min-h-screen bg-[#fdfcfb] text-stone-900 pb-12">
      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-stone-900 focus:text-white focus:font-bold focus:rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xl transition-all print:hidden">Skip to Content</a>
      <header className="w-full bg-white/95 border-b border-stone-200 py-2 px-3 sticky top-0 z-50 backdrop-blur-md shadow-sm">
        <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <div className="flex items-center gap-2">
                <a href="index.html" className="text-stone-400 hover:text-amber-600 transition-colors font-bold text-xs uppercase tracking-widest flex items-center gap-1">
                    <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                    Daily
                </a>

                <button
                    onClick={() => setIsBrowseOpen(true)}
                    className="bg-stone-100 hover:bg-stone-200 border-none rounded text-xs font-black uppercase tracking-tight py-1 px-3 focus:ring-2 focus:ring-amber-500 transition-colors flex items-center gap-1"
                >
                    <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                    Browse Bible
                </button>
                {selectedBook && selectedChapter && (
                    <span className="text-sm font-bold text-stone-600 hidden md:inline">
                        {BOOK_NAMES[selectedBook]} {selectedChapter}
                    </span>
                )}
            </div>

            {/* Translation Settings (Reuse logic) */}
            <div className="flex items-center gap-2">
                 {/* Only show if we have data */}
                 {verseMap && (
                     <button onClick={handleToggle} aria-keyshortcuts="k" className={`px-3 py-1 rounded-full font-bold text-xs uppercase ${playbackStatus==='playing'?'bg-amber-600 text-white':'bg-stone-200 text-stone-600'}`}>
                        {playbackStatus==='playing'?'Pause':(playbackStatus==='paused'?'Resume':'Listen')}
                     </button>
                 )}
            </div>
        </div>
      </header>


      <BibleBrowseDialog
        isOpen={isBrowseOpen}
        onClose={() => setIsBrowseOpen(false)}
        index={index}
        availableBooks={availableBooks}
        onSelect={(b, c, v) => {
            setSelectedBook(b);
            setSelectedChapter(c);
            setTargetScrollVerse(`${b}.${c}.${v}`);
        }}
      />

      <main id="main-content" tabIndex={-1} className="max-w-7xl mx-auto py-6 px-2 space-y-6 outline-none">
        {!selectedBook ? (
            <div className="text-center py-20 text-stone-400 font-serif italic">Select a book to begin</div>
        ) : loading ? (
            <Loader />
        ) : error ? (
            <div className="text-center text-red-500 py-10">{error}</div>
        ) : (
            groupedVids.map(group => (
                <VerseGroup
                    key={group[0]}
                    group={group}
                    verseMap={verseMap}
                    dynamicSlots={dynamicSlots}
                    isActive={(playbackStatus === 'playing' && playbackVerseId === group[0]) || (playbackStatus !== 'playing' && activeVerseId === group[0])}
                    isDimmed={playbackStatus === 'playing' && playbackVerseId !== group[0]}
                    isPlaying={playbackStatus === 'playing'}
                />
            ))
        )}
      </main>
      <ScrollToTop />
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
    <script src="https://esm.sh/run" type="module"></script>
</body>
</html>
