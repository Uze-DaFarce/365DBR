                                </button>
                            ))}
                        </div>
                    )}

                    {(step === 'chapter' || step === 'verse') && (
                        <div className="grid grid-cols-5 sm:grid-cols-7 gap-1.5 sm:gap-2 content-start pb-8">
                            {currentItems.map(item => (
                                <button key={item} onClick={() => step === 'chapter' ? handleChapterSelect(item) : handleVerseSelect(item)} className="bg-white border border-stone-300 rounded shadow-sm hover:border-amber-500 hover:bg-amber-50 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 flex items-center justify-center aspect-square text-lg sm:text-xl font-black text-stone-800 leading-none">
                                    {item}
                                </button>
                            ))}
                        </div>
                    )}

                </div>
            </div>
        </div>
    );
}

// --- END BIBLE BROWSE DIALOG ---

function App() {

  const [index, setIndex] = useState(null); // { GEN: { 1: [days], ... }, ... }
  const [availableBooks, setAvailableBooks] = useState([]);

  const [selectedBook, setSelectedBook] = useState(null);
  const [selectedChapter, setSelectedChapter] = useState(null);

  // Data for View
  const [verseMap, setVerseMap] = useState(null);
  const [sortedVids, setSortedVids] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [isBrowseOpen, setIsBrowseOpen] = useState(false);

  // Navigation Dialog State
  const [browseInitialStep, setBrowseInitialStep] = useState('testament');
  const [browseInitialTestament, setBrowseInitialTestament] = useState(null);
  const [browseInitialBook, setBrowseInitialBook] = useState(null);
  const [browseInitialChapter, setBrowseInitialChapter] = useState(null);

  // Translation State
  const [availableTranslations, setAvailableTranslations] = useState([]);
  const [focalTranslation, setFocalTranslation] = useState('lsv');
  const [compareTranslation, setCompareTranslation] = useState('kjv');
  const [isCompareOpen, setIsCompareOpen] = useState(false);
  const [isFocalOpen, setIsFocalOpen] = useState(false);

  // Playback
  const [playbackStatus, setPlaybackStatus] = useState('stopped');
  const [playbackVerseId, setPlaybackVerseId] = useState(null);
  const [activeVerseId, setActiveVerseId] = useState(null);
  const activeVerseIdRef = useRef(activeVerseId);
  useEffect(() => { activeVerseIdRef.current = activeVerseId; }, [activeVerseId]);
  const playbackStatusRef = useRef(playbackStatus);
  useEffect(() => { playbackStatusRef.current = playbackStatus; }, [playbackStatus]);
  const synthRef = useRef(window.speechSynthesis);

  // Persistence: Scroll Target
  const [targetScrollVerse, setTargetScrollVerse] = useState(null);

  // Track scroll lock across hook remounts
  const isScrollLockedRef = useRef(false);
  const isNavigatingRef = useRef(false);
  const navigationTimeoutRef = useRef(null);
  const scrollLockTimeoutRef = useRef(null);

  // Bookmarks State
  const [bookmarks, setBookmarks] = useState({});
  const [bookmarkDialogTarget, setBookmarkDialogTarget] = useState(null);

  // Optional Strong's (feature-detect local query API). Null base ⇒ UI hidden.
  const [queryApiBase, setQueryApiBase] = useState(null);
  const [strongsVerseId, setStrongsVerseId] = useState(null);
  const openStrongs = useCallback((vid) => {
    if (!vid) return;
    setStrongsVerseId(vid);
  }, []);
  const closeStrongs = useCallback(() => setStrongsVerseId(null), []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const base = await probeQueryApi(resolveQueryApiBase());
      if (!cancelled) setQueryApiBase(base);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (playbackStatus === 'playing') setStrongsVerseId(null);
  }, [playbackStatus]);

  // Load bookmarks on mount
  useEffect(() => {
      try {
          const saved = localStorage.getItem('bible_browser_bookmarks');
          if (saved) setBookmarks(JSON.parse(saved));
      } catch (e) { console.warn("Failed to load bookmarks", e); }
  }, []);

  const handleSaveBookmark = (slot, vid, color) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      const newBookmarks = { ...bookmarks };
      if (!vid) {
          delete newBookmarks[slot];
      } else {
          newBookmarks[slot] = { vid, color };
      }
      setBookmarks(newBookmarks);
      localStorage.setItem('bible_browser_bookmarks', JSON.stringify(newBookmarks));
  };

  const handleNavigateToBookmark = (vid) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      const parts = vid.split('.');
      if (parts.length === 3) {
          setSelectedBook(parts[0]);
          setSelectedChapter(parts[1]);
          setTargetScrollVerse(vid);
      }
  };

  // 1. Build Index on Mount
  useEffect(() => {
    const initIndex = async () => {
        try {
            // Cache busting to ensure fresh data
            const basePath = getBasePath();
            const res = await fetch(`${basePath}data/readings.json?v=` + new Date().getTime());
            if (!res.ok) throw new Error(`Failed to load readings.json: ${res.status}`);
            const readings = await res.json();
            console.log("Loaded readings:", readings.length);

            const newIndex = {};
            const books = new Set();

            readings.forEach(day => {
                if (!day.api_format) return;
                const ranges = day.api_format.split(',');
                ranges.forEach(range => {
                    const subRanges = range.split(';');
                    subRanges.forEach(part => {
                        // GEN.1.1-GEN.1.31
                        const [start, end] = part.split('-');
                        if (!end) return; // Guard against malformed ranges
                        const [sBook, sCh] = start.split('.');
                        const [eBook, eCh] = end.split('.');

                        const sBookIdx = BIBLE_BOOK_ORDER_MAP.get(sBook);
                        const eBookIdx = BIBLE_BOOK_ORDER_MAP.get(eBook);

                        if (sBookIdx === undefined || eBookIdx === undefined) {
                            console.warn("Unknown book code:", sBook, eBook);
                            return;
                        }

                        // Iterate Books
                        for (let bIdx = sBookIdx; bIdx <= eBookIdx; bIdx++) {
                            const book = BIBLE_BOOK_ORDER[bIdx];
                            books.add(book);
                            if (!newIndex[book]) newIndex[book] = {};

                            const isStartBook = (bIdx === sBookIdx);
                            const isEndBook = (bIdx === eBookIdx);

                            // Chapter Logic (Heuristic for sparse data)
                            // If same book range: iterate chapters sCh to eCh
                            if (isStartBook && isEndBook) {
                                for (let c = parseInt(sCh); c <= parseInt(eCh); c++) {
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                            } else if (isStartBook) {
                                // Cross book: Add from start chapter to end of book
                                const startC = parseInt(sCh);
                                const maxC = VERSE_COUNTS[book] ? VERSE_COUNTS[book].length : startC;
                                for (let c = startC; c <= maxC; c++) {
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                            } else if (isEndBook) {
                                // Cross book: Add from chapter 1 to end chapter
                                const endC = parseInt(eCh);
                                for (let c = 1; c <= endC; c++) {
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                            } else {
                                // Cross book: Entire book is in between, add all its chapters
                                const maxC = VERSE_COUNTS[book] ? VERSE_COUNTS[book].length : 1;
                                for (let c = 1; c <= maxC; c++) {
                                    if (!newIndex[book][c]) newIndex[book][c] = [];
                                    if (!newIndex[book][c].includes(day.day)) newIndex[book][c].push(day.day);
                                }
                            }
                        }
                    });
                });
            });

            setIndex(newIndex);
            const bookList = Array.from(books).sort((a,b) => (BIBLE_BOOK_ORDER_MAP.get(a)||0) - (BIBLE_BOOK_ORDER_MAP.get(b)||0));
            console.log("Books found:", bookList);
            if (bookList.length === 0) {
                setError("No books found in index. Please verify data.");
            } else {
                setAvailableBooks(bookList);

                // Initialize State from URL or LocalStorage
                const params = new URLSearchParams(window.location.search);
                let urlBook = params.get('book');
                let urlChapter = params.get('chapter');
                const urlVerse = params.get('verse');

                // Support Path-based routing (Static Site Generation)
                // Format: .../GEN/1/...
                const pathMatch = window.location.pathname.match(/\/([A-Z0-9]{3})\/(\d+)(\/|\/index\.html)?$/);
                if (pathMatch) {
                    urlBook = pathMatch[1];
                    urlChapter = pathMatch[2];
                }

                if (urlBook && urlChapter && newIndex[urlBook] && newIndex[urlBook][urlChapter]) {
                    setSelectedBook(urlBook);
                    setSelectedChapter(urlChapter);
                    if (urlVerse) {
                        const fullVid = `${urlBook}.${urlChapter}.${urlVerse}`;
                        setTargetScrollVerse(fullVid);
                        setActiveVerseId(fullVid);
                    }
                } else {
                    try {
                        const saved = localStorage.getItem('bible_browser_state');
                        if (saved) {
                            const state = JSON.parse(saved);
                            if (state.book && state.chapter && newIndex[state.book] && newIndex[state.book][state.chapter]) {
                                setSelectedBook(state.book);
                                setSelectedChapter(state.chapter);
                                if (state.verseId) {
                                    setTargetScrollVerse(state.verseId);
                                    setActiveVerseId(state.verseId);
                                }
                            } else {
                                setIsBrowseOpen(true);
                            }
                        } else {
                            setIsBrowseOpen(true);
                        }
                    } catch (e) { console.warn("Failed to load state", e); setIsBrowseOpen(true); }
                }
            }
            setLoading(false);
        } catch (e) {
            console.error(e);
            setError(`Failed to load Bible Index: ${e.message}`);
            setLoading(false);
        }
    };
    initIndex();
  }, []);

  // Auto-open Dialog if no book is selected
  useEffect(() => {
      if (!loading && !selectedBook) {
          openBrowseDialog();
      }
  }, [loading, selectedBook]);

  const openBrowseDialog = (step = 'testament', testament = null, book = null, chapter = null) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      setBrowseInitialStep(step);
      setBrowseInitialTestament(testament);
      setBrowseInitialBook(book);
      setBrowseInitialChapter(chapter);
      setIsBrowseOpen(true);
  };


  // Persistence & URL Sync
  useEffect(() => {
      if (loading || !selectedBook || !selectedChapter) return;

      const save = () => {
          // Force the URL to prioritize targetScrollVerse until it is explicitly cleared
          const vToSave = targetScrollVerse || activeVerseId || activeVerseIdRef.current;
          const state = { book: selectedBook, chapter: selectedChapter, verseId: vToSave };
          localStorage.setItem('bible_browser_state', JSON.stringify(state));

          const url = new URL(window.location);
          url.searchParams.set('book', selectedBook);
          url.searchParams.set('chapter', selectedChapter);

          if (vToSave) {
              const parts = vToSave.split('.');
              if (parts.length === 3) url.searchParams.set('verse', parts[2]);
          } else {
              url.searchParams.delete('verse');
          }
          window.history.replaceState({}, '', url);
      };

      // Debounce saves
      const handler = setTimeout(save, 500);
      return () => clearTimeout(handler);
  }, [selectedBook, selectedChapter, activeVerseId, loading, targetScrollVerse]); // Ensure targetScrollVerse is in dependency array

  // Scroll Restoration
  useEffect(() => {
      // Don't attempt scroll until loading is finished and data is present
      if (!loading && targetScrollVerse && verseMap && sortedVids.length > 0) {

          let cleanTarget = targetScrollVerse;
          if (cleanTarget.split('.').length === 3) {
             const [b, c, v] = cleanTarget.split('.');
             cleanTarget = `${b}.${c}.${parseInt(v)}`; // ensure v is clean integer string
          }

          // If the targetScrollVerse is exactly in our sortedVids (e.g. from the dialog), use it immediately
          let resolvedVid = sortedVids.includes(cleanTarget) ? cleanTarget : null;

          // We search verseMap to see if the focalTranslation (or any translation) has a matching displayVid.
          if (!resolvedVid) {
              const searchTarget = cleanTarget;
              for (const vid of sortedVids) {
                  const translations = verseMap[vid];
                  if (!translations) continue;

                  // Check focal first
                  if (focalTranslation && translations[focalTranslation]?.displayVid === searchTarget) {
                      resolvedVid = vid;
                      break;
                  }

                  // Fallback to checking any translation
                  for (const key in translations) {
                      if (translations[key]?.displayVid === searchTarget) {
                          resolvedVid = vid;
                          break;
                      }
                  }
                  if (resolvedVid) {
                      console.log("Resolved via translation displayVid:", resolvedVid);
                      break;
                  }
              }
          }

          // Third fallback: we know it's missing from the data exactly, but maybe it's combined into a range
          // Check if any visible display string contains the target verse (e.g., "PSA.119.150-PSA.119.151")
          if (!resolvedVid && cleanTarget.split('.').length === 3) {
              const [, , targetV] = cleanTarget.split('.');
              const targetInt = parseInt(targetV);

              for (const vid of sortedVids) {
                  const translations = verseMap[vid];
                  if (!translations) continue;

                  const fData = translations[focalTranslation];
                  if (fData && fData.displayVid) {
                     const parts = fData.displayVid.split('-');
                     if (parts.length === 2 && parts[0].includes('.') && parts[1].includes('.')) {
                         const startV = parseInt(parts[0].split('.')[2]);
                         const endV = parseInt(parts[1].split('.')[2]);
                         if (targetInt >= startV && targetInt <= endV) {
                             resolvedVid = vid;
                             console.log("Resolved via translation displayVid range fallback:", resolvedVid);
                             break;
                         }
                     }
                  }
              }
          }

          // Final fallback: if the target verse is completely missing (not in ranges or exact IDs),
          // fallback to the closest preceding verse to at least get them to the right general area,
          // instead of failing silently and causing URL to clear/overwrite.
          if (!resolvedVid && cleanTarget.split('.').length === 3) {
              const targetV = parseInt(cleanTarget.split('.')[2]);
              let bestDiff = Infinity;

              for (const vId of sortedVids) {
                  const curV = parseInt(vId.split('.')[2]);
                  const diff = Math.abs(curV - targetV);
                  if (diff < bestDiff) {
                      bestDiff = diff;
                      resolvedVid = vId;
                  }
              }
              console.log("Resolved via closest visible verse fallback:", resolvedVid);
          }

          if (!resolvedVid && sortedVids.length > 0) {
              resolvedVid = sortedVids[0];
          }

          // Exact match was handled above.
          // If the target verse doesn't exist in our sparse data, default to the closest visible verse
          // to prevent the target scroll loop from clearing the URL entirely.
          if (!resolvedVid) {
              // Attempt to find the closest verse in the chapter
              const [b, c, v] = cleanTarget.split('.');
              const targetV = parseInt(v);
              let closestVid = sortedVids[0];
              let minDiff = Infinity;

              for (const vId of sortedVids) {
                  const curV = parseInt(vId.split('.')[2]);
                  const diff = Math.abs(curV - targetV);
                  if (diff < minDiff) {
                      minDiff = diff;
                      closestVid = vId;
                  }
              }
              resolvedVid = closestVid;
          }

          if (resolvedVid) {
              let attempts = 0;
              let foundAndScrolled = 0;
              const tryScroll = () => {
                  const el = document.getElementById(`verse-${resolvedVid}`);
                  if (el) {
                      const isIframe = window !== window.parent;
                      let targetY;
                      if (isIframe) {
                          const focalSlot = el.querySelector('.flex.flex-col > div:nth-child(3)');
                          if (focalSlot) {
                              const rect = focalSlot.getBoundingClientRect();
                              targetY = window.scrollY + rect.top - 80;
                          } else {
                              const rect = el.getBoundingClientRect();
                              targetY = window.scrollY + rect.top - 80;
                          }
                      } else {
                          const rect = el.getBoundingClientRect();
                          const absoluteTop = window.scrollY + rect.top;
                          targetY = absoluteTop - 60;
                      }

                      window.dispatchEvent(new CustomEvent('scrolllock'));
                      window.scrollTo({ top: targetY, behavior: 'auto' });
                      setActiveVerseId(resolvedVid);
                      foundAndScrolled++;

                      if (foundAndScrolled < 3) {
                          setTimeout(tryScroll, 150);
                      } else {
                          // Final scroll using smooth behavior to ensure it lands exactly where intended
                          window.dispatchEvent(new CustomEvent('scrolllock'));
                          window.scrollTo({ top: targetY, behavior: 'smooth' });
                          setTargetScrollVerse(null);
                      }
                  } else if (attempts < 20) {
                      attempts++;
                      setTimeout(tryScroll, 50);
                  } else {
                      setTargetScrollVerse(null);
                  }
              };
              setTimeout(tryScroll, 50);
          } else {
             setTargetScrollVerse(null);
          }
      }
  }, [loading, targetScrollVerse, verseMap, sortedVids, focalTranslation]);

  // 2. Load Content when Selection Changes
  useEffect(() => {
    if (!selectedBook || !selectedChapter || !index) return;

    const loadContent = async () => {
        setLoading(true);
        setError(null);
        setVerseMap(null);

        try {
            const days = index[selectedBook][selectedChapter];
            if (!days || days.length === 0) throw new Error("No data found for this chapter.");

            // Load all relevant days
            const dayDataList = await Promise.all(days.map(d => loadDailyBread(d)));

            // Merge maps
            const mergedMap = {};
            const keys = new Set();

            dayDataList.forEach(d => {
                if (d.verseMap) {
                    Object.assign(mergedMap, d.verseMap);
                    d.availableTranslations.forEach(k => keys.add(k));
                }
            });

            // Filter for Selected Chapter (Strict Prefix Match: "GEN.1.")
            // Note: Use dot to avoid "GEN.11" matching "GEN.1" prefix logic if naive.
            // Filter for Selected Chapter (Strict Prefix Match: "GEN.1.")
            // Note: Use dot to avoid "GEN.11" matching "GEN.1" prefix logic if naive.
            const prefix = `${selectedBook}.${selectedChapter}.`;
            const filteredVids = Object.keys(mergedMap).filter(vid => vid.startsWith(prefix));

            if (filteredVids.length === 0) throw new Error("Chapter content missing from data.");

            // Sort
            filteredVids.sort((a,b) => {
               const vA = parseInt(a.split('.')[2]);
               const vB = parseInt(b.split('.')[2]);
               return vA - vB;
            });

            const finalMap = {};
            filteredVids.forEach(vid => finalMap[vid] = mergedMap[vid]);

            setVerseMap(finalMap);
            setSortedVids(filteredVids);
            setAvailableTranslations(Array.from(keys));



            // Initial Translation Set
            if (keys.size > 0) {
               if (!focalTranslation || !keys.has(focalTranslation)) setFocalTranslation(keys.has('lsv') ? 'lsv' : Array.from(keys)[0]);
               if (!compareTranslation || !keys.has(compareTranslation)) setCompareTranslation(keys.has('kjv') ? 'kjv' : Array.from(keys)[0]);
            }

            setLoading(false);
        } catch (e) {
            console.error(e);
            setError(e.message);
            setLoading(false);
        }
    };
    loadContent();
  }, [selectedBook, selectedChapter, index]);

  // Dynamic Slots & Grouping
  const dynamicSlots = useMemo(() => {
    if (!focalTranslation || !compareTranslation) return { top: TRANSLATION_REGISTRY.original, middle: {}, bottom: {} };
    const focalConfig = TRANSLATION_REGISTRY[focalTranslation];
    const compareConfig = TRANSLATION_REGISTRY[compareTranslation];
    return {
        top: TRANSLATION_REGISTRY.original,
        middle: { source: compareTranslation, label: compareConfig?.label || compareTranslation.toUpperCase(), isHebrewGreek: false },
        bottom: { source: focalTranslation, label: focalConfig?.label || focalTranslation.toUpperCase(), isFocal: true, isHebrewGreek: false, attribution: focalConfig?.attribution }
    };
  }, [focalTranslation, compareTranslation]);

  const groupedVids = useMemo(() => {
      if (!sortedVids.length) return [];
      // Simple grouping for now: Single verses unless special case needed
      // Reusing logic from index.html if needed, but for lookup simple array is mostly fine.
      // But let's keep consistency.
      const groups = [];
      let i = 0;
      while (i < sortedVids.length) {
          groups.push([sortedVids[i]]);
          i++;
      }
      return groups;
  }, [sortedVids]);

  // Observer for Scroll Tracking
  useEffect(() => {
    const handleVerseClickedEvent = (e) => {
        setTargetScrollVerse(e.detail.vid);
    };
    window.addEventListener('verseclicked', handleVerseClickedEvent);

    if (playbackStatus === 'playing' || loading || !verseMap || groupedVids.length === 0 || targetScrollVerse) {
        return () => window.removeEventListener('verseclicked', handleVerseClickedEvent);
    }
    const isIframe = window !== window.parent;

    const handleScrollLock = () => {
        isScrollLockedRef.current = true;
        if (scrollLockTimeoutRef.current) clearTimeout(scrollLockTimeoutRef.current);
        // Extend the lock slightly in iframe to ensure the programmatic scroll completely settles
        // before the intersection observer starts firing again and potentially jumping verses.
        const lockDuration = isIframe ? 1200 : 800;
        scrollLockTimeoutRef.current = setTimeout(() => { isScrollLockedRef.current = false; }, lockDuration);
    };
    window.addEventListener('scrolllock', handleScrollLock);

    // For small iframes, use a tighter margin so we don't prematurely detect the next verse
    // when scrolled down to the focal translation (slot 3).
    // Using a very aggressive top margin to guarantee the target verse (which lands 80px from top)
    // is fully encompassed. We also add a threshold of [0, 0.1] to trigger more reliably when scrolling settles.
    const observerMargin = isIframe ? '200px 0px -40% 0px' : '-15% 0px -70% 0px';

    const observer = new IntersectionObserver((entries) => {
      if (isScrollLockedRef.current || isNavigatingRef.current) return;
      // Check if we are at the absolute bottom of the page first to prevent bounce-back
      // Use scrollHeight and Math.ceil/floor tolerance for cross-browser sub-pixel accuracy
      if (Math.ceil(window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 50) {
          return; // Let handleScroll manage the final verse
      }

      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        // We set targetY to window.scrollY + rect.top - 80 when programmatic scrolling.
        // This places the top of the element exactly 80px from the top of the viewport.
        // The referenceLine must match this behavior to prevent immediate reverting.
        const referenceLine = isIframe ? 80 : 120;
        const bestEntry = intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top - referenceLine) - Math.abs(b.boundingClientRect.top - referenceLine))[0];
        setActiveVerseId(bestEntry.target.id.replace('verse-', ''));
      }
    }, { rootMargin: observerMargin, threshold: [0, 0.1] });

    groupedVids.forEach((group) => {
      const vid = group[0];
      const el = document.getElementById(`verse-${vid}`);
      if (el) observer.observe(el);
    });

    const handleScroll = () => {
      if (Math.ceil(window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 50) {
         const lastGroup = groupedVids[groupedVids.length - 1];
         if (lastGroup) setActiveVerseId(lastGroup[0]);
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });

    return () => {
        window.removeEventListener('verseclicked', handleVerseClickedEvent);
        window.removeEventListener('scrolllock', handleScrollLock);
        if (scrollLockTimeoutRef.current) clearTimeout(scrollLockTimeoutRef.current);
        if (navigationTimeoutRef.current) clearTimeout(navigationTimeoutRef.current);
        observer.disconnect();
        window.removeEventListener('scroll', handleScroll);
    };
  }, [playbackStatus, loading, verseMap, groupedVids, targetScrollVerse]);

  // Audio Playback
  const playVerse = (vid) => {
      // Simplified playback for browser: Just speak the focal text
      window.speechSynthesis.cancel();
      setPlaybackVerseId(vid);

      const text = verseMap[vid]?.[dynamicSlots.bottom.source]?.text;
      if (!text) return;

      const u = new SpeechSynthesisUtterance(text.replace(/YHWH/g, 'Yaw-weigh').replace(/[\[\]]/g, ''));
      u.onend = () => {
          if (playbackStatusRef.current !== 'playing') return;
          const idx = sortedVids.indexOf(vid);
          if (idx < sortedVids.length - 1) playVerse(sortedVids[idx+1]);
          else setPlaybackStatus('stopped');
      };
      window.speechSynthesis.speak(u);

      const el = document.getElementById(`verse-${vid}`);
      if (el) {
          const rect = el.getBoundingClientRect();
          const absoluteTop = window.scrollY + rect.top;
          const targetY = absoluteTop - 60;
          window.scrollTo({ top: targetY, behavior: 'smooth' });
      }
  };

  // True when Next advances to the following book (last chapter of current book).
  const nextIsBook = useMemo(() => {
      if (!selectedBook || !selectedChapter) return false;
      const bookData = VERSE_COUNTS[selectedBook];
      if (!bookData) return false;
      return parseInt(selectedChapter, 10) >= bookData.length;
  }, [selectedBook, selectedChapter]);

  // True when Previous advances to the previous book (first chapter of current book).
  const prevIsBook = useMemo(() => {
      if (!selectedChapter) return false;
      return parseInt(selectedChapter, 10) <= 1;
  }, [selectedChapter]);

  const navigateChapter = useCallback((direction) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      if (!selectedBook || !selectedChapter || !availableBooks.length) return;

      const currentBookIndex = availableBooks.indexOf(selectedBook);
      if (currentBookIndex === -1) return;

      const currentChapter = parseInt(selectedChapter);
      let nextBookIndex = currentBookIndex;
      let nextChapter = currentChapter + direction;

      // Chapter bounds from VERSE_COUNTS (sourced from bible_common via bible_meta.js)
      const bookData = VERSE_COUNTS[selectedBook];
      if (!bookData) return;

      const maxChapter = bookData.length;

      if (nextChapter > maxChapter) {
          // Go to next book
          nextBookIndex++;
          if (nextBookIndex >= availableBooks.length) return; // End of Bible
          nextChapter = 1;
      } else if (nextChapter < 1) {
          // Go to previous book
          nextBookIndex--;
          if (nextBookIndex < 0) return; // Beginning of Bible
          // Set to last chapter of the previous book
          const prevBook = availableBooks[nextBookIndex];
          nextChapter = VERSE_COUNTS[prevBook] ? VERSE_COUNTS[prevBook].length : 1;
      }

      const nextBook = availableBooks[nextBookIndex];
      setSelectedBook(nextBook);
      setSelectedChapter(nextChapter.toString());
      setTargetScrollVerse(`${nextBook}.${nextChapter}.1`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [selectedBook, selectedChapter, availableBooks]);

  const navigateVerse = useCallback((direction) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      if (!sortedVids || sortedVids.length === 0) return;
      
      let currentIndex = -1;
      if (activeVerseIdRef.current) currentIndex = sortedVids.indexOf(activeVerseIdRef.current);
      if (currentIndex === -1 && direction > 0) currentIndex = -1;
      else if (currentIndex === -1 && direction < 0) currentIndex = 0;
      
      let nextIndex = currentIndex + direction;
      
      if (nextIndex < 0) nextIndex = 0;
      if (nextIndex >= sortedVids.length) nextIndex = sortedVids.length - 1;
      
      if (nextIndex !== currentIndex) {
          const nextVid = sortedVids[nextIndex];
          setActiveVerseId(nextVid);
          
          // Suspend IntersectionObserver during programmatic smooth scroll (approx 500ms-800ms)
          isNavigatingRef.current = true;
          if (navigationTimeoutRef.current) clearTimeout(navigationTimeoutRef.current);
          navigationTimeoutRef.current = setTimeout(() => { isNavigatingRef.current = false; }, 800);
          
          const el = document.getElementById(`verse-${nextVid}`);
          if (el) {
              const rect = el.getBoundingClientRect();
              const absoluteTop = window.scrollY + rect.top;
              const targetY = absoluteTop - 60;
              window.scrollTo({ top: targetY, behavior: 'smooth' });
          }
      }
  }, [sortedVids]);

  const handleToggle = () => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      if (playbackStatus === 'playing') {
          window.speechSynthesis.pause();
          setPlaybackStatus('paused');
      } else if (playbackStatus === 'paused') {
          window.speechSynthesis.resume();
          setPlaybackStatus('playing');
      } else {
          setPlaybackStatus('playing');
          playVerse(activeVerseIdRef.current || sortedVids[0]);
      }
  };

  // Focal change: previous focal moves to the middle (compare) slot.
  const handleFocalChange = useCallback((newFocal) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      if (!newFocal || newFocal === focalTranslation) {
        setIsFocalOpen(false);
        return;
      }
      const prevFocal = focalTranslation;
      setFocalTranslation(newFocal);
      if (prevFocal && prevFocal !== newFocal && availableTranslations.includes(prevFocal)) {
        setCompareTranslation(prevFocal);
      } else if (newFocal === compareTranslation) {
        const alt = availableTranslations.find((k) => k !== newFocal);
        if (alt) setCompareTranslation(alt);
      }
      setIsFocalOpen(false);
  }, [focalTranslation, compareTranslation, availableTranslations]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
      switch(e.key) {
        case 'ArrowLeft': navigateChapter(-1); break;
        case 'ArrowRight': navigateChapter(1); break;
        case 'ArrowUp': e.preventDefault(); navigateVerse(-1); break;
        case 'ArrowDown': e.preventDefault(); navigateVerse(1); break;
        case 'k': case 'K': handleToggle(); break;
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [sortedVids, playbackStatus, navigateChapter, navigateVerse]);

  return (
    <div className="min-h-screen bg-[#fdfcfb] text-stone-900 pb-12">
      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-stone-900 focus:text-white focus:font-bold focus:rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xl transition-all print:hidden">Skip to Content</a>
      <header className="w-full bg-white/95 border-b border-stone-200 py-1 px-2 min-[450px]:px-3 sticky top-0 z-50 backdrop-blur-md shadow-sm">

            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar w-full min-[450px]:w-auto justify-between min-[450px]:justify-start">
                <div className="flex items-center gap-2">
                    <a href="index.html" className="text-stone-400 hover:text-amber-600 transition-colors font-bold text-[10px] min-[450px]:text-[10px] uppercase tracking-widest flex items-center gap-1 shrink-0 px-1 py-1 border border-transparent hover:border-stone-200 rounded hidden min-[450px]:flex">
                        <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                        DBR
                    </a>

                    <button
                        onClick={(e) => { e.currentTarget.blur(); openBrowseDialog('testament'); }}
                        className="bg-stone-100 hover:bg-stone-200 border-none rounded text-[10px] min-[450px]:text-xs font-black uppercase tracking-tight py-1 px-2 min-[450px]:px-3 focus:ring-2 focus:ring-amber-500 transition-colors flex items-center gap-1 shrink-0"
                        aria-label="Browse Bible"
                    >
                        <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                        <span className="hidden min-[450px]:inline">Browse</span>
                    </button>
                    {selectedBook && selectedChapter && (
                        <div className="flex items-center text-xs min-[450px]:text-sm font-bold text-stone-600 shrink-0 uppercase tracking-tight gap-1 bg-stone-100 rounded px-0.5 relative group">
                            <button onClick={(e) => { e.currentTarget.blur(); navigateChapter(-1); }} aria-label={prevIsBook ? "Previous Book" : "Previous Chapter"} aria-keyshortcuts="ArrowLeft" title={prevIsBook ? "Previous Book (Left Arrow)" : "Previous Chapter (Left Arrow)"} className="p-1 font-black text-stone-900 hover:text-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded print:hidden">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M15 19l-7-7 7-7" /></svg>
                            </button>
                            <button onClick={(e) => { e.currentTarget.blur(); openBrowseDialog('book', NT_BOOKS.has(selectedBook) ? 'NT' : 'OT', null, null); }} className="hover:text-amber-600 hover:bg-stone-200 px-1 py-0.5 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500">{BOOK_NAMES[selectedBook]}</button>
                            <button onClick={(e) => { e.currentTarget.blur(); openBrowseDialog('chapter', NT_BOOKS.has(selectedBook) ? 'NT' : 'OT', selectedBook, null); }} className="hover:text-amber-600 hover:bg-stone-200 px-1 py-0.5 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500">{selectedChapter}</button>
                            {activeVerseId && activeVerseId.split('.').length === 3 && (
                                <>
                                    <span className="text-stone-400 font-black">:</span>
                                    <button onClick={(e) => { e.currentTarget.blur(); openBrowseDialog('verse', NT_BOOKS.has(selectedBook) ? 'NT' : 'OT', selectedBook, selectedChapter); }} className="hover:text-amber-600 hover:bg-stone-200 px-1 py-0.5 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500">{activeVerseId.split('.')[2]}</button>
                                </>
                            )}
                            <button onClick={(e) => { e.currentTarget.blur(); navigateChapter(1); }} aria-label={nextIsBook ? "Next Book" : "Next Chapter"} aria-keyshortcuts="ArrowRight" title={nextIsBook ? "Next Book (Right Arrow)" : "Next Chapter (Right Arrow)"} className="p-1 font-black text-stone-900 hover:text-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded print:hidden">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M9 5l7 7-7 7" /></svg>
                            </button>
                        </div>
                    )}
                </div>

                {/* Focal Dropdown (Mobile Row 1 Right / Desktop Right) */}
                {availableTranslations.length > 0 && (
                  <div className="relative mr-1 flex items-center min-[450px]:hidden">
                    <button onClick={() => { setIsFocalOpen(!isFocalOpen); setIsCompareOpen && setIsCompareOpen(false); }} aria-haspopup="true" aria-expanded={isFocalOpen} aria-label="Select Focal Translation" className="flex items-center gap-1 text-[10px] min-[450px]:text-xs font-black uppercase text-stone-600 hover:text-stone-900 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500 rounded" title="Select Focal (Audio) Translation">
                      {focalTranslation ? focalTranslation.toUpperCase() : '-'}
                      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className={`h-3 w-3 transition-transform duration-200 ${isFocalOpen ? 'rotate-180' : ''}`} viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                    </button>
                    {isFocalOpen && (
                      <>
                        <div className="fixed inset-0 z-40" onClick={() => setIsFocalOpen(false)}></div>
                        <div className="absolute right-0 top-full mt-1 w-24 bg-white border border-stone-200 shadow-lg rounded-md overflow-hidden z-50">
                          {availableTranslations.map(key => (
                            <button key={key} onClick={() => handleFocalChange(key)} className={`w-full flex items-center justify-between px-3 py-2 text-[10px] font-bold uppercase hover:bg-stone-100 focus:outline-none focus-visible:bg-stone-100 focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-amber-500 ${focalTranslation === key ? 'text-amber-600' : 'text-stone-600'}`}>
                              <span>{key}</span>
                              {focalTranslation === key && (
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                  <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                </svg>
                              )}
                            </button>
                          ))}
                        </div>
                      </>
                    )}
                  </div>
                 )}
            </div>

            {/* Bottom Row / Right Side: Translation Settings & Bookmarks */}
            <div className="flex w-full min-[450px]:w-auto items-center justify-between min-[450px]:justify-end gap-2 shrink-0 mt-1 min-[450px]:mt-0">
                 <div className="flex items-center gap-2">
                     <a href="index.html" className="text-stone-400 hover:text-amber-600 transition-colors font-bold text-[10px] min-[450px]:text-[10px] uppercase tracking-widest flex items-center gap-1 shrink-0 px-2 py-1 border border-transparent hover:border-stone-200 rounded min-[450px]:hidden">
                        <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                        DBR
                    </a>

                     {/* Bookmarks */}
                     <div className="flex items-center gap-1 bg-stone-100 rounded-full px-1.5 py-0.5 border border-stone-200 shadow-sm">
                         {[1, 2, 3, 4, 5].map(slot => {
                             const bm = bookmarks[slot];
                             if (!bm) return null;
                             return (
                                 <button
                                     key={slot}
                                     onClick={() => handleNavigateToBookmark(bm.vid)}
                                     className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black text-white ${bm.color.bg} ${bm.color.hover} transition-transform transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-1 ${bm.color.ring} shadow-sm`}
                                     title={`Go to ${bm.vid.replace(/\./g, ' ')}`}
                                 >
                                     {slot}
                                 </button>
                             );
                         })}
                     </div>

                     {/* Slot 3 Selector (Desktop Focal) */}
                     {availableTranslations.length > 0 && (
                      <div className="relative mr-1 hidden min-[450px]:flex items-center">
                        <button onClick={() => { setIsFocalOpen(!isFocalOpen); setIsCompareOpen && setIsCompareOpen(false); }} aria-haspopup="true" aria-expanded={isFocalOpen} aria-label="Select Focal Translation" className="flex items-center gap-1 text-[10px] min-[450px]:text-xs font-black uppercase text-stone-600 hover:text-stone-900 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500 rounded" title="Select Focal (Audio) Translation">
                          {focalTranslation ? focalTranslation.toUpperCase() : '-'}
                          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className={`h-3 w-3 transition-transform duration-200 ${isFocalOpen ? 'rotate-180' : ''}`} viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                        </button>
                        {isFocalOpen && (
                          <>
                            <div className="fixed inset-0 z-40" onClick={() => setIsFocalOpen(false)}></div>
                            <div className="absolute right-0 top-full mt-1 w-24 bg-white border border-stone-200 shadow-lg rounded-md overflow-hidden z-50">
                              {availableTranslations.map(key => (
                                <button key={key} onClick={() => handleFocalChange(key)} className={`w-full flex items-center justify-between px-3 py-2 text-[10px] font-bold uppercase hover:bg-stone-100 focus:outline-none focus-visible:bg-stone-100 focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-amber-500 ${focalTranslation === key ? 'text-amber-600' : 'text-stone-600'}`}>
                                  <span>{key}</span>
                                  {focalTranslation === key && (
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                      <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                    </svg>
                                  )}
                                </button>
                              ))}
                            </div>
                          </>
                        )}
                      </div>
                     )}
                 </div>

                 {/* Listen Button (Both Mobile Row 2 and Desktop Far Right) */}
                 <div className="flex items-center">
                     {verseMap && (
                         <button onClick={handleToggle} aria-keyshortcuts="k" className={`px-3 min-[450px]:px-5 py-1 rounded-full font-black text-[12px] uppercase tracking-tighter transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500 focus-visible:ring-offset-2 ${playbackStatus==='playing'?'bg-amber-600 text-white':'bg-stone-200 text-stone-600'} hover:opacity-90 transition-opacity`}>
                            {playbackStatus==='playing'?'Pause':(playbackStatus==='paused'?'Resume':'Listen')}
                         </button>
                     )}
                 </div>
            </div>
        </div>
      </header>


      <BibleBrowseDialog
        isOpen={isBrowseOpen}
        onClose={() => setIsBrowseOpen(false)}
        index={index}
        availableBooks={availableBooks}
        initialStep={browseInitialStep}
        initialTestament={browseInitialTestament}
        initialBook={browseInitialBook}
        initialChapter={browseInitialChapter}
        onSelect={(b, c, v) => {
            setSelectedBook(b);
            setSelectedChapter(c);
            setTargetScrollVerse(`${b}.${c}.${v}`);
        }}
      />

      <main id="main-content" tabIndex={-1} className="max-w-7xl mx-auto py-6 px-2 space-y-6 outline-none">
        {!selectedBook ? (
            <div className="text-center py-20 text-stone-400 font-serif italic">Select a book to begin</div>
        ) : loading ? (
            <Loader />
        ) : error ? (
            <div className="text-center text-red-500 py-10">{error}</div>
        ) : (
            groupedVids.map(group => (
                <VerseGroup
                    key={group[0]}
                    group={group}
                    verseMap={verseMap}
                    dynamicSlots={dynamicSlots}
                    isActive={(playbackStatus === 'playing' && playbackVerseId === group[0]) || (playbackStatus !== 'playing' && activeVerseId === group[0])}
                    isDimmed={playbackStatus === 'playing' && playbackVerseId !== group[0]}
                    isPlaying={playbackStatus === 'playing'}
                    // ⚡ Bolt Optimization: Pass state setter directly instead of inline arrow function
                    // to maintain stable reference and prevent O(N) re-renders of React.memo component
                    onBookmark={setBookmarkDialogTarget}
                    onOpenStrongs={openStrongs}
                    strongsAvailable={!!queryApiBase}
                />
            ))
        )}

        {selectedBook && selectedChapter && !loading && !error && (
            <div className="flex justify-center mt-12 mb-10 pb-20">
                <button
                    onClick={(e) => { e.currentTarget.blur(); navigateChapter(1); }}
                    aria-label={nextIsBook ? "Next Book" : "Next Chapter"}
                    className="flex items-center gap-2 px-6 py-3 bg-white border border-stone-300 rounded-full shadow-sm text-sm font-black uppercase tracking-widest text-stone-700 hover:text-amber-600 hover:border-amber-400 hover:bg-amber-50 transition-all focus:outline-none focus:ring-4 focus:ring-amber-500/30 group"
                >
                    {nextIsBook ? "Next Book" : "Next Chapter"}
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        )}
      </main>

      {strongsVerseId && queryApiBase && (
        <StrongsPanel
          verseId={strongsVerseId}
          apiBase={queryApiBase}
          preferredTranslation={focalTranslation}
          onClose={closeStrongs}
          onJumpVerse={(vid) => {
            setStrongsVerseId(vid);
            const parts = String(vid).split('.');
            if (parts.length === 3) {
              setSelectedBook(parts[0]);
              setSelectedChapter(parts[1]);
              setTargetScrollVerse(vid);
              setActiveVerseId(vid);
            }
          }}
        />
      )}

      <BookmarkDialog
          isOpen={!!bookmarkDialogTarget}
          onClose={() => setBookmarkDialogTarget(null)}
          onSave={handleSaveBookmark}
          bookmarks={bookmarks}
          targetVid={bookmarkDialogTarget}
      />

      <ScrollToTop />
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
    <script src="https://esm.sh/run" type="module"></script>
</body>
</html>
