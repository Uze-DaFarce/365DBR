    <!-- Single source of truth: generated from bible_common.py via export_bible_meta.py -->

    <script type="text/tsx">
import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';

// Optional DB Strong's — classic <script> (not ES import; esm.sh/run breaks ./relative paths).
const {
  probeQueryApi,
  fetchVerseDetail,
  fetchStrongHits,
  resolveQueryApiBase,
  formatVerseRef: formatVerseRefRaw,
} = window.__DBR_STRONGs__ || {
  probeQueryApi: async () => null,
  fetchVerseDetail: async () => { throw new Error('strongs_optional.js not loaded'); },
  fetchStrongHits: async () => { throw new Error('strongs_optional.js not loaded'); },
  resolveQueryApiBase: () => 'http://127.0.0.1:8765',
  formatVerseRef: (vid) => vid,
};
const formatVerseRef = (vid) => formatVerseRefRaw(vid, typeof BOOK_NAMES !== 'undefined' ? BOOK_NAMES : undefined);

/** --- CONFIGURATION & CONSTANTS --- **/
const TRANSLATION_REGISTRY = {
  original: { source: 'original', label: (isHebrew) => `ORIGINAL ${isHebrew ? 'HEBREW' : 'GREEK'}`, isHebrewGreek: true },
  kjv: { idPrefix: 'de4e12af', label: 'KJV - King James Version' },
  lsv: { idPrefix: '06125ada', altIds: ['01b29f4b342acc35-01'], label: 'LSV - Literal Standard Version', attribution: { text: '©', link: '#footer', title: 'View Copyright Information' } },
  web: { idPrefix: '9879dbb7', label: 'WEB - World English Bible' },
  nlt: { idPrefix: 'd6e14a62', label: 'NLT - New Living Translation' }
};

// Book order, names, and verse counts: bible_common.py → export_bible_meta.py → bible_meta.js
const _BIBLE_META = window.__BIBLE_META__;
if (!_BIBLE_META || !_BIBLE_META.verseCounts) {
  throw new Error('bible_meta.js missing or invalid. Run: python export_bible_meta.py');
}
const BOOK_NAMES = _BIBLE_META.bookNames;
const BIBLE_BOOK_ORDER = _BIBLE_META.bookOrder;
const VERSE_COUNTS = _BIBLE_META.verseCounts;
const BIBLE_BOOK_ORDER_MAP = new Map(BIBLE_BOOK_ORDER.map((b, i) => [b, i]));
const NT_BOOKS = new Set(_BIBLE_META.ntBooks);

const SECTION_THEMES = [
  { bg: 'bg-amber-600', shadow: 'shadow-amber-500/50', hover: 'hover:bg-amber-700', text: 'text-amber-600', ring: 'focus-visible:ring-amber-500' },
  { bg: 'bg-blue-600', shadow: 'shadow-blue-500/50', hover: 'hover:bg-blue-700', text: 'text-blue-600', ring: 'focus-visible:ring-blue-500' },
  { bg: 'bg-rose-600', shadow: 'shadow-rose-500/50', hover: 'hover:bg-rose-700', text: 'text-rose-600', ring: 'focus-visible:ring-rose-500' },
  { bg: 'bg-emerald-600', shadow: 'shadow-emerald-500/50', hover: 'hover:bg-emerald-700', text: 'text-emerald-600', ring: 'focus-visible:ring-emerald-500' }
];

const FOCAL_THEMES = [
  { bg: 'bg-amber-100', border: 'border-amber-500', ring: 'ring-amber-500/50', text: 'text-amber-700', linkHover: 'hover:text-amber-600', linkRing: 'focus-visible:ring-amber-500' },
  { bg: 'bg-blue-100', border: 'border-blue-500', ring: 'ring-blue-500/50', text: 'text-blue-700', linkHover: 'hover:text-blue-600', linkRing: 'focus-visible:ring-blue-500' },
  { bg: 'bg-rose-100', border: 'border-rose-500', ring: 'ring-rose-500/50', text: 'text-rose-700', linkHover: 'hover:text-rose-600', linkRing: 'focus-visible:ring-rose-500' },
  { bg: 'bg-emerald-100', border: 'border-emerald-500', ring: 'ring-emerald-500/50', text: 'text-emerald-700', linkHover: 'hover:text-emerald-600', linkRing: 'focus-visible:ring-emerald-500' }
];

/** --- DATA UTILITIES (English-primary; titles per translation, not merged into body) --- **/
const TITLE_PARA_STYLES = new Set(['d', 's', 's1', 's2', 's3', 'ms', 'ms1', 'ms2', 'mr', 'r', 'sp', 'qa']);
function titlePlain(t) {
  if (!t) return '';
  if (typeof t === 'string') return t.trim();
  return String(t.text || t.value || '').trim();
}
function uniqueTitleList(list) {
  const out = [];
  const seen = new Set();
  if (!Array.isArray(list)) return out;
  for (let i = 0; i < list.length; i++) {
    const s = titlePlain(list[i]);
    if (!s) continue;
    const key = s.replace(/\s+/g, ' ').toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(s);
  }
  return out;
}
function collectGroupTitles(group, verseMap, source) {
  const merged = [];
  if (!source) return merged;
  for (let i = 0; i < group.length; i++) {
    const data = verseMap[group[i]];
    const list = data && data[source] && data[source].titles;
    if (Array.isArray(list)) merged.push(...list);
  }
  return uniqueTitleList(merged);
}
function VerseHeading({ text, active }) {
  if (!text) return null;
  return (
    <p className={`font-serif italic mb-1 leading-snug text-sm md:text-base ${active ? 'text-stone-700' : 'text-stone-400'}`}>
      <span className="text-[10px] uppercase font-bold tracking-wide text-stone-400 not-italic mr-1.5">Heading</span>
      {text}
    </p>
  );
}
function collectTextUnder(item) {
  const parts = [];
  if (!item || typeof item !== 'object') return '';
  if (item.type === 'text' && item.text) parts.push(item.text);
  (item.items || []).forEach((ch) => parts.push(collectTextUnder(ch)));
  return parts.join('');
}
function ensureVerseEntry(map, vid, versionKey) {
  if (!map[vid]) map[vid] = {};
  if (versionKey && !map[vid][versionKey]) map[vid][versionKey] = { text: [], displayVid: vid };
  return map[vid];
}
function walkEnglishItems(items, map, versionKey, orgToEnglish, orgToAll, context) {
  if (!items) return;
  for (const item of items) {
    const attrs = item.attrs || {};
    const style = attrs.style || '';
    if (item.name === 'para' && TITLE_PARA_STYLES.has(style)) {
      const titleText = collectTextUnder(item).trim();
      if (titleText) context.pendingTitles.push(titleText);
      continue;
    }
    const previousActiveVid = context.activeVid;
    if (attrs.verseId) {
      const engVid = attrs.verseId;
      const orgs = attrs.verseOrgIds || [];
      if (orgs.length > 0 && orgs[0]) {
        const org = orgs[0];
        if (!orgToEnglish[org]) orgToEnglish[org] = engVid;
        if (!orgToAll[org]) orgToAll[org] = [];
        if (!orgToAll[org].includes(engVid)) orgToAll[org].push(engVid);
      }
      context.activeVid = engVid;
      context.lastSeenVid = engVid;
      ensureVerseEntry(map, engVid, versionKey);
      if (context.pendingTitles.length > 0) {
        if (!map[engVid][versionKey].titles) map[engVid][versionKey].titles = [];
        map[engVid][versionKey].titles.push(...context.pendingTitles);
        context.pendingTitles = [];
      }
    }
    if (item.type === 'text' && item.text) {
      if (context.activeVid && map[context.activeVid] && map[context.activeVid][versionKey]) {
        map[context.activeVid][versionKey].text.push(item.text);
      } else if (item.text.trim().length > 0 && context.lastSeenVid && map[context.lastSeenVid] && map[context.lastSeenVid][versionKey]) {
        map[context.lastSeenVid][versionKey].text.push(item.text);
      }
    }
    if (item.items && item.items.length > 0) walkEnglishItems(item.items, map, versionKey, orgToEnglish, orgToAll, context);
    context.activeVid = previousActiveVid;
  }
}
function walkOriginalItems(items, map, orgToEnglish, orgToAll, context) {
  if (!items) return;
  for (const item of items) {
    const attrs = item.attrs || {};
    const previousActiveVid = context.activeVid;
    if (attrs.verseId) {
      const orgVid = attrs.verseId;
      context.activeVid = orgVid;
      context.lastSeenVid = orgVid;
      const targets = (orgToAll[orgVid] && orgToAll[orgVid].length) ? orgToAll[orgVid] : (orgToEnglish[orgVid] ? [orgToEnglish[orgVid]] : null);
      if (targets) {
        context.targets = targets;
        targets.forEach((eng) => ensureVerseEntry(map, eng, 'original'));
      } else if (map[orgVid] && (map[orgVid].lsv || map[orgVid].kjv)) {
        context.targets = null;
        context.superscriptionFor = orgVid;
      } else {
        context.targets = null;
        context.superscriptionFor = null;
      }
    }
    if (item.type === 'text' && item.text) {
      if (context.targets && context.targets.length) {
        context.targets.forEach((eng) => { if (map[eng] && map[eng].original) map[eng].original.text.push(item.text); });
      } else if (context.superscriptionFor && map[context.superscriptionFor]) {
        if (!context.superBuf) context.superBuf = {};
        const k = context.superscriptionFor;
        if (!context.superBuf[k]) context.superBuf[k] = [];
        context.superBuf[k].push(item.text);
      }
    }
    if (item.items && item.items.length > 0) walkOriginalItems(item.items, map, orgToEnglish, orgToAll, context);
    context.activeVid = previousActiveVid;
  }
}
function processEnglishContent(contentArray, map, versionKey, orgToEnglish, orgToAll) {
  if (!contentArray) return;
  const context = { activeVid: null, lastSeenVid: null, pendingTitles: [] };
  for (const section of contentArray) {
    const style = (section.attrs || {}).style || '';
    if (section.name === 'para' && TITLE_PARA_STYLES.has(style)) {
      const titleText = collectTextUnder(section).trim();
      if (titleText) context.pendingTitles.push(titleText);
      continue;
    }
    if (section.items) walkEnglishItems(section.items, map, versionKey, orgToEnglish, orgToAll, context);
  }
}
function processOriginalContent(contentArray, map, orgToEnglish, orgToAll) {
  if (!contentArray) return;
  const context = { activeVid: null, lastSeenVid: null, targets: null, superscriptionFor: null, superBuf: {} };
  for (const section of contentArray) { if (section.items) walkOriginalItems(section.items, map, orgToEnglish, orgToAll, context); }
  Object.keys(context.superBuf).forEach((vid) => {
    const t = context.superBuf[vid].join('').trim();
    if (!t || !map[vid]) return;
    ensureVerseEntry(map, vid, 'original');
    if (!map[vid].original.titles) map[vid].original.titles = [];
    map[vid].original.titles.push(t);
  });
}

function getBasePath() {
    // If serving from /GEN/1/ -> Go up two levels
    if (window.location.pathname.match(/\/([A-Z0-9]{3})\/(\d+)(\/|\/index\.html)?$/)) {
        return '../../';
    }
    return '';
}

async function loadDailyBread(dateFolder) {
  const basePath = getBasePath();

  // Try local first, fallback to mt-sin.ai
  let manifestRes = await fetch(`${basePath}data/${dateFolder}/manifest.json`).catch(() => null);

  // If local fetch fails or returns 404, fallback to production API
  let actualBasePath = basePath;
  if (!manifestRes || !manifestRes.ok) {
    actualBasePath = "https://mt-sin.ai/365DBR/";
    manifestRes = await fetch(`${actualBasePath}data/${dateFolder}/manifest.json`);
  }

  if (!manifestRes.ok) throw new Error(`Manifest for folder ${dateFolder} not found.`);
  const manifest = await manifestRes.json();
  const verseMap = {};
  const availableKeys = new Set(['original']);

  const results = await Promise.all(
    manifest.files.map(async fileName => {
        const res = await fetch(`${actualBasePath}data/${dateFolder}/${fileName}`);
        if (!res.ok) throw new Error(`Failed to load ${fileName}`);
        return await res.json();
    })
  );

  results.forEach((source) => {
    const data = source.data;
    if (!data) return;
    const orgToEnglish = {};
    const orgToAll = {};
    if (data.parallels) {
      data.parallels.forEach(parallel => {
         const matchedKey = Object.keys(TRANSLATION_REGISTRY).find(key => {
            const config = TRANSLATION_REGISTRY[key];
            if (!config.idPrefix) return false;
            if (parallel.bibleId.includes(config.idPrefix)) return true;
            if (config.altIds && config.altIds.some(id => parallel.bibleId === id)) return true;
            return false;
         });
         if (matchedKey && parallel.content) {
            processEnglishContent(parallel.content, verseMap, matchedKey, orgToEnglish, orgToAll);
            availableKeys.add(matchedKey);
         }
      });
    }
    if (data.content) processOriginalContent(data.content, verseMap, orgToEnglish, orgToAll);
  });

  const sortedKeys = Array.from(availableKeys).filter(k => k !== 'original');
  // ⚡ Bolt Optimization: Use for...in loops to avoid allocating intermediate arrays (Object.keys/values)
  // during critical data loading phase. Reduces GC pressure on mobile devices.
  for (const vid in verseMap) {
      const verseData = verseMap[vid];
      for (const key in verseData) {
          const entry = verseData[key];
          if (entry.text && Array.isArray(entry.text)) {
              const config = TRANSLATION_REGISTRY[key];
              const separator = config && config.isHebrewGreek ? '' : ' ';
              entry.text = entry.text.join(separator);
          }
      }
  }
  return { verseMap, label: manifest.label, availableTranslations: sortedKeys };
}

function getSectionIndex(vid) {
    if (!vid) return -1;
    const book = vid.substring(0, 3);
    if (book === 'PSA') return 2;
    if (book === 'PRO') return 3;
    return NT_BOOKS.has(book) ? 1 : 0;
}

// --- COMPONENTS ---

function CopyButton({ text, reference, version, ...props }) {
    const [status, setStatus] = useState('idle');
    useEffect(() => { setStatus('idle'); }, [text, reference]);
    const handleCopy = async (e) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        try {
            setStatus('copying');
            await navigator.clipboard.writeText(`${text}\n— ${reference} (${version})`);
            setStatus('copied');
            setTimeout(() => setStatus('idle'), 2000);
        } catch (err) { setStatus('idle'); }
    };
    return (
        <button {...props} onClick={handleCopy} type="button" className="ml-1 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden" aria-label={status === 'copied' ? "Copied" : "Copy verse"} title={status === 'copied' ? "Copied!" : `Copy ${version}`}>
            {status === 'copied' ? <svg className="h-3 w-3 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg> : <svg className="h-3 w-3 text-stone-400 hover:text-stone-900 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>}
        </button>
    );
}

function BookmarkButton({ onBookmark, ...props }) {
    return (
        <button {...props} onClick={(e) => { e.stopPropagation(); onBookmark(); }} type="button" className="ml-1 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden" aria-label="Bookmark verse" title="Bookmark verse">
            <svg className="h-3 w-3 text-stone-400 hover:text-stone-900 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
        </button>
    );
}

/** Word study control — only when local query API is available. */
function StrongsButton({ onOpen, ...props }) {
    return (
        <button
            {...props}
            type="button"
            onClick={(e) => { e.stopPropagation(); onOpen(); }}
            className="ml-1 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden"
            aria-label="Word study — original words and Strong's numbers"
            title="Word study"
        >
            <span className="text-[8px] md:text-[9px] font-black tracking-tighter text-amber-700/80 hover:text-amber-800">Aa</span>
        </button>
    );
}

/**
 * Word study sheet: interactive original words (hover highlight, click to find other uses).
 * Results only after a word is chosen. Static JSON remains primary for the reader.
 */
function StrongsPanel({ verseId, apiBase, onClose, onJumpVerse, preferredTranslation }) {
    const [status, setStatus] = useState('loading');
    const [error, setError] = useState(null);
    const [payload, setPayload] = useState(null);
    const [hoverKey, setHoverKey] = useState(null);
    const [selected, setSelected] = useState(null);
    const [strongHits, setStrongHits] = useState(null);
    const [strongLoading, setStrongLoading] = useState(false);
    const panelRef = useRef(null);

    useEffect(() => {
        let cancelled = false;
        setStatus('loading');
        setError(null);
        setPayload(null);
        setSelected(null);
        setStrongHits(null);
        setHoverKey(null);
        (async () => {
            try {
                const data = await fetchVerseDetail(verseId, apiBase);
                if (!cancelled) { setPayload(data); setStatus('ready'); }
            } catch (e) {
                if (!cancelled) { setError(e.message || String(e)); setStatus('error'); }
            }
        })();
        return () => { cancelled = true; };
    }, [verseId, apiBase]);

    useEffect(() => {
        const onKey = (e) => {
            if (e.key === 'Escape') {
                if (selected) { setSelected(null); setStrongHits(null); }
                else onClose();
            }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
    }, [onClose, selected]);

    useEffect(() => {
        try { panelRef.current?.focus(); } catch (_) { /* ignore */ }
    }, [verseId]);

    const loadStrong = useCallback(async (token) => {
        if (!token?.strong || !apiBase) return;
        setSelected({ strong: token.strong, surface: token.surface, order: token.order });
        setStrongLoading(true);
        setStrongHits(null);
        try {
            setStrongHits(await fetchStrongHits(token.strong, apiBase, 12));
        } catch (e) {
            setStrongHits({ error: e.message || String(e) });
        } finally {
            setStrongLoading(false);
        }
    }, [apiBase]);

    const tokens = payload?.original?.tokens || [];
    const withStrong = tokens.some((t) => t.strong);
    const isHeb = (payload?.original?.language || '') === 'hebrew';
    const wsTitles = uniqueTitleList(payload?.titles || []);
    const titleText = wsTitles.join(' · ');
    const translations = payload?.translations || {};
    const pref = (preferredTranslation || '').toUpperCase();
    const englishBody =
        (pref && (translations[pref] || translations[pref.toLowerCase()])) ||
        translations.LSB || translations.lsb ||
        translations.LSV || translations.lsv ||
        translations.KJV || translations.kjv ||
        '';
    const humanRef = formatVerseRef(verseId);

    return (
        <div ref={panelRef} role="dialog" aria-modal="false" aria-label={`Word study for ${humanRef}`} tabIndex={-1} className="fixed bottom-0 inset-x-0 z-[60] print:hidden outline-none">
            <div className="max-w-7xl mx-auto px-2 pb-2 md:pb-3">
                <div className="bg-white border border-stone-200 shadow-2xl rounded-t-xl md:rounded-xl max-h-[48vh] md:max-h-[52vh] flex flex-col overflow-hidden">
                    <div className="flex items-center justify-between gap-2 px-3 py-2 border-b border-stone-100 bg-stone-50 shrink-0">
                        <div className="min-w-0">
                            <div className="text-[10px] uppercase font-bold tracking-wide text-stone-400">Word study</div>
                            <div className="text-sm font-serif font-bold truncate text-stone-900">{humanRef}</div>
                        </div>
                        <button type="button" onClick={onClose} className="shrink-0 px-2.5 py-1 text-[11px] font-semibold text-stone-600 hover:text-stone-900 border border-stone-200 rounded-md bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500" aria-label="Done">Done</button>
                    </div>
                    <div className="overflow-y-auto p-3 md:p-4 space-y-3 text-stone-800">
                        {status === 'loading' && <p className="text-sm text-stone-500 font-serif italic">Loading…</p>}
                        {status === 'error' && <p className="text-sm text-red-600">Word study is unavailable right now.</p>}
                        {status === 'ready' && (
                            <>
                                <VerseHeading text={titleText} active={true} />
                                {englishBody && (
                                    <p className="text-sm md:text-base font-serif text-stone-800 leading-snug">{englishBody}</p>
                                )}
                                {tokens.length === 0 ? (
                                    <p className="text-sm text-stone-500">No original-language words are stored for this verse.</p>
                                ) : (
                                    <div>
                                        {withStrong && (
                                            <p className="text-[11px] text-stone-400 mb-2">Hover a word to highlight · click a word to find other uses</p>
                                        )}
                                        <p
                                            className={`text-lg md:text-2xl leading-relaxed ${isHeb ? 'hebrew' : 'greek'}`}
                                            dir={isHeb ? 'rtl' : 'ltr'}
                                            style={{ textAlign: isHeb ? 'right' : 'left', unicodeBidi: 'isolate' }}
                                        >
                                            {tokens.map((t, i) => {
                                                const hasS = !!t.strong;
                                                const key = `${t.order}-${t.strong || ''}-${i}`;
                                                const isHover = hoverKey === key;
                                                const isSel = selected && selected.order === t.order && selected.strong === t.strong;
                                                const tip = hasS ? `${t.surface} · Strong’s ${t.strong} — click for other uses` : t.surface;
                                                const Tag = hasS ? 'button' : 'span';
                                                return (
                                                    <React.Fragment key={key}>
                                                        {i > 0 && !isHeb && ' '}
                                                        <Tag
                                                            type={hasS ? 'button' : undefined}
                                                            onClick={(e) => { if (!hasS) return; e.stopPropagation(); loadStrong(t); }}
                                                            onMouseEnter={() => setHoverKey(key)}
                                                            onMouseLeave={() => setHoverKey(null)}
                                                            onFocus={() => setHoverKey(key)}
                                                            onBlur={() => setHoverKey(null)}
                                                            title={tip}
                                                            aria-label={tip}
                                                            className={`inline rounded-sm px-0.5 transition-colors duration-100 align-baseline ${
                                                                hasS ? 'cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500' : 'cursor-default'
                                                            } ${
                                                                isSel ? 'bg-amber-300 text-stone-900 ring-1 ring-amber-500'
                                                                : isHover && hasS ? 'bg-amber-200 text-stone-900'
                                                                : hasS ? 'hover:bg-amber-100' : ''
                                                            }`}
                                                            style={{ unicodeBidi: 'isolate' }}
                                                        >
                                                            {t.surface}
                                                        </Tag>
                                                    </React.Fragment>
                                                );
                                            })}
                                        </p>
                                        {!withStrong && (
                                            <p className="text-[11px] text-stone-400 mt-2">Word numbers are not available for these original words.</p>
                                        )}
                                    </div>
                                )}
                                {selected && (
                                    <div className="border-t border-stone-100 pt-3 mt-1">
                                        <div className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5 mb-2">
                                            <span className={`text-base ${isHeb ? 'hebrew' : 'greek'}`} dir={isHeb ? 'rtl' : 'ltr'}>{selected.surface}</span>
                                            <span className="text-xs font-semibold text-amber-800" dir="ltr">Strong’s {selected.strong}</span>
                                            {strongHits?.total_verses != null && (
                                                <span className="text-xs text-stone-400">
                                                    {strongHits.total_verses.toLocaleString()} place{strongHits.total_verses === 1 ? '' : 's'} in Scripture
                                                </span>
                                            )}
                                        </div>
                                        {strongLoading && <p className="text-sm text-stone-500">Finding other uses…</p>}
                                        {strongHits?.error && <p className="text-sm text-red-600">Could not search right now.</p>}
                                        {strongHits?.hits && (
                                            <ul className="space-y-2 max-h-36 overflow-y-auto">
                                                {strongHits.hits.map((h) => (
                                                    <li key={`${h.verse_id}-${h.surface}`} className="text-sm leading-snug">
                                                        <button type="button" className="font-serif font-bold text-amber-900 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded text-left" onClick={() => onJumpVerse?.(h.verse_id)}>
                                                            {formatVerseRef(h.verse_id)}
                                                        </button>
                                                        {(h.snippet || h.lsv || h.english) && <span className="block text-stone-600 pl-0.5 line-clamp-2 font-serif">{h.snippet || h.lsv || h.english}</span>}
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
}

const VerseGroup = React.memo(function VerseGroup({ group, verseMap, dynamicSlots, isActive, isDimmed, isPlaying, onBookmark, onOpenStrongs, strongsAvailable }) {
    const vid = group[0];
    const book = vid.substring(0, 3);
    const sectionIndex = getSectionIndex(vid);
    const focalTheme = FOCAL_THEMES[sectionIndex] || FOCAL_THEMES[0];
    const isHebrew = !NT_BOOKS.has(book);

    const handleVerseClick = () => {
        if (isPlaying) return;
        const selection = window.getSelection();
        if (selection && selection.type === 'Range' && selection.toString().length > 0) return;
        const el = document.getElementById(`verse-${vid}`);
        if (el) {
            const evt = new CustomEvent('verseclicked', { detail: { vid } });
            window.dispatchEvent(evt);

            const isIframe = window !== window.parent;
            let targetY;

            if (isIframe) {
                const focalSlot = el.querySelector('.flex.flex-col > div:nth-child(3)');
                if (focalSlot) {
                    const rect = focalSlot.getBoundingClientRect();
                    targetY = window.scrollY + rect.top - 80;
                } else {
                    const rect = el.getBoundingClientRect();
                    targetY = window.scrollY + rect.top - 80;
                }
            } else {
                const rect = el.getBoundingClientRect();
                const absoluteTop = window.scrollY + rect.top;
                targetY = absoluteTop - 60;
            }

            window.dispatchEvent(new CustomEvent('scrolllock'));
              window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
    };

    const renderedSlots = useMemo(() => {
        const groupTitles = collectGroupTitles(group, verseMap, dynamicSlots.bottom && dynamicSlots.bottom.source);
        const titleText = groupTitles.join(' · ');
        const getSlotContent = (slot) => {
            if (!slot || !slot.source) return { text: '', displayLabel: '' };
            let fullText = '', displayLabel = '', contributing = [];
            group.forEach((gVid) => {
                const data = verseMap[gVid];
                const slotData = data ? data[slot.source] : null;
                if (slotData && slotData.text) {
                    fullText += (fullText ? ' ' : '') + slotData.text;
                    contributing.push(slotData.displayVid || gVid);
                }
            });
            if (contributing.length > 0) {
                const s = contributing[0].split('.').map((p,i) => i>0 ? parseInt(p) : p);
                const e = contributing[contributing.length - 1].split('.').map((p,i) => i>0 ? parseInt(p) : p);
                const bName = BOOK_NAMES[s[0]] || s[0];
                if (contributing[0] === contributing[contributing.length-1]) displayLabel = `${bName} ${s[1]}:${s[2]}`;
                else if (s[0] === e[0]) displayLabel = s[1] === e[1] ? `${bName} ${s[1]}:${s[2]}-${e[2]}` : `${bName} ${s[1]}:${s[2]}-${e[1]}:${e[2]}`;
                else displayLabel = `${bName} ${s[1]}:${s[2]} - ${BOOK_NAMES[e[0]]||e[0]} ${e[1]}:${e[2]}`;
            } else if (group.length > 0) {
                const [b, c, v] = group[0].split('.');
                displayLabel = `${BOOK_NAMES[b] || b} ${c}:${v}`;
            }
            return { text: fullText, displayLabel };
        };
        const getLabel = (slot) => typeof slot.label === 'function' ? slot.label(isHebrew) : slot.label;
        return {
            titleText,
            top: { ...getSlotContent(dynamicSlots.top), label: getLabel(dynamicSlots.top), config: dynamicSlots.top },
            middle: { ...getSlotContent(dynamicSlots.middle), label: getLabel(dynamicSlots.middle), config: dynamicSlots.middle },
            bottom: { ...getSlotContent(dynamicSlots.bottom), label: getLabel(dynamicSlots.bottom), config: dynamicSlots.bottom, attribution: dynamicSlots.bottom.attribution }
        };
    }, [group, verseMap, dynamicSlots, isHebrew]);

    return (
        <div id={`verse-${vid}`} onClick={handleVerseClick} className={`verse-block group transition-all duration-700 scroll-mt-12 md:scroll-mt-14 ${isDimmed ? 'opacity-10 grayscale' : 'opacity-100'} ${!isPlaying ? 'cursor-pointer' : ''}`}>
            <div className={`flex flex-col gap-1 transition-all duration-500 ${isActive ? 'scale-[1.01]' : 'scale-100'}`}>
            {/* Top Slot */}
            <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-900 border-amber-600 shadow-md' : 'bg-stone-50/50 border-stone-100'}`}>
                <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] uppercase font-black tracking-widest ${isActive ? 'text-amber-500' : 'text-stone-400'}`}>{renderedSlots.top.label}</span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-mono font-bold ${isActive ? 'text-amber-500' : 'text-stone-400'} uppercase`}>
                        <span>{renderedSlots.top.displayLabel}</span>
                        {!isPlaying && (
                            <div className="flex items-center">
                                <CopyButton text={renderedSlots.top.text} reference={renderedSlots.top.displayLabel} version={isHebrew?'OH':'OG'} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                                <BookmarkButton onBookmark={() => onBookmark(vid)} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                            </div>
                        )}
                    </div>
                </div>
                <div className={`leading-tight tracking-tight break-words ${renderedSlots.top.config.isHebrewGreek ? (isHebrew ? 'hebrew text-[12px] md:text-xl text-right' : 'greek text-base md:text-lg text-left') : 'text-lg md:text-3xl font-serif italic'}`} style={{ direction: renderedSlots.top.config.isHebrewGreek && isHebrew ? 'rtl' : 'ltr' }}>
                    <span className={isActive ? 'text-white' : 'text-stone-500'}>{renderedSlots.top.text}</span>
                </div>
            </div>
            {/* Middle Slot */}
            <div className={`px-2 py-1 md:px-3 md:py-15 rounded-lg transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-200 shadow-lg border-stone-800 ring-1 ring-stone-800/50' : 'bg-white/40 border-transparent opacity-80'}`}>
                <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>{renderedSlots.middle.label}</span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-black uppercase mb-0.5 ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>
                        <span>{renderedSlots.middle.displayLabel}</span>
                        {!isPlaying && dynamicSlots.middle.source && (
                            <div className="flex items-center">
                                <CopyButton text={renderedSlots.middle.text} reference={renderedSlots.middle.displayLabel} version={dynamicSlots.middle.source.toUpperCase()} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                                <BookmarkButton onBookmark={() => onBookmark(vid)} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                            </div>
                        )}
                    </div>
                </div>
                <div><span className={`text-lg md:text-3xl font-serif italic leading-tight tracking-tight ${isActive ? 'text-stone-900' : 'text-stone-500'}`}>{renderedSlots.middle.text}</span></div>
            </div>
            {/* Bottom Slot */}
            <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded-lg transition-all duration-300 border-b-2 ${isActive ? `${focalTheme.bg} shadow-xl ${focalTheme.border} ring-1 ${focalTheme.ring}` : 'bg-white/40 border-transparent opacity-80'}`}>
                <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? focalTheme.text : 'text-stone-400'}`}>
                        {renderedSlots.bottom.label}
                        {renderedSlots.bottom.attribution && <a href={renderedSlots.bottom.attribution.link} className={`inline-block ml-1 transition-transform duration-200 hover:scale-150 active:scale-150 ${focalTheme.linkHover} cursor-pointer focus:outline-none focus-visible:ring-2 ${focalTheme.linkRing} rounded-sm`} title={renderedSlots.bottom.attribution.title}>{renderedSlots.bottom.attribution.text}</a>}
                    </span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-black uppercase mb-0.5 ${isActive ? focalTheme.text : 'text-stone-400'}`}>
                        <span>{renderedSlots.bottom.displayLabel}</span>
                        {!isPlaying && (
                            <div className="flex items-center opacity-100">
                                <CopyButton text={renderedSlots.titleText ? `${renderedSlots.titleText}\n${renderedSlots.bottom.text}` : renderedSlots.bottom.text} reference={renderedSlots.bottom.displayLabel} version={dynamicSlots.bottom.source.toUpperCase() + (dynamicSlots.bottom.source === 'lsv' ? '©' : '')} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                                <BookmarkButton onBookmark={() => onBookmark(vid)} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                                {strongsAvailable && onOpenStrongs && (
                                    <StrongsButton onOpen={() => onOpenStrongs(vid)} tabIndex={isActive?0:-1} aria-hidden={!isActive} />
                                )}
                            </div>
                        )}
                    </div>
                </div>
                <VerseHeading text={renderedSlots.titleText} active={isActive} />
                <div className={`text-lg md:text-5xl font-serif font-black leading-[1.1] tracking-tight ${isActive ? 'text-black' : 'text-stone-500'}`}>{renderedSlots.bottom.text}</div>
            </div>
            </div>
        </div>
    );
});

function BookmarkDialog({ isOpen, onClose, onSave, bookmarks, targetVid }) {
    const [selectedSlot, setSelectedSlot] = useState(1);
    const [selectedColor, setSelectedColor] = useState(BOOKMARK_COLORS[0]);

    useEffect(() => {
        if (isOpen) {
            // Find first empty slot or default to 1
            const firstEmpty = [1, 2, 3, 4, 5].find(slot => !bookmarks[slot]);
            const slotToSelect = firstEmpty || 1;
            setSelectedSlot(slotToSelect);

            // If slot has an existing bookmark, pre-select its color
            if (bookmarks[slotToSelect]) {
                const existingColor = BOOKMARK_COLORS.find(c => c.bg === bookmarks[slotToSelect].color.bg);
                if (existingColor) setSelectedColor(existingColor);
            }
        }
    }, [isOpen, bookmarks]);

    if (!isOpen) return null;

    const handleSave = () => {
        onSave(selectedSlot, targetVid, selectedColor);
        onClose();
    };

    const handleClear = () => {
        onSave(selectedSlot, null, null);
        onClose();
    };

    return (
        <div className="fixed inset-0 z-[100] bg-stone-50 md:bg-black/60 md:backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-white rounded-xl shadow-2xl border border-stone-200 w-full max-w-md overflow-hidden">

                        <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>

                <div className="p-4 space-y-6">
                    <div>
                        <label className="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Select Slot (1-5)</label>
                        <div className="flex gap-2 justify-between">
                            {[1, 2, 3, 4, 5].map(slot => {
                                const isOccupied = !!bookmarks[slot];
                                const isSelected = selectedSlot === slot;
                                const slotColor = isOccupied ? bookmarks[slot].color.bg : 'bg-stone-200';

                                return (
                                    <button
                                        key={slot}

                                            setSelectedSlot(slot);
                                            if (bookmarks[slot]) {
                                                const c = BOOKMARK_COLORS.find(col => col.bg === bookmarks[slot].color.bg);
                                                if (c) setSelectedColor(c);
                                            }
                                        }}
                                        className={`w-12 h-12 rounded-full flex items-center justify-center text-lg font-black transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-amber-500/50 ${isSelected ? 'ring-4 ring-amber-500 shadow-md scale-110' : 'ring-1 ring-stone-300'} ${isOccupied ? 'text-white ' + slotColor : 'text-stone-400 bg-stone-100 hover:bg-stone-200'}`}
                                    >
                                        {slot}
                                    </button>
                                );
                            })}
                        </div>
                        {bookmarks[selectedSlot] && (
                            <p className="mt-2 text-xs text-amber-600 font-bold uppercase tracking-tight">
                                Warning: This will overwrite the existing bookmark.
                            </p>
                        )}
                    </div>

                    <div>
                        <label className="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Select Color</label>
                        <div className="grid grid-cols-5 gap-2">
                            {BOOKMARK_COLORS.map(color => (
                                <button
                                    key={color.name}
                                    onClick={() => setSelectedColor(color)}
                                    className={`w-10 h-10 rounded-full ${color.bg} ${color.hover} transition-all transform hover:scale-110 focus:outline-none focus:ring-4 ${color.ring} ${selectedColor.name === color.name ? 'ring-4 ring-stone-800 shadow-lg scale-110' : 'shadow-sm'}`}
                                    aria-label={`Select color ${color.name}`}
                                    title={color.name}
                                />
                            ))}
                        </div>
                    </div>
                </div>

                <div className="px-4 py-3 border-t border-stone-200 bg-stone-50 flex justify-between">
                    {bookmarks[selectedSlot] ? (
                        <button onClick={handleClear} aria-label="Clear bookmark slot" className="px-4 py-2 text-xs font-bold uppercase tracking-widest text-red-600 hover:bg-red-50 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-red-500">
                            Clear Slot
                        </button>
                    ) : (
                        <div></div>
                    )}
                    <button onClick={handleSave} aria-label="Save bookmark" className="px-6 py-2 bg-stone-900 hover:bg-black text-white text-xs font-bold uppercase tracking-widest rounded transition-colors focus:outline-none focus:ring-2 focus:ring-stone-900 shadow-md">
                        Save Bookmark
                    </button>
                </div>
            </div>
        </div>
    );
}

function ScrollToTop() {
  const [show, setShow] = useState(false);

  useEffect(() => {
    let ticking = false;
    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          setShow(window.scrollY > 400);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <button
      onClick={scrollToTop}
      aria-label="Scroll to top"
      title="Scroll to top"
      className={`fixed bottom-20 right-4 z-40 p-2 rounded-full bg-stone-900/80 text-white shadow-xl transition-all duration-300 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 print:hidden ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
    >
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  );
}

// --- BIBLE BROWSE DIALOG ---
function BibleBrowseDialog({ isOpen, onClose, index, availableBooks, onSelect, initialStep = 'testament', initialTestament = null, initialBook = null, initialChapter = null }) {
    const [step, setStep] = useState(initialStep);
    const [testament, setTestament] = useState(initialTestament);
    const [book, setBook] = useState(initialBook);
    const [chapter, setChapter] = useState(initialChapter);
    const [sortDesc, setSortDesc] = useState(false);
    const [chunkIndex, setChunkIndex] = useState(0);

    // Reset when opened
    useEffect(() => {
        if (isOpen) {
            setStep(initialStep);
            setTestament(initialTestament);
            setBook(initialBook);
            setChapter(initialChapter);
            setSortDesc(false);
            setChunkIndex(0);
        }
    }, [isOpen, initialStep, initialTestament, initialBook, initialChapter]);

    if (!isOpen) return null;

    const CHUNK_SIZE = 50;

    const handleBack = () => {
        if (step === 'verse') { setStep('chapter'); setChunkIndex(0); }
        else if (step === 'chapter') { setStep('book'); setChunkIndex(0); }
        else if (step === 'book') setStep('testament');
    };

    const handleTestamentSelect = (t) => { setTestament(t); setStep('book'); setSortDesc(false); };
    const handleBookSelect = (b) => { setBook(b); setStep('chapter'); setChunkIndex(0); };
    const handleChapterSelect = (c) => { setChapter(c); setStep('verse'); setChunkIndex(0); };
    const handleVerseSelect = (v) => { onSelect(book, chapter, v); onClose(); };

    // Data Preparation
    const OT_BOOKS = BIBLE_BOOK_ORDER.slice(0, 39);
    const NT_BOOKS = BIBLE_BOOK_ORDER.slice(39);

    let displayBooks = [];
    if (step === 'book') {
        displayBooks = testament === 'OT' ? OT_BOOKS : NT_BOOKS;
        if (sortDesc) {
            displayBooks = [...displayBooks].sort((a, b) => BOOK_NAMES[a].localeCompare(BOOK_NAMES[b]));
        }
    }

    let chunks = [];
    let currentItems = [];

    if (step === 'chapter' && book) {
        // Independent of reading plan, use VERSE_COUNTS length for chapter count
        const totalChapters = VERSE_COUNTS[book] ? VERSE_COUNTS[book].length : 1;
        const chapters = Array.from({ length: totalChapters }, (_, i) => i + 1);
        for (let i = 0; i < chapters.length; i += CHUNK_SIZE) {
            chunks.push(chapters.slice(i, i + CHUNK_SIZE));
        }
        currentItems = chunks[chunkIndex] || [];
    }

    if (step === 'verse' && book && chapter) {
        // Source of truth for verses
        const totalVerses = (VERSE_COUNTS[book] && VERSE_COUNTS[book][chapter - 1]) || 1;
        const verses = Array.from({ length: totalVerses }, (_, i) => i + 1);
        for (let i = 0; i < verses.length; i += CHUNK_SIZE) {
            chunks.push(verses.slice(i, i + CHUNK_SIZE));
        }
        currentItems = chunks[chunkIndex] || [];
    }

    return (

                    {step === 'book' && (

                            {displayBooks.map(b => (
