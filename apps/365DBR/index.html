              const rect = el.getBoundingClientRect();
              const absoluteTop = window.scrollY + rect.top;
              const targetY = absoluteTop - 60;
              window.scrollTo({ top: targetY, behavior: 'smooth' });
              setTargetScrollVerse(null);
          }
      }
  }, [loading, targetScrollVerse, verseMap]);

  // Dropdown States
  const [isCompareOpen, setIsCompareOpen] = useState(false);
  const [isFocalOpen, setIsFocalOpen] = useState(false);

  const synthRef = useRef(window.speechSynthesis);
  const isTransitioningRef = useRef(false);
  const playbackStatusRef = useRef('stopped'); // Track playback status in ref for callbacks

  // Focal change: previous focal moves to the middle (compare) slot.
  // e.g. LSV focal + KJV middle → pick KJV focal ⇒ middle becomes LSV.
  const handleFocalChange = useCallback((newFocal) => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    if (!newFocal || newFocal === focalTranslation) {
      setIsFocalOpen(false);
      return;
    }
    const prevFocal = focalTranslation;
    setFocalTranslation(newFocal);
    if (prevFocal && prevFocal !== newFocal && availableTranslations.includes(prevFocal)) {
      setCompareTranslation(prevFocal);
    } else if (newFocal === compareTranslation) {
      const alt = availableTranslations.find((k) => k !== newFocal);
      if (alt) setCompareTranslation(alt);
    }
    setIsFocalOpen(false);
  }, [focalTranslation, compareTranslation, availableTranslations]);

  // getSectionIndex moved outside App

  const sortedVids = useMemo(() => {
    if (!verseMap) return [];
    return Object.keys(verseMap).sort((a, b) => {
      // ⚡ Bolt Optimization: Use fast substring(0,3) for book extraction and manual integer parsing
      // instead of slow localeCompare(numeric:true) and split(). 25x faster for large sets.

      const bookA = a.substring(0, 3);
      const bookB = b.substring(0, 3);

      // 1. Primary Sort: By Section (OT, NT, Psalms, Proverbs)
      // Inline getSectionIndex logic to reuse bookA/bookB
      const getW = (bk) => (bk === 'PSA' ? 2 : bk === 'PRO' ? 3 : NT_BOOKS.has(bk) ? 1 : 0);
      const wA = getW(bookA);
      const wB = getW(bookB);
      if (wA !== wB) return wA - wB;

      // 2. Secondary Sort: By Book Order (Canonical)
      if (bookA !== bookB) {
        return (BIBLE_BOOK_ORDER_MAP.get(bookA) ?? 999) - (BIBLE_BOOK_ORDER_MAP.get(bookB) ?? 999);
      }

      // 3. Tertiary Sort: By Chapter/Verse (Numeric)
      // Since books are equal, we can skip the first 4 chars "XXX."
      const dotA = a.indexOf('.', 4);
      const dotB = b.indexOf('.', 4);

      const chA = parseInt(a.substring(4, dotA));
      const chB = parseInt(b.substring(4, dotB));

      if (chA !== chB) return chA - chB;

      const vA = parseInt(a.substring(dotA + 1));
      const vB = parseInt(b.substring(dotB + 1));

      return vA - vB;
    });
  }, [verseMap]);

  // ⚡ Bolt Optimization: Calculate reading label during render to avoid extra commit/render cycle.
  // This ensures the label is ready on first paint after data load.
  const readingLabel = useMemo(() =>
      generateSmartLabel(verseMap, sortedVids, focalTranslation),
  [verseMap, sortedVids, focalTranslation]);

  const labelParts = useMemo(() => readingLabel.split(',').map(s => s.trim()), [readingLabel]);
  const activeSectionIndex = useMemo(() => getSectionIndex(playbackStatus === 'playing' ? playbackVerseId || sortedVids[0] : activeVerseId || sortedVids[0]), [playbackStatus, playbackVerseId, activeVerseId, sortedVids]);

  // Dynamically generate the slots based on the selected focal/compare translations
  const dynamicSlots = useMemo(() => {
    if (!focalTranslation || !compareTranslation) return { top: TRANSLATION_REGISTRY.original, middle: {}, bottom: {} };

    const focalConfig = TRANSLATION_REGISTRY[focalTranslation];
    const compareConfig = TRANSLATION_REGISTRY[compareTranslation];

    return {
        top: TRANSLATION_REGISTRY.original,
        middle: {
            source: compareTranslation,
            label: compareConfig?.label || compareTranslation.toUpperCase(),
            isHebrewGreek: false
        },
        bottom: {
            source: focalTranslation,
            label: focalConfig?.label || focalTranslation.toUpperCase(),
            isFocal: true,
            isHebrewGreek: false,
            attribution: focalConfig?.attribution
        }
    };
  }, [focalTranslation, compareTranslation]);

  // Grouping Logic to handle versification mismatches (e.g. Psalm Titles)
  const groupedVids = useMemo(() => {
      const groups = [];
      let i = 0;
      
      const hasTranslationContent = (vid) => {
          if (!verseMap || !verseMap[vid]) return false;
          const t1 = dynamicSlots.middle.source;
          const t2 = dynamicSlots.bottom.source;
          // Check if either slot has content
          const hasT1 = t1 && verseMap[vid][t1] && verseMap[vid][t1].text.length > 0;
          const hasT2 = t2 && verseMap[vid][t2] && verseMap[vid][t2].text.length > 0;
          return hasT1 || hasT2;
      };

      while (i < sortedVids.length) {
          const currentVid = sortedVids[i];
          const group = [currentVid];
          
          // Check if we need to merge with next
          // Condition: Current has NO English, Next HAS English, Same Chapter
          // This catches the Psalm Title (Verse 1) vs English (Verse 1 in Verse 2 slot) case
          if (!hasTranslationContent(currentVid) && i + 1 < sortedVids.length) {
              const nextVid = sortedVids[i+1];
              // Ensure same book/chapter to avoid merges across boundaries
              const [b1, c1] = currentVid.split('.');
              const [b2, c2] = nextVid.split('.');
              
              if (b1 === b2 && c1 === c2 && hasTranslationContent(nextVid)) {
                  group.push(nextVid);
                  i++; // Skip next one since we consumed it
              }
          }
          groups.push(group);
          i++;
      }
      return groups;
  }, [sortedVids, dynamicSlots, verseMap]);

  useEffect(() => {
    if (playbackStatus === 'playing' || loading || !verseMap || groupedVids.length === 0) return;
    const observer = new IntersectionObserver((entries) => {
      // Suspend observer during programmatic scroll to prevent bounce-back and skipped verses
      if (isNavigatingRef.current) return;

      // Check if we are at the absolute bottom of the page first to prevent bounce-back
      // Use scrollHeight and Math.ceil/floor tolerance for cross-browser sub-pixel accuracy
      if (Math.ceil(window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 50) {
          return; // Let handleScroll manage the final verse
      }

      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        const bestEntry = intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top - 120) - Math.abs(b.boundingClientRect.top - 120))[0];
        setActiveVerseId(bestEntry.target.id.replace('verse-', ''));
      }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
    groupedVids.forEach((group) => {
      const vid = group[0]; // Observe the group container ID
      const el = document.getElementById(`verse-${vid}`);
      if (el) observer.observe(el);
    });

    const handleScroll = () => {
      if (isNavigatingRef.current) return;
      if (Math.ceil(window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 50) {
         // Prevent snapping to the last verse if the currently active verse is already fully visible on screen.
         // This preserves keyboard/click navigation for short verses at the end of the page.
         if (activeVerseIdRef.current) {
             const activeEl = document.getElementById(`verse-${activeVerseIdRef.current}`);
             if (activeEl) {
                 const rect = activeEl.getBoundingClientRect();
                 // If the active verse is visible within the viewport (allowing some margin for sticky headers)
                 if (rect.top >= 50 && rect.bottom <= window.innerHeight) {
                     return;
                 }
             }
         }
         const lastGroup = groupedVids[groupedVids.length - 1];
         if (lastGroup) setActiveVerseId(lastGroup[0]);
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });

    return () => {
        observer.disconnect();
        window.removeEventListener('scroll', handleScroll);
    };
  }, [playbackStatus, loading, verseMap, groupedVids]);

  useEffect(() => {
    playbackStatusRef.current = playbackStatus;
  }, [playbackStatus]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;
      switch(e.key) {
        case 'ArrowLeft': navigateDate(-1); break;
        case 'ArrowRight': navigateDate(1); break;
        case 'ArrowUp': e.preventDefault(); navigateVerse(-1); break;
        case 'ArrowDown': e.preventDefault(); navigateVerse(1); break;
        case 'k': case 'K': handleToggle(); break;
        case 'Escape':
          if (isCompareOpen || isFocalOpen) { setIsCompareOpen(false); setIsFocalOpen(false); }
          else if (playbackStatus !== 'stopped') { synthRef.current.cancel(); setPlaybackStatus('stopped'); }
          break;
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentDate, playbackStatus, isCompareOpen, isFocalOpen, sortedVids, verseMap]);

  useEffect(() => {
    let isMounted = true;
    const initDay = async () => {
      setLoading(true);
      setError(null);
      synthRef.current.cancel();
      setPlaybackStatus('stopped');
      setPlaybackVerseId(null);
      setActiveVerseId(null);
      try {
        const data = await loadDailyBread(currentDate);
        if (!isMounted) return;
        setVerseMap(data.verseMap);
        setReadingTime(data.readingTime || 0);
        // setReadingLabel(data.label); // REMOVED: Now handled by useEffect
        setAvailableTranslations(data.availableTranslations);

        // Smart Defaults: 
        // 1. Try to keep current selection if valid.
        // 2. Fallback to LSV then KJV if available.
        // 3. Fallback to first available.
        const keys = data.availableTranslations;
        if (keys.length > 0) {
           let newFocal = keys.includes(focalTranslation) ? focalTranslation : (keys.includes('lsv') ? 'lsv' : keys[0]);
           let newCompare = keys.includes(compareTranslation) ? compareTranslation : (keys.includes('kjv') ? 'kjv' : keys.find(k => k !== newFocal) || keys[0]);
           
           // If we only have one translation, ensure both slots aren't empty (though rendering handles this)
           if (newCompare === newFocal && keys.length > 1) {
              newCompare = keys.find(k => k !== newFocal);
           }

           setFocalTranslation(newFocal);
           setCompareTranslation(newCompare);
        }

        setLoading(false);
      } catch (err) {
        console.error("Data loading error:", err);
        if (isMounted) {
            setError(err.message || "Unknown error occurred while loading reading.");
            setLoading(false);
        }
      }
    };
    initDay();
    return () => { isMounted = false; };
  }, [currentDate]);

  const playVerse = (vid, previousVid = null) => {
    if (!verseMap) return;

    // 1. Resolve Group Logic: We always play "Groups"
    // Find the group containing this vid
    const group = groupedVids.find(g => g.includes(vid)) || [vid];
    const leaderVid = group[0];

    // 1. CRITICAL: Stop any current speech
    window.speechSynthesis.cancel();

    setPlaybackVerseId(leaderVid);

    // 2. Prepare SPEECH-only text (Focal Version)
    // Accumulate English text for the whole group
    const focalSlot = dynamicSlots.bottom;
    if (!focalSlot) return;

    let groupText = '';
    group.forEach(gVid => {
        const slotData = verseMap[gVid] ? verseMap[gVid][focalSlot.source] : null;
        if (slotData && slotData.text) {
            // Robustly handle string (optimized) or array (defensive) text
            const textStr = Array.isArray(slotData.text) ? slotData.text.join(' ') : slotData.text;
            groupText += textStr.trim() + ' ';
        }
    });
    
    const rawText = groupText.trim();
    if (!rawText) {
        // Skip to next GROUP if this group is empty
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], previousVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
        return;
    }

    // Improve pronunciation: 
    const speechText = rawText
        .replace(/YHWH/g, 'Yaw-weigh')
        .replace(/WHO/g, 'Who')
        .replace(/[\[\]]/g, ''); 

    // Scroll to the LEADER vid container
    const el = document.getElementById(`verse-${leaderVid}`);
    if (el) {
        const rect = el.getBoundingClientRect();
        const absoluteTop = window.scrollY + rect.top;
        const targetY = absoluteTop - 60;
        window.scrollTo({ top: targetY, behavior: 'smooth' });
    }

    const currentIdx = getSectionIndex(leaderVid);
    const prevIdx = previousVid ? getSectionIndex(previousVid) : -1; 
    
    // 3. Voice Selection
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices[0];
    
    // 5. Play LSV Verse with corrected pronunciation
    const mainUtterance = new SpeechSynthesisUtterance(speechText);
    mainUtterance.voice = preferredVoice;
    mainUtterance.rate = 0.9;

    // 6. Move to next GROUP automatically
    mainUtterance.onend = () => {
        if (playbackStatusRef.current !== 'playing') return; 
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], leaderVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
    };

    // 4. Handle Section Intro
    if (currentIdx !== prevIdx) {
        // Range calc based on Group Leaders to accurately reflect visual start/end
        const sectionGroups = groupedVids.filter(g => getSectionIndex(g[0]) === currentIdx);
        
        // Start: First Group's First Vid
        const startVid = sectionGroups[0][0]; 
        // End: Last Group's *Last* Vid (to get true extent)
        const lastGroup = sectionGroups[sectionGroups.length - 1];
        const endVid = lastGroup[lastGroup.length - 1];

        // For display labels in intro, we want to align with English perception.
        // If Hebrew 19.1 (Title) is merged with 19.2 (Verse 1), English readers see "19:1".
        // The `getSlotContent` logic handles rendering labels, but here we just need rough "Chapter X Verse Y".
        // We'll use the *English Mapped* verse ID if possible for the intro to match user expectation.
        
        const getEnglishVid = (v) => {
             const d = verseMap[v];
             const t = d ? d[focalSlot.source] : null;
             return t?.displayVid || v;
        };

        const [book, ch, verse] = getEnglishVid(startVid).split('.');
        const [endBook, endCh, endVerse] = getEnglishVid(endVid).split('.');
        
        let introText = '';
        if (currentIdx === 0) {
            introText = `Today's reading from the Old Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 1) {
            introText = `Today's reading from the New Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 2) {
            introText = `Today's reading from the Psalms, chapter ${ch} verse ${verse}`;
        } else {
            introText = `Today's reading from the Proverbs, chapter ${ch} verse ${verse}`;
        }
        
        if (startVid !== endVid) { // Compare original IDs for range check
            if (book !== endBook) {
                introText += ` to ${BOOK_NAMES[endBook] || endBook} chapter ${endCh} verse ${endVerse}`;
            } else if (endCh !== ch) {
                introText += ` to chapter ${endCh} verse ${endVerse}`;
            } else {
                introText += ` to verse ${endVerse}`;
            }
        }
      
        const intro = new SpeechSynthesisUtterance(introText);
        intro.voice = preferredVoice; 
        intro.rate = 0.9;
        intro.onend = () => {
            window.speechSynthesis.speak(mainUtterance);
        };
        window.speechSynthesis.speak(intro);
    } else {
        window.speechSynthesis.speak(mainUtterance);
    }
};

  const handleToggle = useCallback(() => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    // ⚡ Bolt Optimization: Use ref to access latest activeVerseId inside stale closures (like event listeners)
    // to avoid recreating the listener on every scroll event.
    const currentActive = activeVerseIdRef.current;
    const currentPlayback = playbackVerseIdRef.current;

    if (playbackStatus === 'playing') { 
      synthRef.current.pause(); 
      setPlaybackStatus('paused');
      isTransitioningRef.current = false; 
    }
    else if (playbackStatus === 'paused') { 
      setPlaybackStatus('playing');
      isTransitioningRef.current = true;
      // Resume from current highlighted verse (where user scrolled to while paused)
      const resumeVerse = currentActive || currentPlayback || sortedVids[0];
      if (resumeVerse && verseMap[resumeVerse]) {
        playVerse(resumeVerse);
      }
    }
    else { 
      setPlaybackStatus('playing'); 
      isTransitioningRef.current = true; 
      // Start from current visible verse, or first verse if none visible
      const startVerse = currentActive || sortedVids[0];
      setPlaybackVerseId(startVerse);
      playVerse(startVerse);
    }
  }, [playbackStatus, sortedVids, verseMap]);

  const navigateDate = useCallback((direction) => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    // If static mode, navigation is handled by LinkOrButton hrefs unless we intercept here.
    // Since we want full page reload for static, we let default happen?
    // Actually LinkOrButton handles rendering. If we click a button (SPA), we run this.
    // If we click a link (Static), we run this IF onClick is attached.
    // In LinkOrButton, we pass `undefined` for onClick if static. So this won't run.

    // Legacy logic for SPA mode:
    const nextDate = calculateDate(currentDate, direction);
    setCurrentDate(nextDate);
    window.scrollTo({ top: 0 });
  }, [currentDate]);

  const navigateVerse = useCallback((direction) => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    if (!sortedVids || sortedVids.length === 0) return;

    // Find current index
    let currentIndex = -1;
    if (activeVerseIdRef.current) {
        currentIndex = sortedVids.indexOf(activeVerseIdRef.current);
    }
    // If no active verse (e.g., at very top), assume first verse is next logical step
    if (currentIndex === -1 && direction > 0) currentIndex = -1;
    else if (currentIndex === -1 && direction < 0) currentIndex = 0;

    let nextIndex = currentIndex + direction;

    // Bounds check
    if (nextIndex < 0) nextIndex = 0;
    if (nextIndex >= sortedVids.length) nextIndex = sortedVids.length - 1;

    if (nextIndex !== currentIndex) {
        const nextVid = sortedVids[nextIndex];
        // ⚡ Bolt Optimization: Update state immediately so subsequent key presses have correct reference context
        // and the UI highlights the target verse even if smooth scrolling lands outside the observer rootMargin.
        setActiveVerseId(nextVid);

        // Suspend IntersectionObserver during programmatic smooth scroll (approx 500ms-700ms)
        isNavigatingRef.current = true;
        if (navigationTimeoutRef.current) clearTimeout(navigationTimeoutRef.current);
        navigationTimeoutRef.current = setTimeout(() => { isNavigatingRef.current = false; }, 800);

        const el = document.getElementById(`verse-${nextVid}`);
        if (el) {
            // Align with Reading Zone (approx 125px from top) to trigger IntersectionObserver correctly
            const rect = el.getBoundingClientRect();
            const absoluteTop = window.scrollY + rect.top;
            const targetY = absoluteTop - 60;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
    }
  }, [sortedVids]);

  const scrollToSection = useCallback((index) => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    if (playbackStatus === 'playing' || activeSectionIndex === index) return;
    const targetVid = sortedVids.find(vid => getSectionIndex(vid) === index);
    if (targetVid) {
      const el = document.getElementById(`verse-${targetVid}`);
      if (el) {
          const rect = el.getBoundingClientRect();
          const absoluteTop = window.scrollY + rect.top;
          const targetY = absoluteTop - 60;
          window.scrollTo({ top: targetY, behavior: 'smooth' });
      }
    }
  }, [playbackStatus, activeSectionIndex, sortedVids]);

  const onStopPlayback = useCallback(() => {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    synthRef.current.cancel();
    setPlaybackStatus('stopped');
  }, []);

  return (
    <div className="min-h-screen bg-[#fdfcfb] text-stone-900 pb-12">
      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-stone-900 focus:text-white focus:font-bold focus:rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xl transition-all print:hidden">Skip to Content</a>
      <Header
        isStatic={isStatic}
        currentDate={currentDate}
        todayString={todayString}
        formattedDate={formattedDate}
        navigateDate={navigateDate}
        setCurrentDate={setCurrentDate}
        labelParts={labelParts}
        activeSectionIndex={activeSectionIndex}
        scrollToSection={scrollToSection}
        availableTranslations={availableTranslations}
        compareTranslation={compareTranslation}
        focalTranslation={focalTranslation}
        isCompareOpen={isCompareOpen}
        setIsCompareOpen={setIsCompareOpen}
        isFocalOpen={isFocalOpen}
        setIsFocalOpen={setIsFocalOpen}
        setCompareTranslation={setCompareTranslation}
        handleFocalChange={handleFocalChange}
        playbackStatus={playbackStatus}
        onStopPlayback={onStopPlayback}
        handleToggle={handleToggle}
        bookmarks={bookmarks}
      />

      <main id="main-content" tabIndex={-1} className="max-w-7xl mx-auto py-3 md:py-6 px-2 pb-32 md:pb-40 space-y-6 md:space-y-10 outline-none">
        {loading ? (
          <Loader />
        ) : error ? (
          <ErrorDisplay error={error} date={currentDate} onRetry={() => window.location.reload()} />
        ) : groupedVids.map(group => {
            const vid = group[0];
            const isPlaying = playbackStatus === 'playing';
            // ⚡ Bolt Optimization: Short-circuit includes() checks for single-item groups (99% of cases).
            // This avoids O(N) array scans in the hot render path.
            const isCurrentGroup = isPlaying ? (playbackVerseId === vid || (group.length > 1 && group.includes(playbackVerseId))) : false;
            const isActive = isPlaying ? isCurrentGroup : (activeVerseId === vid || (group.length > 1 && group.includes(activeVerseId)));
            const isDimmed = isPlaying && !isCurrentGroup;

            return (
                <VerseGroup
                    key={vid}
                    group={group}
                    verseMap={verseMap}
                    dynamicSlots={dynamicSlots}
                    isActive={isActive}
                    isDimmed={isDimmed}
                    isPlaying={isPlaying}
                    // ⚡ Bolt Optimization: Pass state setter directly instead of inline arrow function
                    // to maintain stable reference and prevent O(N) re-renders of React.memo component
                    onBookmark={setBookmarkDialogTarget}
                    onOpenStrongs={openStrongs}
                    strongsAvailable={!!queryApiBase}
                />
            );
        })}
        
      </main>

      {strongsVerseId && queryApiBase && (
        <StrongsPanel
          verseId={strongsVerseId}
          apiBase={queryApiBase}
          preferredTranslation={focalTranslation}
          onClose={closeStrongs}
          onJumpVerse={(vid) => {
            setStrongsVerseId(vid);
            const el = document.getElementById(`verse-${vid}`);
            if (el) {
              const rect = el.getBoundingClientRect();
              window.scrollTo({ top: window.scrollY + rect.top - 60, behavior: 'smooth' });
              setActiveVerseId(vid);
            }
          }}
        />
      )}

      <BookmarkDialog
          isOpen={!!bookmarkDialogTarget}
          onClose={closeBookmarkDialog}
          onSave={handleSaveBookmark}
          bookmarks={bookmarks}
          targetVid={bookmarkDialogTarget}
      />

      <Footer
        isStatic={isStatic}
        currentDate={currentDate}
        readingLabel={readingLabel}
        readingTime={readingTime}
        navigateDate={navigateDate}
        navigateVerse={navigateVerse}
        handleToggle={handleToggle}
      />

      <ScrollToTop />
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
    <!-- The ESM Run script to execute the TSX code -->
    <script src="https://esm.sh/run" type="module"></script>
</body>
</html>
