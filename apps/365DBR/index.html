<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interlinear Daily Bread</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="tailwind.prod.css">
    <!-- Biblical Language & Serif Fonts -->
    <!-- ⚡ Bolt: Preconnect to Google Fonts to reduce latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SBL+Hebrew&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Import Map: Fixes the 'Failed to resolve module specifier react' error -->
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fdfcfb;
            scroll-behavior: smooth;
        }
        .hebrew { 
            font-family: 'SBL Hebrew', serif; 
            direction: rtl; 
        }
        .greek {
            font-family: 'Gentium Plus', serif;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fdfcfb; }
        ::-webkit-scrollbar-thumb { background: #e7e5e4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d6d3d1; }

        @media print {
            /* Reset Layout & Colors */
            body { background-color: white !important; color: black !important; }
            main { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }

            /* Hide UI Chrome */
            .fixed, .sticky, .bottom-0, .z-50 { position: static !important; }

            /* Verse Styling */
            .verse-block {
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 1rem !important;
                opacity: 1 !important;
            }

            /* Force High Contrast for Verse Cards */
            .verse-block > div > div {
                background-color: transparent !important;
                border: none !important;
                border-bottom: 1px solid #ddd !important;
                box-shadow: none !important;
                color: black !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
            }

            /* Text Colors Override */
            .text-stone-400, .text-stone-300, .text-amber-500, .text-blue-700, .text-rose-700, .text-emerald-700 {
                color: black !important;
            }

            /* Header Specifics */
            header {
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                text-align: center !important;
                padding-bottom: 1rem !important;
            }
            header h1 {
                font-size: 24pt !important;
                text-align: center !important;
                width: 100% !important;
                display: block !important;
            }
            /* Ensure Date Button behaves like text */
            header h1 button {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-size: inherit !important;
                font-weight: inherit !important;
            }

            /* Footer */
            footer {
                margin-top: 2rem !important;
                border-top: 1px solid #000 !important;
            }
        }
    </style>

    <!-- 365DBR-PWA-START -->
    <link rel="manifest" href="/365DBR/manifest.webmanifest">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="365DBR">
    <link rel="apple-touch-icon" sizes="180x180" href="/365DBR/icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/365DBR/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/365DBR/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/365DBR/icons/favicon-16x16.png">
    <script src="/365DBR/dbr-pwa.js" defer></script>
    <!-- 365DBR-PWA-END -->
</head>
<body class="antialiased">
    <div id="root"></div>

    <!-- Optional Strong's helpers (window.__DBR_STRONGs__); classic script for esm.sh/run -->
    <script src="strongs_optional.js?v=20261109"></script>
    <!-- Application Code -->
    <script src="index.bundle.js?v=20261125_162525" defer></script>

</html>
