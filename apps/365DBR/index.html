    <!-- Application Code -->
    <script type="text/tsx">
import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';

// Optional DB Strong's — loaded via classic <script src="strongs_optional.js"> (not ES import;
// esm.sh/run rewrites ./relative imports under script-0.tsx/… and breaks resolution).
const {
  probeQueryApi,
  fetchVerseDetail,
  fetchStrongHits,
  resolveQueryApiBase,
  formatVerseRef: formatVerseRefRaw,
} = window.__DBR_STRONGs__ || {
  probeQueryApi: async () => null,
  fetchVerseDetail: async () => { throw new Error('strongs_optional.js not loaded'); },
  fetchStrongHits: async () => { throw new Error('strongs_optional.js not loaded'); },
  resolveQueryApiBase: () => 'http://127.0.0.1:8765',
  formatVerseRef: (vid) => vid,
};
// BOOK_NAMES is defined later; wrap so call sites can use formatVerseRef(vid).
const formatVerseRef = (vid) => formatVerseRefRaw(vid, typeof BOOK_NAMES !== 'undefined' ? BOOK_NAMES : undefined);

/** --- CONFIGURATION --- **/
const TRANSLATION_REGISTRY = {
  // Original Language (Always present as 'content')
  original: {
    source: 'original', // Explicit source key for data lookup
    label: (isHebrew) => `ORIGINAL ${isHebrew ? 'HEBREW' : 'GREEK'}`,
    isHebrewGreek: true
  },
  // English Parallels (Detected by bibleId)
  kjv: {
    idPrefix: 'de4e12af',
    label: 'KJV - King James Version'
  },
  lsv: {
    idPrefix: '06125ada', // Covers 06125adad2d5898a-01
    altIds: ['01b29f4b342acc35-01'],
    label: 'LSV - Literal Standard Version',
    attribution: {
      text: '©',
      link: '#footer',
      title: 'View Copyright Information'
    }
  },
  web: {
    idPrefix: '9879dbb7',
    label: 'WEB - World English Bible'
  },
  nlt: {
    idPrefix: 'd6e14a62',
    label: 'NLT - New Living Translation',
    attribution: {
        text: '©',
        link: '#footer', // Placeholder, would need update if NLT specific footer requirement
        title: 'View Copyright Information'
    }
  }
};

/** --- DATA UTILITIES --- **/
/**
 * English-primary verseMap (production / static JSON).
 * - English (LSV/KJV): keyed by modern English verseId (NOT org/hebrew id).
 * - Original: remapped onto those English keys via verseOrgIds.
 * - USFM title paras (style d/s/…): stored as entry.titles[], NEVER appended into verse body.
 * Fixes Psalms empty slots (org superscription with no English) and titles glued onto v.1 text.
 */
const TITLE_PARA_STYLES = new Set(['d', 's', 's1', 's2', 's3', 'ms', 'ms1', 'ms2', 'mr', 'r', 'sp', 'qa']);

/** Plain text from titles[] (string or {text|value}). */
const titlePlain = (t) => {
  if (!t) return '';
  if (typeof t === 'string') return t.trim();
  return String(t.text || t.value || '').trim();
};

/** Dedupe heading strings (KJV + LSV often repeat the same superscription). */
const uniqueTitleList = (list) => {
  const out = [];
  const seen = new Set();
  if (!Array.isArray(list)) return out;
  for (let i = 0; i < list.length; i++) {
    const s = titlePlain(list[i]);
    if (!s) continue;
    const key = s.replace(/\s+/g, ' ').toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(s);
  }
  return out;
};

/** Unique headings for a verse group, English-reader order. */
const collectGroupTitles = (group, verseMap) => {
  const merged = [];
  for (let i = 0; i < group.length; i++) {
    const list = verseMap[group[i]] && verseMap[group[i]].titles;
    if (Array.isArray(list)) merged.push(...list);
  }
  return uniqueTitleList(merged);
};

/** Display-only: drop a heading that the edition also glued onto v.1 body. verseMap/playVerse unchanged. */
const stripLeadingTitles = (body, titles) => {
  let t = body || '';
  for (let i = 0; i < titles.length; i++) {
    const title = titles[i];
    if (!title) continue;
    const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    t = t.replace(new RegExp('^\\s*' + escaped + '[\\s\\u00a0]*', 'i'), '');
  }
  return t;
};

const VerseHeading = ({ text, active }) => {
  if (!text) return null;
  return (
    <p className={`font-serif italic mb-1 leading-snug text-sm md:text-base ${active ? 'text-stone-700' : 'text-stone-400'}`}>
      <span className="text-[10px] uppercase font-bold tracking-wide text-stone-400 not-italic mr-1.5">Heading</span>
      {text}
    </p>
  );
};

const collectTextUnder = (item) => {
  const parts = [];
  if (!item || typeof item !== 'object') return '';
  if (item.type === 'text' && item.text) parts.push(item.text);
  const kids = item.items || [];
  for (let i = 0; i < kids.length; i++) parts.push(collectTextUnder(kids[i]));
  return parts.join('');
};

const ensureVerseEntry = (map, vid, versionKey) => {
  if (!map[vid]) map[vid] = {};
  if (versionKey && !map[vid][versionKey]) {
    map[vid][versionKey] = { text: [], displayVid: vid };
  }
  return map[vid];
};

/** Walk English parallel: key by verseId; capture title paras separately; fill org→English maps. */
const walkEnglishItems = (items, map, versionKey, orgToEnglish, orgToAll, context) => {
  if (!items) return;
  for (const item of items) {
    const attrs = item.attrs || {};
    const style = attrs.style || '';

    // Title / superscription para — do not merge into verse body text
    if (item.name === 'para' && TITLE_PARA_STYLES.has(style)) {
      const titleText = collectTextUnder(item).trim();
      if (titleText) context.pendingTitles.push(titleText);
      continue; // do not walk children as verse body
    }

    const previousActiveVid = context.activeVid;
    if (attrs.verseId) {
      const engVid = attrs.verseId;
      const orgs = attrs.verseOrgIds || [];
      if (orgs.length > 0) {
        const org = orgs[0];
        if (org) {
          if (!orgToEnglish[org]) orgToEnglish[org] = engVid;
          if (!orgToAll[org]) orgToAll[org] = [];
          if (!orgToAll[org].includes(engVid)) orgToAll[org].push(engVid);
        }
      }
      context.activeVid = engVid;
      context.lastSeenVid = engVid;
      ensureVerseEntry(map, engVid, versionKey);
      if (context.pendingTitles.length > 0) {
        if (!map[engVid].titles) map[engVid].titles = [];
        map[engVid].titles.push(...context.pendingTitles);
        context.pendingTitles = [];
      }
    }

    if (item.type === 'text' && item.text) {
      if (context.activeVid && map[context.activeVid] && map[context.activeVid][versionKey]) {
        map[context.activeVid][versionKey].text.push(item.text);
      } else if (item.text.trim().length > 0 && context.lastSeenVid &&
                 map[context.lastSeenVid] && map[context.lastSeenVid][versionKey]) {
        map[context.lastSeenVid][versionKey].text.push(item.text);
      }
    }

    if (item.items && item.items.length > 0) {
      walkEnglishItems(item.items, map, versionKey, orgToEnglish, orgToAll, context);
    }
    context.activeVid = previousActiveVid;
  }
};

/** Walk original language: attach under English keys via org maps; bare superscription → titles. */
const walkOriginalItems = (items, map, orgToEnglish, orgToAll, context) => {
  if (!items) return;
  for (const item of items) {
    const attrs = item.attrs || {};
    const previousActiveVid = context.activeVid;

    if (attrs.verseId) {
      const orgVid = attrs.verseId;
      context.activeVid = orgVid;
      context.lastSeenVid = orgVid;
      const targets = (orgToAll[orgVid] && orgToAll[orgVid].length)
        ? orgToAll[orgVid]
        : (orgToEnglish[orgVid] ? [orgToEnglish[orgVid]] : null);

      if (targets) {
        context.targets = targets;
        targets.forEach((eng) => ensureVerseEntry(map, eng, 'original'));
      } else if (map[orgVid] && (map[orgVid].lsv || map[orgVid].kjv)) {
        // Same BCV string as an English verse, but this org content is superscription-only
        context.targets = null;
        context.superscriptionFor = orgVid;
        if (!map[orgVid].titles) map[orgVid].titles = [];
      } else {
        // Unmapped org-only material — do not create empty English rows
        context.targets = null;
        context.superscriptionFor = null;
      }
    }

    if (item.type === 'text' && item.text) {
      if (context.targets && context.targets.length) {
        context.targets.forEach((eng) => {
          if (map[eng] && map[eng].original) map[eng].original.text.push(item.text);
        });
      } else if (context.superscriptionFor && map[context.superscriptionFor]) {
        // Accumulate superscription surface into titles (join later)
        if (!context.superBuf) context.superBuf = {};
        const k = context.superscriptionFor;
        if (!context.superBuf[k]) context.superBuf[k] = [];
        context.superBuf[k].push(item.text);
      }
    }

    if (item.items && item.items.length > 0) {
      walkOriginalItems(item.items, map, orgToEnglish, orgToAll, context);
    }
    context.activeVid = previousActiveVid;
  }
};

const processEnglishContent = (contentArray, map, versionKey, orgToEnglish, orgToAll) => {
  if (!contentArray) return;
  const context = { activeVid: null, lastSeenVid: null, pendingTitles: [] };
  for (const section of contentArray) {
    const style = (section.attrs || {}).style || '';
    // Title paras are top-level siblings in api.bible content[]. Walking only
    // their items would glue the heading onto lastSeenVid (previous verse).
    if (section.name === 'para' && TITLE_PARA_STYLES.has(style)) {
      const titleText = collectTextUnder(section).trim();
      if (titleText) context.pendingTitles.push(titleText);
      continue;
    }
    if (section.items) walkEnglishItems(section.items, map, versionKey, orgToEnglish, orgToAll, context);
  }
};

const processOriginalContent = (contentArray, map, orgToEnglish, orgToAll) => {
  if (!contentArray) return;
  const context = {
    activeVid: null,
    lastSeenVid: null,
    targets: null,
    superscriptionFor: null,
    superBuf: {},
  };
  for (const section of contentArray) {
    if (section.items) walkOriginalItems(section.items, map, orgToEnglish, orgToAll, context);
  }
  // Flush Hebrew superscription buffers into titles[]
  Object.keys(context.superBuf).forEach((vid) => {
    const t = context.superBuf[vid].join('').trim();
    if (!t || !map[vid]) return;
    if (!map[vid].titles) map[vid].titles = [];
    map[vid].titles.push(t);
  });
};

const getBasePath = () => {
    // If we are serving from a subdirectory (e.g. /0225/), we need to go up one level to access data/
    if (window.location.pathname.match(/\/(\d{4})(\/|\/index\.html)?$/)) {
        return '../';
    }
    return '';
};

const loadDailyBread = async (dateFolder) => {
  // Check for preloaded data (SSR/Static Site Generation)
  const preloadedScript = document.getElementById('preloaded-data');
  if (preloadedScript && preloadedScript.textContent) {
      try {
          const preloaded = JSON.parse(preloadedScript.textContent);
          // Check if we already used this data to hydrate the initial load
          if (preloadedScript.dataset.used !== 'true') {
             preloadedScript.dataset.used = 'true';

             const manifest = preloaded.manifest;
             const filesMap = preloaded.files || {};

             const results = [];
             if (manifest && manifest.files) {
                 manifest.files.forEach(fileName => {
                     if (filesMap[fileName]) {
                         results.push(filesMap[fileName]);
                     }
                 });
             }

             if (results.length > 0) {
                 const verseMap = {};
                 const availableKeys = new Set(['original']);
                 processResults(results, verseMap, availableKeys);
                 return buildFinalData(verseMap, manifest, availableKeys);
             }
          }
      } catch (e) {
          console.warn("Failed to parse preloaded data", e);
      }
  }

  const basePath = getBasePath();

  // Try local first, fallback to mt-sin.ai
  let manifestRes = await fetch(`${basePath}data/${dateFolder}/manifest.json`).catch(() => null);

  // If local fetch fails or returns 404, fallback to production API
  let actualBasePath = basePath;
  if (!manifestRes || !manifestRes.ok) {
    actualBasePath = "https://mt-sin.ai/365DBR/";
    manifestRes = await fetch(`${actualBasePath}data/${dateFolder}/manifest.json`);
  }

  if (!manifestRes.ok) throw new Error(`Manifest for folder ${dateFolder} not found.`);
  const manifest = await manifestRes.json();

  const results = await Promise.all(
    manifest.files.map(async fileName => {
        const res = await fetch(`${actualBasePath}data/${dateFolder}/${fileName}`);
        if (!res.ok) throw new Error(`Failed to load ${fileName} (Status: ${res.status})`);
        const json = await res.json();
        if (!json || !json.data) {
             throw new Error(`Invalid data structure in ${fileName}`);
        }
        return json;
    })
  );

  const verseMap = {};
  const availableKeys = new Set(['original']);
  processResults(results, verseMap, availableKeys);
  return buildFinalData(verseMap, manifest, availableKeys);
};

const processResults = (results, verseMap, availableKeys) => {
  results.forEach((source) => {
    const data = source.data;
    if (!data) return;

    const orgToEnglish = {};
    const orgToAll = {};

    // 1. English parallels first (English-primary keys + org maps + titles[])
    if (data.parallels) {
      data.parallels.forEach(parallel => {
         const matchedKey = Object.keys(TRANSLATION_REGISTRY).find(key => {
            const config = TRANSLATION_REGISTRY[key];
            if (!config.idPrefix) return false; // Skip 'original'
            if (parallel.bibleId.includes(config.idPrefix)) return true;
            if (config.altIds && config.altIds.some(id => parallel.bibleId === id)) return true;
            return false;
         });

         if (matchedKey && parallel.content) {
            processEnglishContent(parallel.content, verseMap, matchedKey, orgToEnglish, orgToAll);
            availableKeys.add(matchedKey);
         }
      });
    }

    // 2. Original remapped onto English keys (no empty org-only rows)
    if (data.content) {
      processOriginalContent(data.content, verseMap, orgToEnglish, orgToAll);
    }
  });
};

const buildFinalData = (verseMap, manifest, availableKeys) => {
  // Sort keys to ensure consistent order (e.g. KJV, LSV, etc.)
  const sortedKeys = Array.from(availableKeys).filter(k => k !== 'original');

  // ⚡ Bolt Optimization: Flatten text arrays into single strings to reduce memory and render cost.
  // WARNING: If this logic changes (e.g., reverting to arrays), ensure `playVerse` is updated to handle the new format.
  // ⚡ Bolt Optimization: Use for...in loops to avoid allocating intermediate arrays (Object.keys/values)
  // during critical data loading phase. Reduces GC pressure on mobile devices.
  for (const vid in verseMap) {
      const verseData = verseMap[vid];
      for (const key in verseData) {
          const entry = verseData[key];
          if (entry.text && Array.isArray(entry.text)) {
              const config = TRANSLATION_REGISTRY[key];
              const separator = config && config.isHebrewGreek ? '' : ' ';
              entry.text = entry.text.join(separator);
          }
      }
  }

  // Calculate Reading Time (Standard 200 wpm)
  let wordCount = 0;
  Object.values(verseMap).forEach(verseData => {
      // Prioritize English if available
      const t = verseData.lsv || verseData.kjv || verseData.web || verseData.nlt || verseData.original;
      if (t && t.text) {
          // Text is already joined by space above
          wordCount += (t.text.trim() === '' ? 0 : t.text.trim().split(/\s+/).length);
      }
  });
  const readingTime = Math.ceil(wordCount / 200);

  return { verseMap, label: manifest.label, availableTranslations: sortedKeys, readingTime };
};

/** --- UTILS --- **/
const calculateDate = (currentDate, direction) => {
    const month = parseInt(currentDate.substring(0, 2)) - 1; // 0-based month
    const day = parseInt(currentDate.substring(2, 4));
    const currentYear = new Date().getFullYear();
    const date = new Date(currentYear, month, day);
    date.setDate(date.getDate() + direction);
    if (date.getMonth() === 1 && date.getDate() === 29) {
        date.setDate(date.getDate() + (direction > 0 ? 1 : -1));
    }
    const nm = String(date.getMonth() + 1).padStart(2, '0');
    const nd = String(date.getDate()).padStart(2, '0');
    return `${nm}${nd}`;
};

const LinkOrButton = ({ isStatic, currentDate, direction, children, onClick, ...props }) => {
    const handleClick = (e) => {
        if (e.currentTarget instanceof HTMLElement) e.currentTarget.blur();
        if (onClick) onClick(e);
    };

    // If static, render an <a> tag for standard navigation
    if (isStatic) {
        const nextDate = calculateDate(currentDate, direction);
        return (
            <a href={`../${nextDate}/index.html`} {...props} onClick={handleClick} title={props['aria-label']}>
                {children}
            </a>
        );
    }
    // Else render button for SPA navigation
    return (
        <button onClick={handleClick} type="button" {...props}>
            {children}
        </button>
    );
};

/** --- APP COMPONENT --- **/
const BOOK_NAMES = {

const BIBLE_BOOK_ORDER = [
  // OT
  "GEN", "EXO", "LEV", "NUM", "DEU", "JOS", "JDG", "RUT", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NEH", "EST", "JOB", "PSA", "PRO", "ECC", "SNG", "ISA", "JER", "LAM", "EZK", "DAN", "HOS", "JOL", "AMO", "OBA", "JON", "MIC", "NAM", "HAB", "ZEP", "HAG", "ZEC", "MAL",
  // NT
  "MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"
];

// O(1) Lookups for Sorting
const BIBLE_BOOK_ORDER_MAP = new Map(BIBLE_BOOK_ORDER.map((b, i) => [b, i]));
const NT_BOOKS = new Set(["MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"]);

const PILL_LABELS = ['OT', 'NT', 'PS', 'PR'];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"];

const getSectionIndex = (vid) => {
    if (!vid) return -1;
    const book = vid.substring(0, 3);
    if (book === 'PSA') return 2;
    if (book === 'PRO') return 3;
    return NT_BOOKS.has(book) ? 1 : 0;
};

// ⚡ Bolt Optimization: Optimized VID parser to avoid array allocation from split()
const parseVid = (vid) => {
    // If it is a range (e.g. SNG.4.1-SNG.4.2), just grab the first one to determine the book
    if (vid && vid.includes('-')) vid = vid.split('-')[0];

    const dot1 = vid.indexOf('.');
    const dot2 = vid.indexOf('.', dot1 + 1);

    // Fallback for malformed VIDs (though unlikely given strict data)
    if (dot1 === -1 || dot2 === -1) {
        const parts = vid.split('.');
        return { book: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
    }

    return {
        book: vid.substring(0, dot1),
        chapter: parseInt(vid.substring(dot1 + 1, dot2)),
        verse: parseInt(vid.substring(dot2 + 1))
    };
};

const generateSmartLabel = (verseMap, sortedVids, focalKey) => {
    if (!verseMap) return "";

    const getEngVid = (vid) => {
        if (!focalKey) return vid;
        const d = verseMap[vid];
        if (d && d[focalKey] && d[focalKey].displayVid) {
            return d[focalKey].displayVid;
        }
        return vid;
    };

    const vids = sortedVids || [];

    const sections = [[], [], [], []];
    vids.forEach(vid => sections[getSectionIndex(vid)].push(vid));

    const parts = [];
    sections.forEach((grp, idx) => {
        if (grp.length === 0) return;

        const startVid = grp[0];
        const endVid = grp[grp.length - 1];

        // English Range
        const sEngVid = getEngVid(startVid);
        const eEngVid = getEngVid(endVid);
        const sEng = parseVid(sEngVid);
        const eEng = parseVid(eEngVid);

        const sBookName = BOOK_NAMES[sEng.book] || sEng.book;
        const eBookName = BOOK_NAMES[eEng.book] || eEng.book;

        let engStr = `${sBookName} ${sEng.chapter}:${sEng.verse}`;
        if (sEngVid !== eEngVid) {
            if (sEng.book === eEng.book) {
                if (sEng.chapter === eEng.chapter) {
                    engStr += `-${eEng.verse}`;
                } else {
                    engStr += `-${eEng.chapter}:${eEng.verse}`;
                }
            } else {
                engStr += ` – ${eBookName} ${eEng.chapter}:${eEng.verse}`;
            }
        }

        // Original Range
        const sOrig = parseVid(startVid);
        const eOrig = parseVid(endVid);
        const sOrigBookName = BOOK_NAMES[sOrig.book] || sOrig.book;
        const eOrigBookName = BOOK_NAMES[eOrig.book] || eOrig.book;
        let origStr = `${sOrigBookName} ${sOrig.chapter}:${sOrig.verse}`;
        if (startVid !== endVid) {
            if (sOrig.book === eOrig.book) {
                 if (sOrig.chapter === eOrig.chapter) {
                    origStr += `-${eOrig.verse}`;
                } else {
                    origStr += `-${eOrig.chapter}:${eOrig.verse}`;
                }
            } else {
                origStr += ` – ${eOrigBookName} ${eOrig.chapter}:${eOrig.verse}`;
            }
        }

        if (engStr !== origStr) {
            const suffix = (idx === 1) ? "OG" : "OH";
            // Shorten Orig if matches Eng context
            let shortOrig = origStr;
            // 1. Same Book
            if (sOrig.book === sEng.book && (sEng.book === eEng.book) && (sOrig.book === eOrig.book)) {
                 shortOrig = shortOrig.replace(`${sOrigBookName} `, '');
            }
            parts.push(`${engStr} (${shortOrig} ${suffix}*)`);
        } else {
            parts.push(engStr);
        }
    });

    return parts.join(', ');
};

const CopyButton = ({ text, reference, version, ...props }) => {
    const [status, setStatus] = useState('idle');

    useEffect(() => {
        setStatus('idle');
    }, [text, reference]);

    const handleCopy = async (e) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        try {
            setStatus('copying');
            const content = `${text}\n— ${reference} (${version})`;
            await navigator.clipboard.writeText(content);
            setStatus('copied');
            setTimeout(() => setStatus('idle'), 2000);
        } catch (err) {
            console.error("Failed to copy", err);
            setStatus('idle');
        }
    };

    return (
        <button
            {...props}
            onClick={handleCopy}
            type="button"
            className="ml-2 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden"
            aria-label={status === 'copied' ? "Copied" : "Copy verse"}
            title={status === 'copied' ? "Copied!" : `Copy ${version}`}
        >
            {status === 'copied' ? (
                 <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 text-green-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />

/**
 * Word study sheet: interactive original words (hover highlight, click to find other uses).
 * Results strip only after a word is chosen — not a debug/API dump.
 * Static JSON remains primary for the reader.
 */
function StrongsPanel({ verseId, apiBase, onClose, onJumpVerse, preferredTranslation }) {
    const [status, setStatus] = useState('loading'); // loading | ready | error
    const [error, setError] = useState(null);
    const [payload, setPayload] = useState(null);
    const [hoverKey, setHoverKey] = useState(null);
    const [selected, setSelected] = useState(null); // { strong, surface, order }
    const [strongHits, setStrongHits] = useState(null);
    const [strongLoading, setStrongLoading] = useState(false);
    const panelRef = useRef(null);

    useEffect(() => {
        let cancelled = false;
        setStatus('loading');
        setError(null);
        setPayload(null);
        setSelected(null);
        setStrongHits(null);
        setHoverKey(null);
        (async () => {
            try {
                const data = await fetchVerseDetail(verseId, apiBase);
                if (!cancelled) {
                    setPayload(data);
                    setStatus('ready');
                }
            } catch (e) {
                if (!cancelled) {
                    setError(e.message || String(e));
                    setStatus('error');
                }
            }
        })();
        return () => { cancelled = true; };
    }, [verseId, apiBase]);

    useEffect(() => {
        const onKey = (e) => {
            if (e.key === 'Escape') {
                if (selected) {
                    setSelected(null);
                    setStrongHits(null);
                } else {
                    onClose();
                }
            }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
    }, [onClose, selected]);

    useEffect(() => {
        try { panelRef.current?.focus(); } catch (_) { /* ignore */ }
    }, [verseId]);

    const loadStrong = useCallback(async (token) => {
        if (!token?.strong || !apiBase) return;
        setSelected({ strong: token.strong, surface: token.surface, order: token.order });
        setStrongLoading(true);
        setStrongHits(null);
        try {
            setStrongHits(await fetchStrongHits(token.strong, apiBase, 12));
        } catch (e) {
            setStrongHits({ error: e.message || String(e) });
        } finally {
            setStrongLoading(false);
        }
    }, [apiBase]);

    const tokens = payload?.original?.tokens || [];
    const withStrong = tokens.some((t) => t.strong);
    const isHeb = (payload?.original?.language || '') === 'hebrew';
    const wsTitles = uniqueTitleList(payload?.titles || []);
    const titleText = wsTitles.join(' · ');
    const translations = payload?.translations || {};
    // Prefer current focal English (kjv/lsv/lsb); fall back across known codes.
    const pref = (preferredTranslation || '').toUpperCase();
    const englishRaw =
        (pref && (translations[pref] || translations[pref.toLowerCase()])) ||
        translations.LSB || translations.lsb ||
        translations.LSV || translations.lsv ||
        translations.KJV || translations.kjv ||
        '';
    const englishBody = wsTitles.length ? stripLeadingTitles(englishRaw, wsTitles) : englishRaw;
    const humanRef = formatVerseRef(verseId);

    return (
        <div
            ref={panelRef}
            role="dialog"
            aria-modal="false"
            aria-label={`Word study for ${humanRef}`}
            tabIndex={-1}
            className="fixed bottom-0 inset-x-0 z-[60] print:hidden outline-none"
        >
            <div className="max-w-7xl mx-auto px-2 pb-2 md:pb-3">
                <div className="bg-white border border-stone-200 shadow-2xl rounded-t-xl md:rounded-xl max-h-[48vh] md:max-h-[52vh] flex flex-col overflow-hidden">
                    <div className="flex items-center justify-between gap-2 px-3 py-2 border-b border-stone-100 bg-stone-50 shrink-0">
                        <div className="min-w-0">
                            <div className="text-[10px] uppercase font-bold tracking-wide text-stone-400">Word study</div>
                            <div className="text-sm font-serif font-bold truncate text-stone-900">{humanRef}</div>
                        </div>
                        <button
                            type="button"
                            onClick={onClose}
                            className="shrink-0 px-2.5 py-1 text-[11px] font-semibold text-stone-600 hover:text-stone-900 border border-stone-200 rounded-md bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500"
                            aria-label="Done"
                        >
                            Done
                        </button>
                    </div>
                    <div className="overflow-y-auto p-3 md:p-4 space-y-3 text-stone-800">
                        {status === 'loading' && (
                            <p className="text-sm text-stone-500 font-serif italic">Loading…</p>
                        )}
                        {status === 'error' && (
                            <p className="text-sm text-red-600">Word study is unavailable right now.</p>
                        )}
                        {status === 'ready' && (
                            <>
                                <VerseHeading text={titleText} active={true} />
                                {englishBody && (
                                    <p className="text-sm md:text-base font-serif text-stone-800 leading-snug">
                                        {englishBody}
                                    </p>
                                )}
                                {tokens.length === 0 ? (
                                    <p className="text-sm text-stone-500">No original-language words are stored for this verse.</p>
                                ) : (
                                    <div>
                                        {withStrong && (
                                            <p className="text-[11px] text-stone-400 mb-2">
                                                Hover a word to highlight · click a word to find other uses
                                            </p>
                                        )}
                                        {/* Flowing original line — RTL for Hebrew, LTR for Greek */}
                                        <p
                                            className={`text-lg md:text-2xl leading-relaxed ${isHeb ? 'hebrew' : 'greek'}`}
                                            dir={isHeb ? 'rtl' : 'ltr'}
                                            style={{ textAlign: isHeb ? 'right' : 'left', unicodeBidi: 'isolate' }}
                                        >
                                            {tokens.map((t, i) => {
                                                const hasS = !!t.strong;
                                                const key = `${t.order}-${t.strong || ''}-${i}`;
                                                const isHover = hoverKey === key;
                                                const isSel = selected && selected.order === t.order && selected.strong === t.strong;
                                                const tip = hasS
                                                    ? `${t.surface} · Strong’s ${t.strong} — click for other uses`
                                                    : t.surface;
                                                const Tag = hasS ? 'button' : 'span';
                                                return (
                                                    <React.Fragment key={key}>
                                                        {i > 0 && !isHeb && ' '}
                                                        <Tag
                                                            type={hasS ? 'button' : undefined}
                                                            onClick={(e) => {
                                                                if (!hasS) return;
                                                                e.stopPropagation();
                                                                loadStrong(t);
                                                            }}
                                                            onMouseEnter={() => setHoverKey(key)}
                                                            onMouseLeave={() => setHoverKey(null)}
                                                            onFocus={() => setHoverKey(key)}
                                                            onBlur={() => setHoverKey(null)}
                                                            title={tip}
                                                            aria-label={tip}
                                                            className={`inline rounded-sm px-0.5 transition-colors duration-100 align-baseline ${
                                                                hasS
                                                                    ? 'cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500'
                                                                    : 'cursor-default'
                                                            } ${
                                                                isSel
                                                                    ? 'bg-amber-300 text-stone-900 ring-1 ring-amber-500'
                                                                    : isHover && hasS
                                                                      ? 'bg-amber-200 text-stone-900'
                                                                      : hasS
                                                                        ? 'hover:bg-amber-100'
                                                                        : ''
                                                            }`}
                                                            style={{ unicodeBidi: 'isolate' }}
                                                        >
                                                            {t.surface}
                                                        </Tag>
                                                    </React.Fragment>
                                                );
                                            })}
                                        </p>
                                        {!withStrong && (
                                            <p className="text-[11px] text-stone-400 mt-2">
                                                Word numbers are not available for these original words.
                                            </p>
                                        )}
                                    </div>
                                )}
                                {/* Results only after a word is clicked */}
                                {selected && (
                                    <div className="border-t border-stone-100 pt-3 mt-1">
                                        <div className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5 mb-2">
                                            <span className={`text-base ${isHeb ? 'hebrew' : 'greek'}`} dir={isHeb ? 'rtl' : 'ltr'}>
                                                {selected.surface}
                                            </span>
                                            <span className="text-xs font-semibold text-amber-800" dir="ltr">
                                                Strong’s {selected.strong}
                                            </span>
                                            {strongHits?.total_verses != null && (
                                                <span className="text-xs text-stone-400">
                                                    {strongHits.total_verses.toLocaleString()} place{strongHits.total_verses === 1 ? '' : 's'} in Scripture
                                                </span>
                                            )}
                                        </div>
                                        {strongLoading && <p className="text-sm text-stone-500">Finding other uses…</p>}
                                        {strongHits?.error && <p className="text-sm text-red-600">Could not search right now.</p>}
                                        {strongHits?.hits && (
                                            <ul className="space-y-2 max-h-36 overflow-y-auto">
                                                {strongHits.hits.map((h) => (
                                                    <li key={`${h.verse_id}-${h.surface}`} className="text-sm leading-snug">
                                                        <button
                                                            type="button"
                                                            className="font-serif font-bold text-amber-900 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded text-left"
                                                            onClick={() => onJumpVerse?.(h.verse_id)}
                                                        >
                                                            {formatVerseRef(h.verse_id)}
                                                        </button>
                                                        {(h.snippet || h.lsv || h.english) && (
                                                            <span className="block text-stone-600 pl-0.5 line-clamp-2 font-serif">{h.snippet || h.lsv || h.english}</span>
                                                        )}
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
}

const VerseGroup = React.memo(({ group, verseMap, dynamicSlots, isActive, isDimmed, isPlaying, onBookmark, onOpenStrongs, strongsAvailable }) => {
    const vid = group[0];
    const book = vid.substring(0, 3);
    const sectionIndex = getSectionIndex(vid);
    const focalTheme = FOCAL_THEMES[sectionIndex] || FOCAL_THEMES[0];

    // ⚡ Bolt Optimization: Use O(1) Set lookup instead of O(N) array includes + allocation
    const isHebrew = !NT_BOOKS.has(book);

    const handleVerseClick = (e) => {
        if (isPlaying) return;

        // Prevent scroll if selecting text
        const selection = window.getSelection();
        if (selection && selection.type === 'Range' && selection.toString().length > 0) return;

        const el = document.getElementById(`verse-${vid}`);
        if (el) {
            const rect = el.getBoundingClientRect();
            const absoluteTop = window.scrollY + rect.top;
            const targetY = absoluteTop - 60;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
    };

    // ⚡ Bolt Optimization: Memoize content generation to prevent expensive string operations
    // on every render (e.g. during scroll/highlight transitions).
    // The content only changes if translations or data change, not when 'isActive' toggles.
    const renderedSlots = useMemo(() => {
        const groupTitles = collectGroupTitles(group, verseMap);
        const titleText = groupTitles.join(' · ');
        const getSlotContent = (slot) => {
            if (!slot || !slot.source) return { text: '', displayLabel: '' };

            let fullText = '';
            let displayLabel = '';
            const contributing = [];

            group.forEach((gVid) => {
                const data = verseMap[gVid];
                const slotData = data ? data[slot.source] : null;
                if (slotData && slotData.text) {
                    // ⚡ Bolt Optimization: Text is now pre-joined in loadDailyBread
                    fullText += (fullText ? ' ' : '') + slotData.text;

                    contributing.push(slotData.displayVid || gVid);
                }
            });
            if (slot.source !== 'original' && groupTitles.length) {
                fullText = stripLeadingTitles(fullText, groupTitles);
            }

            if (contributing.length > 0) {
                const first = contributing[0];
                const last = contributing[contributing.length - 1];

                const s = parseVid(first);
                const e = parseVid(last);
                const bName = BOOK_NAMES[s.book] || s.book;

                if (first === last) {
                    displayLabel = `${bName} ${s.chapter}:${s.verse}`;
                } else if (s.book === e.book) {
                    if (s.chapter === e.chapter) {
                        displayLabel = `${bName} ${s.chapter}:${s.verse}-${e.verse}`;
                    } else {
                        displayLabel = `${bName} ${s.chapter}:${s.verse}-${e.chapter}:${e.verse}`;
                    }
                } else {
                    const eName = BOOK_NAMES[e.book] || e.book;
                    displayLabel = `${bName} ${s.chapter}:${s.verse} - ${eName} ${e.chapter}:${e.verse}`;
                }

            } else if (group.length > 0) {
                const [b, c, v] = group[0].split('.');
                displayLabel = `${BOOK_NAMES[b] || b} ${c}:${v}`;
            }

            return { text: fullText, displayLabel, titleText };
        };

        const getLabel = (slot) => typeof slot.label === 'function' ? slot.label(isHebrew) : slot.label;

        return {
            titleText,
            top: { ...getSlotContent(dynamicSlots.top), label: getLabel(dynamicSlots.top), config: dynamicSlots.top },
            middle: { ...getSlotContent(dynamicSlots.middle), label: getLabel(dynamicSlots.middle), config: dynamicSlots.middle },
            bottom: { ...getSlotContent(dynamicSlots.bottom), label: getLabel(dynamicSlots.bottom), config: dynamicSlots.bottom, attribution: dynamicSlots.bottom.attribution }
        };
    }, [group, verseMap, dynamicSlots, isHebrew]);

    return (
        <div id={`verse-${vid}`} onClick={handleVerseClick} className={`verse-block group transition-all duration-700 scroll-mt-12 md:scroll-mt-14 ${isDimmed ? 'opacity-10 grayscale' : 'opacity-100'} ${!isPlaying ? 'cursor-pointer' : ''}`}>
            <div className="flex flex-col gap-1">
            {/* SLOT 1: TOP (Usually Original) */}
            {(() => {
                const { text, displayLabel, label, config } = renderedSlots.top;
                return (
                    <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-900 border-amber-600 shadow-md' : 'bg-stone-50/50 border-stone-100'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                        <span className={`text-[7px] md:text-[10px] uppercase font-black tracking-widest ${isActive ? 'text-amber-500' : 'text-stone-400'}`}>{label}</span>
                        <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-mono font-bold ${isActive ? 'text-amber-500' : 'text-stone-400'} uppercase`}>
                             <span>{displayLabel}</span>
                             {!isPlaying && (
                                <CopyButton
                                    text={text}
                                    reference={displayLabel}
                                    version={isHebrew ? 'OH' : 'OG'}
                                    tabIndex={isActive ? 0 : -1}
                                    aria-hidden={!isActive}
                                />
                             )}
                        </div>
                    </div>
                    <div className={`leading-tight tracking-tight break-words ${config.isHebrewGreek ? (isHebrew ? 'hebrew text-[12px] md:text-xl text-right' : 'greek text-base md:text-lg text-left') : 'text-lg md:text-3xl font-serif italic'}`} style={{ direction: config.isHebrewGreek && isHebrew ? 'rtl' : 'ltr' }}>
                        <span className={isActive ? 'text-white' : 'text-stone-500'}>{text}</span>
                    </div>
                    </div>
                );
            })()}

            {/* SLOT 2: MIDDLE (Secondary) */}
            {(() => {
                const { text, displayLabel, label } = renderedSlots.middle;
                return (
                <div className={`px-2 py-1 md:px-3 md:py-15 rounded-lg transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-200 shadow-lg border-stone-800 ring-1 ring-stone-800/50' : 'bg-white/40 border-transparent opacity-80'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>{label}</span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-black uppercase mb-0.5 ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>
                        <span>{displayLabel}</span>
                        {!isPlaying && dynamicSlots.middle.source && (
                            <CopyButton
                                text={text}
                                reference={displayLabel}
                                version={dynamicSlots.middle.source.toUpperCase()}
                                tabIndex={isActive ? 0 : -1}
                                aria-hidden={!isActive}
                            />
                        )}
                    </div>
                    </div>
                    <div><span className={`text-base md:text-xl font-serif font-bold italic leading-tight tracking-tighter ${isActive ? 'text-stone-900' : 'text-stone-500'}`}>{text}</span></div>
                </div>
                );
            })()}

            {/* SLOT 3: BOTTOM (Focal) — heading shown once here, not on compare/original */}
            {(() => {
                const { text, displayLabel, label, attribution } = renderedSlots.bottom;

// Helper to format MMDD into a human date like "Jan 2nd"
const formatDate = (mmdd) => {
  const m = parseInt(mmdd.substring(0, 2)) - 1;
  const d = parseInt(mmdd.substring(2, 4));
  const j = d % 10, k = d % 100;
  let suffix = "th";
  if (j == 1 && k != 11) suffix = "st";
  else if (j == 2 && k != 12) suffix = "nd";
  else if (j == 3 && k != 13) suffix = "rd";
  return `${MONTHS[m]} ${d}${suffix}`;
};

const ReadingProgress = React.memo(({ sectionIndex }) => {
  const barRef = useRef(null);
  // Default to OT theme if sectionIndex is invalid or initial
  const theme = SECTION_THEMES[sectionIndex] || SECTION_THEMES[0];

  useEffect(() => {
    let ticking = false;
    const updateWidth = () => {
       if (barRef.current) {
          const scrollHeight = document.body.scrollHeight - window.innerHeight;
          if (scrollHeight > 0) {
            const scrolled = (window.scrollY / scrollHeight) * 100;
            const val = Math.min(100, Math.max(0, scrolled));
            barRef.current.style.width = `${val}%`;
            barRef.current.setAttribute('aria-valuenow', Math.round(val));
          }
       }
       ticking = false;
    };

    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(updateWidth);
        ticking = true;
      }
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    updateWidth(); // Initial check
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  return (
    <div className="absolute bottom-0 left-0 right-0 h-[3px] bg-transparent pointer-events-none z-50 print:hidden flex justify-center">
      <div className="w-full max-w-7xl h-full relative">
        <div
            ref={barRef}
            className={`h-full w-0 transition-all duration-300 ease-out shadow-lg ${theme.bg} ${theme.shadow}`}
            role="progressbar"
            aria-valuemin={0}
            aria-valuemax={100}
            aria-valuenow={0}
            aria-label={`Reading Progress (Current Section: ${['Old Testament', 'New Testament', 'Psalms', 'Proverbs'][sectionIndex] || 'Unknown'})`}
        />
      </div>
    </div>
  );
});

const ScrollToTop = React.memo(() => {
  const [show, setShow] = useState(false);

  useEffect(() => {
    let ticking = false;
    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
            setShow(window.scrollY > 400);
            ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <button
      onClick={scrollToTop}
      aria-label="Scroll to top"
      title="Scroll to top"
      className={`fixed bottom-20 right-4 z-40 p-2 rounded-full bg-stone-900/80 text-white shadow-xl transition-all duration-300 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 print:hidden ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
    >
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  );
});

const App = () => {
  // Helper to resolve initial state from URL -> LocalStorage -> Today
  const getInitialState = () => {
    // 1. Load Saved Session First (to get preferences & history)
    let savedState = {};
    try {
        const saved = localStorage.getItem('biblical_reading_state');
        if (saved) savedState = JSON.parse(saved);
    } catch (e) { console.warn("Failed to load saved state", e); }

    // 2. Determine Date (URL > Saved > Today)
    let initialDate = savedState.date;

    const params = new URLSearchParams(window.location.search);
    const urlDate = params.get('startDate');
    if (urlDate && /^\d{4}$/.test(urlDate)) {
        initialDate = urlDate;
    }

    // Support Path-based routing (Static Site Generation)
    // Format: /365DBR/0224/ or /0224/
    const pathMatch = window.location.pathname.match(/\/(\d{4})(\/|\/index\.html)?$/);
    if (pathMatch) {
        initialDate = pathMatch[1];
    }

    if (!initialDate || !/^\d{4}$/.test(initialDate)) {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        initialDate = `${month}${day}`;
    }

    // 3. Resolve Verse ID from History
    // Check if we have a saved spot for this SPECIFIC date in history
    let initialVerseId = null;
    if (savedState.history && savedState.history[initialDate]) {
        initialVerseId = savedState.history[initialDate];
    } else if (savedState.date === initialDate && savedState.verseId) {
        // Fallback to legacy single-verseId if history missing but date matches
        initialVerseId = savedState.verseId;
    }

    return {
        ...savedState,
        date: initialDate,
        verseId: initialVerseId
    };
  };

  const initialState = useMemo(() => getInitialState(), []);

  const todayString = useMemo(() => {
    const now = new Date();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${m}${d}`;
  }, []);

  const [verseMap, setVerseMap] = useState(null);
  const [readingTime, setReadingTime] = useState(0);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [currentDate, setCurrentDate] = useState(() => {
      const params = new URLSearchParams(window.location.search);
      const d = params.get('d');
      return d || initialState.date;
  });

  // ⚡ Bolt Optimization: Memoize formatted date string to avoid parsing/formatting on every render frame
  const formattedDate = useMemo(() => formatDate(currentDate), [currentDate]);
  const [playbackStatus, setPlaybackStatus] = useState('stopped');
  const [activeVerseId, setActiveVerseId] = useState(initialState.verseId || null); // Visual position (scroll tracking)
  const activeVerseIdRef = useRef(activeVerseId);
  const isNavigatingRef = useRef(false);
  const navigationTimeoutRef = useRef(null);
  useEffect(() => { activeVerseIdRef.current = activeVerseId; }, [activeVerseId]);

  const [playbackVerseId, setPlaybackVerseId] = useState(null); // Where playback is at
  const playbackVerseIdRef = useRef(playbackVerseId);
  useEffect(() => { playbackVerseIdRef.current = playbackVerseId; }, [playbackVerseId]);
  
  // Dynamic State for Translation Slots
  const [availableTranslations, setAvailableTranslations] = useState([]);
  const [focalTranslation, setFocalTranslation] = useState(initialState.focal || null); // Slot 3 (Bottom)
  const [compareTranslation, setCompareTranslation] = useState(initialState.compare || null); // Slot 2 (Middle)

  // Scroll target for restoration
  const [targetScrollVerse, setTargetScrollVerse] = useState(initialState.verseId || null);

  // Bookmarks State
  const [bookmarks, setBookmarks] = useState({});
  const [bookmarkDialogTarget, setBookmarkDialogTarget] = useState(null);

  const closeBookmarkDialog = useCallback(() => setBookmarkDialogTarget(null), []);

  // Optional Strong's (feature-detect local query API). Null base ⇒ UI hidden.
  const [queryApiBase, setQueryApiBase] = useState(null);
  const [strongsVerseId, setStrongsVerseId] = useState(null);
  const openStrongs = useCallback((vid) => {
    if (!vid) return;
    setStrongsVerseId(vid);
  }, []);
  const closeStrongs = useCallback(() => setStrongsVerseId(null), []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const base = await probeQueryApi(resolveQueryApiBase());
      if (!cancelled) setQueryApiBase(base);
    })();
    return () => { cancelled = true; };
  }, []);

  // Close Strong's panel during audio playback (do not fight playVerse UX)
  useEffect(() => {
    if (playbackStatus === 'playing') setStrongsVerseId(null);
  }, [playbackStatus]);

  // Load bookmarks on mount
  useEffect(() => {
      const loadBookmarks = () => {
          try {
              const saved = localStorage.getItem('bible_browser_bookmarks');
              if (saved) setBookmarks(JSON.parse(saved));
          } catch (e) { console.warn("Failed to load bookmarks", e); }
      };

      loadBookmarks();

      window.addEventListener('bookmarksUpdated', loadBookmarks);
      window.addEventListener('storage', (e) => {
          if (e.key === 'bible_browser_bookmarks') loadBookmarks();
      });

      return () => {
          window.removeEventListener('bookmarksUpdated', loadBookmarks);
          window.removeEventListener('storage', loadBookmarks);
      };
  }, []);

  const handleSaveBookmark = useCallback((slot, vid, color) => {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      setBookmarks(prevBookmarks => {
          const newBookmarks = { ...prevBookmarks };
          if (!vid) {
              delete newBookmarks[slot];
          } else {
              newBookmarks[slot] = { vid, color };
          }
          localStorage.setItem('bible_browser_bookmarks', JSON.stringify(newBookmarks));
          window.dispatchEvent(new Event('bookmarksUpdated'));
          return newBookmarks;
      });
  }, []);

  // Check if running in Static Mode (preloaded data present)
  // We use a ref to track if we *started* with preloaded data, but strictly checking DOM is fine.
  const isStatic = !!document.getElementById('preloaded-data') || new URLSearchParams(window.location.search).get('static') === 'true';

  // Persistence with Smart Debounce
  // ⚡ Bolt Optimization: Debounce scroll updates (activeVerseId) to prevent blocking main thread with synchronous localStorage writes.
  // Immediate saves are still performed for critical user actions (Date/Translation changes).
  const prevDate = useRef(currentDate);
  const prevFocal = useRef(focalTranslation);
  const prevCompare = useRef(compareTranslation);

  useEffect(() => {
      if (loading) return;

      const isCriticalChange = (
          currentDate !== prevDate.current ||
          focalTranslation !== prevFocal.current ||
          compareTranslation !== prevCompare.current
      );

      const save = () => {
          // Smart Bookmark: Only save progress if reading today or in the past.
          // This prevents "looking ahead" (e.g., previewing tomorrow) from overwriting your actual spot.
          // Translation preferences (focal/compare) are always saved.
          const today = new Date();
          // Reset time to ensure we compare just dates
          today.setHours(0, 0, 0, 0);

          // Smart Bookmark: Use dynamic year to compare dates correctly
          const currentYear = today.getFullYear();
          const currentMonth = parseInt(currentDate.substring(0, 2)) - 1;
          const currentDay = parseInt(currentDate.substring(2, 4));

          // Construct View Date using current year
          const viewDate = new Date(currentYear, currentMonth, currentDay);

          // Handle Year Wrap for View Date (e.g. Viewing Jan 01 when Today is Dec 31)
          // If Today is Dec and View is Jan, View is clearly Next Year
          if (today.getMonth() === 11 && currentMonth === 0) {
              viewDate.setFullYear(currentYear + 1);
          }
          // If Today is Jan and View is Dec, View is clearly Last Year (Past)
          else if (today.getMonth() === 0 && currentMonth === 11) {
              viewDate.setFullYear(currentYear - 1);
          }

          // Construct Max Allowed Date (Today + 1 Day)
          const maxAllowedDate = new Date(today);
          maxAllowedDate.setDate(today.getDate() + 1);

          // Logic: Save verseId ONLY if viewDate <= maxAllowedDate
          const isFuture = viewDate > maxAllowedDate;

          const state = {
              date: currentDate,
              focal: focalTranslation,
              compare: compareTranslation,
              // If viewing future, preserve the LAST SAVED verseId (from initial load or previous save)
              // rather than overwriting it with the future date's scroll position.
              // However, we only have 'activeVerseId' or 'targetScrollVerse' here.
              // We need to know what the *persisted* verseId was if we want to "not save" the new one.
              // Actually, simply NOT updating the 'verseId' field in the new state object would delete it if we overwrite.
              // So we should read the OLD state to preserve it?
              // No, simpler: If future, just save the preferences, BUT keep the date synced?
              // User requirement: "If they look ahead... they will have to remember where they were."
              // Wait, the user said: "I am trying to keep track of where they are in their reading, not in their looking ahead."
              // This implies we should NOT update the 'date' and 'verseId' in localStorage if they are just peeking.
              // BUT, if we don't save 'date', when they reload, they will be back at the old date.
              // This might be what they want? "Smart Bookmark" usually implies "save my place in the book", not "save which page I'm looking at right now".

              // Let's interpret "Smart Bookmark" strictly:
              // 1. Always save TRANSLATION preferences (focal/compare).
              // 2. If Date <= Today: Save Date + VerseID.
              // 3. If Date > Today: Do NOT save Date + VerseID (keep the old ones in localStorage).

              // Implementation: Read existing state to merge? Or just conditional update?
              // LocalStorage is a key-value store. We overwrite the whole JSON.
          };

          // We need to fetch the PREVIOUSLY SAVED state to preserve it if we are "looking ahead".
          let previousState = {};
          try {
              previousState = JSON.parse(localStorage.getItem('biblical_reading_state') || '{}');
          } catch (e) {}

          const newState = {
              ...previousState, // Keep old date/verse if we don't overwrite them
              focal: focalTranslation,
              compare: compareTranslation
          };

          if (!isFuture) {
              // We are in the past/present -> Update Reading Progress
              newState.date = currentDate;
              newState.verseId = activeVerseId || targetScrollVerse;

              // Update History
              if (!newState.history) newState.history = {};
              if (newState.verseId) {
                  newState.history[currentDate] = newState.verseId;
              }
          }

          localStorage.setItem('biblical_reading_state', JSON.stringify(newState));

          // Update refs to current state
          prevDate.current = currentDate;
          prevFocal.current = focalTranslation;
          prevCompare.current = compareTranslation;
      };

      if (isCriticalChange) {
          save();
      } else {
          // Debounce scroll updates
          const handler = setTimeout(save, 500);
          return () => clearTimeout(handler);
      }
  }, [currentDate, focalTranslation, compareTranslation, activeVerseId, loading]);

  // URL Sync
  useEffect(() => {
      const url = new URL(window.location);
      if (url.searchParams.get('startDate') !== currentDate) {
          url.searchParams.set('startDate', currentDate);
          window.history.pushState({}, '', url);
      }

      // Reset or Restore Active Verse State on Date Change
      // This is critical to prevent stale state from previous day being saved to new day.
      // We check if we have a history entry for the NEW date.
      let historyVerse = null;
      try {
          const s = JSON.parse(localStorage.getItem('biblical_reading_state') || '{}');
          if (s.history && s.history[currentDate]) {
              historyVerse = s.history[currentDate];
          }
      } catch (e) {}

      // If we have history, we set it (so it highlights/saves correctly).
      // If not, we set null (so we start fresh at top).
      // Note: targetScrollVerse handles the initial scroll, but activeVerseId needs to be in sync for state saving.
      setActiveVerseId(historyVerse);

  }, [currentDate]);

  // Scroll Restoration
  useEffect(() => {
      if (!loading && targetScrollVerse && verseMap) {
          const el = document.getElementById(`verse-${targetScrollVerse}`);
