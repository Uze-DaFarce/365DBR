<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <style>
        body { background: #f0f0f0; margin: 0; padding: 20px; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .img-card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .img-card img { max-width: 100%; height: auto; max-height: 150px; }
        .img-name { margin-top: 10px; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Extracted Images</h1>
    <div class="grid">
        <div class="img-card"><img src="images/armor_of_god.png"><div class="img-name">armor_of_god.png</div></div>
        <div class="img-card"><img src="images/bible_closed.png"><div class="img-name">bible_closed.png</div></div>
        <div class="img-card"><img src="images/bible_open.png"><div class="img-name">bible_open.png</div></div>
        <div class="img-card"><img src="images/chalkboard.png"><div class="img-name">chalkboard.png</div></div>
        <div class="img-card"><img src="images/computer_desk.png"><div class="img-name">computer_desk.png</div></div>
        <div class="img-card"><img src="images/footprints.png"><div class="img-name">footprints.png</div></div>
        <div class="img-card"><img src="images/handprint.svg"><div class="img-name">handprint.svg</div></div>
        <div class="img-card"><img src="images/he_is_risen.png"><div class="img-name">he_is_risen.png</div></div>
        <div class="img-card"><img src="images/paul_revere.png"><div class="img-name">paul_revere.png</div></div>
        <div class="img-card"><img src="images/paul_revere_2.png"><div class="img-name">paul_revere_2.png</div></div>
        <div class="img-card"><img src="images/treehouse_bg.jpg"><div class="img-name">treehouse_bg.jpg</div></div>
        <div class="img-card"><img src="images/treehouse_cutout.png"><div class="img-name">treehouse_cutout.png</div></div>
        <div class="img-card"><img src="images/whiteboard_frame.png"><div class="img-name">whiteboard_frame.png</div></div>
        <div class="img-card"><img src="images/wood_texture.jpg"><div class="img-name">wood_texture.jpg</div></div>
    </div>
</body>
</html>
