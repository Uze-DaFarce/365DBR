import React, { useState, useEffect, useMemo, useRef } from 'react';
import { createRoot } from 'react-dom/client';

/** --- CONFIGURATION --- **/
const TRANSLATION_REGISTRY = {
  // Original Language (Always present as 'content')
  original: {
    source: 'original', // Explicit source key for data lookup
    label: (isHebrew) => `ORIGINAL ${isHebrew ? 'HEBREW' : 'GREEK'}`,
    isHebrewGreek: true
  },
  // English Parallels (Detected by bibleId)
  kjv: {
    idPrefix: 'de4e12af',
    label: 'KJV - King James Version'
  },
  lsv: {
    idPrefix: '06125ada', // Covers 06125adad2d5898a-01
    altIds: ['01b29f4b342acc35-01'],
    label: 'LSV - Literal Standard Version',
    attribution: {
      text: '©',
      link: '#footer',
      title: 'View Copyright Information'
    }
  },
  web: {
    idPrefix: '9879dbb7',
    label: 'WEB - World English Bible'
  },
  nlt: {
    idPrefix: 'd6e14a62',
    label: 'NLT - New Living Translation',
    attribution: {
        text: '©',
        link: '#footer', // Placeholder, would need update if NLT specific footer requirement
        title: 'View Copyright Information'
    }
  }
};

/** --- DATA UTILITIES --- **/
// Recursive walker with active verse context to safely handle nested structures and orphans
const walkItems = (items, map, versionKey, useOrgId, buffer, context) => {
  if (!items) return;
  items.forEach((item) => {
    let previousActiveVid = context.activeVid; // Store stack for backtracking

    // 1. Enter Verse Scope?
    if (item.attrs?.verseId) {
      let keyVid = item.attrs.verseId;
      // If parallels have explicit mapping to original verse (verseOrgIds), use it.
      if (useOrgId && item.attrs.verseOrgIds && item.attrs.verseOrgIds.length > 0) {
        keyVid = item.attrs.verseOrgIds[0];
      }
      context.activeVid = keyVid;
      context.lastSeenVid = keyVid; // Track linear progression across hierarchy

      if (!map[keyVid]) map[keyVid] = {};
      if (!map[keyVid][versionKey]) {
         map[keyVid][versionKey] = {
            text: [],
            displayVid: item.attrs.verseId // Store the native ID for display (e.g. LEV.6.1)
         };
      }
      
      // Flush buffer if exists (orphaned content found BEFORE this verse belongs here, e.g. Titles)
      if (buffer && buffer.text.length > 0) {
         map[keyVid][versionKey].text.push(...buffer.text);
         buffer.text = []; // Clear buffer
      }
    }

    // 2. Process Text Content
    if (item.type === 'text' && item.text) {
        if (context.activeVid) {
            // Case A: Inside a verse container. Safe add.
            if (map[context.activeVid] && map[context.activeVid][versionKey]) {
                map[context.activeVid][versionKey].text.push(item.text);
            }
        } else {
            // Case B: Orphaned Text (No active container)
            if (item.text.trim().length > 0) {
                if (context.lastSeenVid) {
                    // Sub-case B1: We have seen a verse before. This orphan likely belongs to it (e.g. formatting sibling).
                    // Append to PREVIOUS/LAST SEEN verse.
                    if (map[context.lastSeenVid] && map[context.lastSeenVid][versionKey]) {
                        map[context.lastSeenVid][versionKey].text.push(item.text);
                    }
                } else {
                    // Sub-case B2: No verse seen yet (Start of file). This is likely a Title.
                    // Buffer it for the NEXT verse.
                    if (buffer) {
                        buffer.text.push(item.text);
                    }
                }
            }
        }
    }
    
    // 3. Recurse
    if (item.items && item.items.length > 0) {
        walkItems(item.items, map, versionKey, useOrgId, buffer, context);
    }

    // 4. Exit Scope
    context.activeVid = previousActiveVid;
  });
};

const processContent = (contentArray, map, versionKey, useOrgId = false) => {
  if (!contentArray) return;
  // Buffer context for this processing pass
  const buffer = { text: [] }; 
  // Context MUST be shared across the entire section to track lastSeenVid linearly
  const context = { activeVid: null, lastSeenVid: null };
  contentArray.forEach(section => { 
      if (section.items) walkItems(section.items, map, versionKey, useOrgId, buffer, context); 
  });
};

const loadDailyBread = async (dateFolder) => {
  const manifestPath = `data/${dateFolder}/manifest.json`;
  const manifestRes = await fetch(manifestPath);
  if (!manifestRes.ok) throw new Error(`Manifest for folder ${dateFolder} not found.`);
  const manifest = await manifestRes.json();
  const verseMap = {};
  const availableKeys = new Set(['original']); // Track what we found

  const results = await Promise.all(
    manifest.files.map(async fileName => {
        const res = await fetch(`data/${dateFolder}/${fileName}`);
        if (!res.ok) throw new Error(`Failed to load ${fileName} (Status: ${res.status})`);
        const json = await res.json();
        // Integrity Check: Must have data.content OR data.parallels
        // Our API response wrapper usually has { data: { content: ... } } or { data: { parallels: ... } }
        // But api.bible returns { data: { content: ... } }
        // Let's check for 'data' property
        if (!json || !json.data) {
             throw new Error(`Invalid data structure in ${fileName}`);
        }
        return json;
    })
  );

  results.forEach((source) => {
    const data = source.data;
    if (!data) return;

    // 1. Process Original Content (if present)
    if (data.content) {
      processContent(data.content, verseMap, 'original', false);
    }

    // 2. Process Parallels (Dynamic Discovery)
    if (data.parallels) {
      data.parallels.forEach(parallel => {
         // Find which registry key matches this parallel's bibleId
         const matchedKey = Object.keys(TRANSLATION_REGISTRY).find(key => {
            const config = TRANSLATION_REGISTRY[key];
            if (!config.idPrefix) return false; // Skip 'original'
            if (parallel.bibleId.includes(config.idPrefix)) return true;
            if (config.altIds && config.altIds.some(id => parallel.bibleId === id)) return true;
            return false;
         });

         if (matchedKey && parallel.content) {
            processContent(parallel.content, verseMap, matchedKey, true);
            availableKeys.add(matchedKey);
         }
      });
    }
  });
  
  // Sort keys to ensure consistent order (e.g. KJV, LSV, etc.)
  const sortedKeys = Array.from(availableKeys).filter(k => k !== 'original');
  return { verseMap, label: manifest.label, availableTranslations: sortedKeys };
};

/** --- APP COMPONENT --- **/
const BOOK_NAMES = {
  GEN: 'Genesis', EXO: 'Exodus', LEV: 'Leviticus', NUM: 'Numbers', DEU: 'Deuteronomy', PSA: 'Psalms', PRO: 'Proverbs', MAT: 'Matthew', MRK: 'Mark', LUK: 'Luke', JHN: 'John'
};

const BIBLE_BOOK_ORDER = [
  // OT
  "GEN", "EXO", "LEV", "NUM", "DEU", "JOS", "JDG", "RUT", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NEH", "EST", "JOB", "PSA", "PRO", "ECC", "SON", "ISA", "JER", "LAM", "EZK", "DAN", "HOS", "JOE", "AMO", "OBA", "JON", "MIC", "NAH", "HAB", "ZEP", "HAG", "ZEC", "MAL",
  // NT
  "MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"
];

// O(1) Lookups for Sorting
const BIBLE_BOOK_ORDER_MAP = new Map(BIBLE_BOOK_ORDER.map((b, i) => [b, i]));
const NT_BOOKS = new Set(["MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"]);

const PILL_LABELS = ['OT', 'NT', 'PS', 'PR'];

const getSectionIndex = (vid) => {
    if (!vid) return -1;
    const book = vid.split('.')[0];
    if (book === 'PSA') return 2;
    if (book === 'PRO') return 3;
    return NT_BOOKS.has(book) ? 1 : 0;
};

const generateSmartLabel = (verseMap, focalKey) => {
    if (!verseMap) return "";

    const parseVid = (vid) => {
        const parts = vid.split('.');
        return { book: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
    };

    const getEngVid = (vid) => {
        if (!focalKey) return vid;
        const d = verseMap[vid];
        if (d && d[focalKey] && d[focalKey].displayVid) {
            return d[focalKey].displayVid;
        }
        return vid;
    };

    const vids = Object.keys(verseMap).sort((a, b) => {
      const wA = getSectionIndex(a), wB = getSectionIndex(b);
      if (wA !== wB) return wA - wB;
      const bookA = a.split('.')[0], bookB = b.split('.')[0];
      if (bookA !== bookB) {
         return (BIBLE_BOOK_ORDER_MAP.get(bookA) ?? 999) - (BIBLE_BOOK_ORDER_MAP.get(bookB) ?? 999);
      }
      return a.localeCompare(b, undefined, { numeric: true });
    });

    const sections = [[], [], [], []];
    vids.forEach(vid => sections[getSectionIndex(vid)].push(vid));

    const parts = [];
    sections.forEach((grp, idx) => {
        if (grp.length === 0) return;

        const startVid = grp[0];
        const endVid = grp[grp.length - 1];

        // English Range
        const sEngVid = getEngVid(startVid);
        const eEngVid = getEngVid(endVid);
        const sEng = parseVid(sEngVid);
        const eEng = parseVid(eEngVid);

        let engStr = `${sEng.book} ${sEng.chapter}:${sEng.verse}`;
        if (sEngVid !== eEngVid) {
            if (sEng.book === eEng.book) {
                if (sEng.chapter === eEng.chapter) {
                    engStr += `-${eEng.verse}`;
                } else {
                    engStr += `-${eEng.chapter}:${eEng.verse}`;
                }
            } else {
                engStr += ` – ${eEng.book} ${eEng.chapter}:${eEng.verse}`;
            }
        }

        // Original Range
        const sOrig = parseVid(startVid);
        const eOrig = parseVid(endVid);
        let origStr = `${sOrig.book} ${sOrig.chapter}:${sOrig.verse}`;
        if (startVid !== endVid) {
            if (sOrig.book === eOrig.book) {
                 if (sOrig.chapter === eOrig.chapter) {
                    origStr += `-${eOrig.verse}`;
                } else {
                    origStr += `-${eOrig.chapter}:${eOrig.verse}`;
                }
            } else {
                origStr += ` – ${eOrig.book} ${eOrig.chapter}:${eOrig.verse}`;
            }
        }

        if (engStr !== origStr) {
            const suffix = (idx === 1) ? "OG" : "OH";
            // Shorten Orig if matches Eng context
            let shortOrig = origStr;
            // 1. Same Book
            if (sOrig.book === sEng.book && (sEng.book === eEng.book) && (sOrig.book === eOrig.book)) {
                 shortOrig = shortOrig.replace(`${sOrig.book} `, '');
            }
            parts.push(`${engStr} (${shortOrig} ${suffix}*)`);
        } else {
            parts.push(engStr);
        }
    });

    return parts.join(', ');
};

const VerseGroup = React.memo(({ group, verseMap, dynamicSlots, isActive, isDimmed }) => {
    const vid = group[0];
    const book = vid.split('.')[0];
    const isHebrew = !['MAT', 'MRK', 'LUK', 'JHN', 'ACT', 'ROM', '1CO', '2CO', 'GAL', 'EPH', 'PHP', 'COL', '1TH', '2TH', '1TI', '2TI', 'TIT', 'PHM', 'HEB', 'JAS', '1PE', '2PE', '1JN', '2JN', '3JN', 'JUD', 'REV'].includes(book);

    const getSlotContent = (slot) => {
        if (!slot || !slot.source) return { text: '', displayLabel: '' };

        let fullText = '';
        let displayLabel = '';
        const contributing = [];

        group.forEach((gVid) => {
            const data = verseMap[gVid];
            const slotData = data ? data[slot.source] : null;
            if (slotData && slotData.text && slotData.text.length > 0) {
                const sep = (slot.isHebrewGreek) ? ' ' : ' ';
                fullText += (fullText ? sep : '') + slotData.text.join(slot.isHebrewGreek ? '' : ' ');

                contributing.push(slotData.displayVid || gVid);
            }
        });

        if (contributing.length > 0) {
            const first = contributing[0];
            const last = contributing[contributing.length - 1];

            const parse = (v) => {
                 const p = v.split('.');
                 return { b: p[0], c: parseInt(p[1]), v: parseInt(p[2]) };
            };

            const s = parse(first);
            const e = parse(last);
            const bName = BOOK_NAMES[s.b] || s.b;

            if (first === last) {
                displayLabel = `${bName} ${s.c}:${s.v}`;
            } else if (s.b === e.b) {
                 if (s.c === e.c) {
                     displayLabel = `${bName} ${s.c}:${s.v}-${e.v}`;
                 } else {
                     displayLabel = `${bName} ${s.c}:${s.v}-${e.c}:${e.v}`;
                 }
            } else {
                 const eName = BOOK_NAMES[e.b] || e.b;
                 displayLabel = `${bName} ${s.c}:${s.v} - ${eName} ${e.c}:${e.v}`;
            }

        } else if (group.length > 0) {
            const [b, c, v] = group[0].split('.');
            displayLabel = `${BOOK_NAMES[b] || b} ${c}:${v}`;
        }

        return { text: fullText, displayLabel };
    };

    return (
        <div id={`verse-${vid}`} className={`verse-block transition-all duration-700 scroll-mt-12 md:scroll-mt-14 ${isDimmed ? 'opacity-10 grayscale' : 'opacity-100'}`}>
            <div className="flex flex-col gap-1">
            {/* SLOT 1: TOP (Usually Original) */}
            {(() => {
                const slot = dynamicSlots.top;
                const { text, displayLabel } = getSlotContent(slot);
                const label = typeof slot.label === 'function' ? slot.label(isHebrew) : slot.label;

                return (
                    <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-900 border-amber-600 shadow-md' : 'bg-stone-50/50 border-stone-100'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                        <span className={`text-[7px] md:text-[10px] uppercase font-black tracking-widest ${isActive ? 'text-amber-500' : 'text-stone-300'}`}>{label}</span>
                        <span className={`text-[7px] md:text-[10px] font-mono font-bold text-stone-300 ${isActive ? 'text-amber-500' : 'text-stone-300'} uppercase`}>{displayLabel}</span>
                    </div>
                    <div className={`leading-tight tracking-tight break-words ${slot.isHebrewGreek ? (isHebrew ? 'hebrew text-[12px] md:text-xl text-right' : 'greek text-base md:text-lg text-left') : 'text-lg md:text-3xl font-serif italic'}`} style={{ direction: slot.isHebrewGreek && isHebrew ? 'rtl' : 'ltr' }}>
                        <span className={isActive ? 'text-white' : 'text-stone-400'}>{text}</span>
                    </div>
                    </div>
                );
            })()}

            {/* SLOT 2: MIDDLE (Secondary) */}
            {(() => {
                const slot = dynamicSlots.middle;
                const { text, displayLabel } = getSlotContent(slot);

                return (
                <div className={`px-2 py-1 md:px-3 md:py-15 rounded-lg transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-200 shadow-lg border-stone-800 ring-1 ring-stone-800/50' : 'bg-white/40 border-transparent opacity-80'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-300'}`}>{slot.label}</span>
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-300'}`}>{displayLabel}</span></div>
                    <div><span className={`text-lg md:text-3xl font-serif italic leading-tight tracking-tight ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>{text}</span></div>
                </div>
                );
            })()}

            {/* SLOT 3: BOTTOM (Focal) */}
            {(() => {
                const slot = dynamicSlots.bottom;
                const { text, displayLabel } = getSlotContent(slot);

                return (
                <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded-lg transition-all duration-300 border-b-2 ${isActive ? 'bg-amber-100 shadow-xl border-amber-500 ring-1 ring-amber-500/50' : 'bg-white/40 border-transparent opacity-80'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-amber-700' : 'text-stone-300'}`}>
                        {slot.label}
                        {slot.attribution && (
                        <a
                            href={slot.attribution.link}
                            className="inline-block ml-1 transition-transform duration-200 hover:scale-150 active:scale-150 hover:text-amber-600 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded-sm"
                            title={slot.attribution.title}
                        >
                            {slot.attribution.text}
                        </a>
                        )}
                    </span>
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-amber-700' : 'text-stone-300'}`}>{displayLabel}</span></div>
                    <div className={`text-lg md:text-5xl font-serif font-black leading-[1.1] tracking-tight ${isActive ? 'text-black' : 'text-stone-400'}`}>{text}</div>
                </div>
                );
            })()}
            </div>
        </div>
    );
});

const App = () => {
  // Helper to resolve initial state from URL -> LocalStorage -> Today
  const getInitialState = () => {
    // 1. URL Parameter (High Priority)
    const params = new URLSearchParams(window.location.search);
    const urlDate = params.get('startDate');
    if (urlDate && /^\d{4}$/.test(urlDate)) {
        // Try to load extra settings from storage even if URL overrides date
        try {
            const saved = localStorage.getItem('biblical_reading_state');
            if (saved) {
                const state = JSON.parse(saved);
                // If the stored date matches the URL date, we can restore the exact position!
                // If not, we still restore translation preferences.
                return { ...state, date: urlDate, verseId: (state.date === urlDate ? state.verseId : null) };
            }
        } catch (e) {}
        return { date: urlDate };
    }

    // 2. Saved Session
    try {
        const saved = localStorage.getItem('biblical_reading_state');
        if (saved) {
            const state = JSON.parse(saved);
            if (state.date && /^\d{4}$/.test(state.date)) {
                return state;
            }
        }
    } catch (e) {
        console.warn("Failed to load saved state", e);
    }

    // 3. Today (Fallback)
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return { date: `${month}${day}` };
  };

  const initialState = useMemo(() => getInitialState(), []);

  const [verseMap, setVerseMap] = useState(null);
  const [readingLabel, setReadingLabel] = useState("");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [currentDate, setCurrentDate] = useState(initialState.date);
  const [playbackStatus, setPlaybackStatus] = useState('stopped');
  const [activeVerseId, setActiveVerseId] = useState(null); // Visual position (scroll tracking)
  const [playbackVerseId, setPlaybackVerseId] = useState(null); // Where playback is at
  
  // Dynamic State for Translation Slots
  const [availableTranslations, setAvailableTranslations] = useState([]);
  const [focalTranslation, setFocalTranslation] = useState(initialState.focal || null); // Slot 3 (Bottom)
  const [compareTranslation, setCompareTranslation] = useState(initialState.compare || null); // Slot 2 (Middle)

  // Scroll target for restoration
  const [targetScrollVerse, setTargetScrollVerse] = useState(initialState.verseId || null);

  // Persistence
  useEffect(() => {
      if (loading) return; // Don't save state while loading/initializing
      const state = {
          date: currentDate,
          focal: focalTranslation,
          compare: compareTranslation,
          verseId: activeVerseId
      };
      localStorage.setItem('biblical_reading_state', JSON.stringify(state));
  }, [currentDate, focalTranslation, compareTranslation, activeVerseId, loading]);

  // URL Sync
  useEffect(() => {
      const url = new URL(window.location);
      if (url.searchParams.get('startDate') !== currentDate) {
          url.searchParams.set('startDate', currentDate);
          window.history.pushState({}, '', url);
      }
  }, [currentDate]);

  // Scroll Restoration
  useEffect(() => {
      if (!loading && targetScrollVerse && verseMap) {
          const el = document.getElementById(`verse-${targetScrollVerse}`);
          if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              setTargetScrollVerse(null);
          }
      }
  }, [loading, targetScrollVerse, verseMap]);

  // Dropdown States
  const [isCompareOpen, setIsCompareOpen] = useState(false);
  const [isFocalOpen, setIsFocalOpen] = useState(false);

  const synthRef = useRef(window.speechSynthesis);
  const isTransitioningRef = useRef(false);
  const playbackStatusRef = useRef('stopped'); // Track playback status in ref for callbacks

  // Handler for Focal Translation change with auto-swap logic for Compare slot
  const handleFocalChange = (newFocal) => {
    if (newFocal === compareTranslation) {
        // If user picks a focal that matches current compare, we must change compare.
        // Pick the first available key that is NOT the new focal.
        const newCompare = availableTranslations.find(k => k !== newFocal);
        setCompareTranslation(newCompare);
    }
    setFocalTranslation(newFocal);
    setIsFocalOpen(false);
  };

  // Helper to format MMDD into a human date like "Jan 2nd"
  const formatDate = (mmdd) => {
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"];
    const m = parseInt(mmdd.substring(0, 2)) - 1;
    const d = parseInt(mmdd.substring(2, 4));
    const j = d % 10, k = d % 100;
    let suffix = "th";
    if (j == 1 && k != 11) suffix = "st";
    else if (j == 2 && k != 12) suffix = "nd";
    else if (j == 3 && k != 13) suffix = "rd";
    return `${months[m]} ${d}${suffix}`;
  };

  // getSectionIndex moved outside App

  const sortedVids = useMemo(() => {
    if (!verseMap) return [];
    return Object.keys(verseMap).sort((a, b) => {
      // 1. Primary Sort: By Section (OT, NT, Psalms, Proverbs)
      const wA = getSectionIndex(a), wB = getSectionIndex(b);
      if (wA !== wB) return wA - wB;

      // 2. Secondary Sort: By Book Order (Canonical)
      const bookA = a.split('.')[0];
      const bookB = b.split('.')[0];
      if (bookA !== bookB) {
        const idxA = BIBLE_BOOK_ORDER_MAP.get(bookA) ?? 999;
        const idxB = BIBLE_BOOK_ORDER_MAP.get(bookB) ?? 999;
        return idxA - idxB;
      }

      // 3. Tertiary Sort: By Chapter/Verse (Numeric)
      return a.localeCompare(b, undefined, { numeric: true });
    });
  }, [verseMap]);

  const labelParts = useMemo(() => readingLabel.split(',').map(s => s.trim()), [readingLabel]);
  const activeSectionIndex = useMemo(() => getSectionIndex(playbackStatus === 'playing' ? playbackVerseId || sortedVids[0] : activeVerseId || sortedVids[0]), [playbackStatus, playbackVerseId, activeVerseId, sortedVids]);

  // Dynamically generate the slots based on the selected focal/compare translations
  const dynamicSlots = useMemo(() => {
    if (!focalTranslation || !compareTranslation) return { top: TRANSLATION_REGISTRY.original, middle: {}, bottom: {} };

    const focalConfig = TRANSLATION_REGISTRY[focalTranslation];
    const compareConfig = TRANSLATION_REGISTRY[compareTranslation];

    return {
        top: TRANSLATION_REGISTRY.original,
        middle: {
            source: compareTranslation,
            label: compareConfig?.label || compareTranslation.toUpperCase(),
            isHebrewGreek: false
        },
        bottom: {
            source: focalTranslation,
            label: focalConfig?.label || focalTranslation.toUpperCase(),
            isFocal: true,
            isHebrewGreek: false,
            attribution: focalConfig?.attribution
        }
    };
  }, [focalTranslation, compareTranslation]);

  // Grouping Logic to handle versification mismatches (e.g. Psalm Titles)
  const groupedVids = useMemo(() => {
      const groups = [];
      let i = 0;
      
      const hasTranslationContent = (vid) => {
          if (!verseMap || !verseMap[vid]) return false;
          const t1 = dynamicSlots.middle.source;
          const t2 = dynamicSlots.bottom.source;
          // Check if either slot has content
          const hasT1 = t1 && verseMap[vid][t1] && verseMap[vid][t1].text.length > 0;
          const hasT2 = t2 && verseMap[vid][t2] && verseMap[vid][t2].text.length > 0;
          return hasT1 || hasT2;
      };

      while (i < sortedVids.length) {
          const currentVid = sortedVids[i];
          const group = [currentVid];
          
          // Check if we need to merge with next
          // Condition: Current has NO English, Next HAS English, Same Chapter
          // This catches the Psalm Title (Verse 1) vs English (Verse 1 in Verse 2 slot) case
          if (!hasTranslationContent(currentVid) && i + 1 < sortedVids.length) {
              const nextVid = sortedVids[i+1];
              // Ensure same book/chapter to avoid merges across boundaries
              const [b1, c1] = currentVid.split('.');
              const [b2, c2] = nextVid.split('.');
              
              if (b1 === b2 && c1 === c2 && hasTranslationContent(nextVid)) {
                  group.push(nextVid);
                  i++; // Skip next one since we consumed it
              }
          }
          groups.push(group);
          i++;
      }
      return groups;
  }, [sortedVids, dynamicSlots, verseMap]);

  useEffect(() => {
    if (playbackStatus === 'playing' || loading || !verseMap || groupedVids.length === 0) return;
    const observer = new IntersectionObserver((entries) => {
      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        const bestEntry = intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top - 120) - Math.abs(b.boundingClientRect.top - 120))[0];
        setActiveVerseId(bestEntry.target.id.replace('verse-', ''));
      }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
    groupedVids.forEach((group) => {
      const vid = group[0]; // Observe the group container ID
      const el = document.getElementById(`verse-${vid}`);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [playbackStatus, loading, verseMap, groupedVids]);

  useEffect(() => {
    playbackStatusRef.current = playbackStatus;
  }, [playbackStatus]);

  // Update Reading Label when verseMap or focalTranslation changes
  useEffect(() => {
      if (!verseMap) return;
      // Use focalTranslation if available, else first English (if available), else null
      // Note: availableTranslations logic is in local state, but usually matches what was loaded
      const label = generateSmartLabel(verseMap, focalTranslation);
      setReadingLabel(label);
  }, [verseMap, focalTranslation]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.ctrlKey || e.metaKey || e.altKey) return;
      switch(e.key) {
        case 'ArrowLeft': navigateDate(-1); break;
        case 'ArrowRight': navigateDate(1); break;
        case 'k': case 'K': handleToggle(); break;
        case 'Escape':
          if (isCompareOpen || isFocalOpen) { setIsCompareOpen(false); setIsFocalOpen(false); }
          else if (playbackStatus !== 'stopped') { synthRef.current.cancel(); setPlaybackStatus('stopped'); }
          break;
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentDate, playbackStatus, isCompareOpen, isFocalOpen]);

  useEffect(() => {
    let isMounted = true;
    const initDay = async () => {
      setLoading(true);
      setError(null);
      synthRef.current.cancel();
      setPlaybackStatus('stopped');
      setPlaybackVerseId(null);
      setActiveVerseId(null);
      try {
        const data = await loadDailyBread(currentDate);
        if (!isMounted) return;
        setVerseMap(data.verseMap);
        // setReadingLabel(data.label); // REMOVED: Now handled by useEffect
        setAvailableTranslations(data.availableTranslations);

        // Smart Defaults: 
        // 1. Try to keep current selection if valid.
        // 2. Fallback to LSV then KJV if available.
        // 3. Fallback to first available.
        const keys = data.availableTranslations;
        if (keys.length > 0) {
           let newFocal = keys.includes(focalTranslation) ? focalTranslation : (keys.includes('lsv') ? 'lsv' : keys[0]);
           let newCompare = keys.includes(compareTranslation) ? compareTranslation : (keys.includes('kjv') ? 'kjv' : keys.find(k => k !== newFocal) || keys[0]);
           
           // If we only have one translation, ensure both slots aren't empty (though rendering handles this)
           if (newCompare === newFocal && keys.length > 1) {
              newCompare = keys.find(k => k !== newFocal);
           }

           setFocalTranslation(newFocal);
           setCompareTranslation(newCompare);
        }

        setLoading(false);
      } catch (err) {
        console.error("Data loading error:", err);
        if (isMounted) {
            setError(err.message || "Unknown error occurred while loading reading.");
            setLoading(false);
        }
      }
    };
    initDay();
    return () => { isMounted = false; };
  }, [currentDate]);

  const playVerse = (vid, previousVid = null) => {
    if (!verseMap) return;

    // 1. Resolve Group Logic: We always play "Groups"
    // Find the group containing this vid
    const group = groupedVids.find(g => g.includes(vid)) || [vid];
    const leaderVid = group[0];

    // 1. CRITICAL: Stop any current speech
    window.speechSynthesis.cancel();

    setPlaybackVerseId(leaderVid);

    // 2. Prepare SPEECH-only text (Focal Version)
    // Accumulate English text for the whole group
    const focalSlot = dynamicSlots.bottom;
    if (!focalSlot) return;

    let groupText = '';
    group.forEach(gVid => {
        const slotData = verseMap[gVid] ? verseMap[gVid][focalSlot.source] : null;
        if (slotData && slotData.text) {
            groupText += slotData.text.join(' ').trim() + ' ';
        }
    });
    
    const rawText = groupText.trim();
    if (!rawText) {
        // Skip to next GROUP if this group is empty
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], previousVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
        return;
    }

    // Improve pronunciation: 
    const speechText = rawText
        .replace(/YHWH/g, 'Yaw-weigh')
        .replace(/WHO/g, 'Who')
        .replace(/[\[\]]/g, ''); 

    // Scroll to the LEADER vid container
    const el = document.getElementById(`verse-${leaderVid}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const currentIdx = getSectionIndex(leaderVid);
    const prevIdx = previousVid ? getSectionIndex(previousVid) : -1; 
    
    // 3. Voice Selection
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices[0];
    
    // 5. Play LSV Verse with corrected pronunciation
    const mainUtterance = new SpeechSynthesisUtterance(speechText);
    mainUtterance.voice = preferredVoice;
    mainUtterance.rate = 0.9;

    // 6. Move to next GROUP automatically
    mainUtterance.onend = () => {
        if (playbackStatusRef.current !== 'playing') return; 
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], leaderVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
    };

    if (currentIdx !== prevIdx) {
        // Range calc based on Group Leaders to accurately reflect visual start/end
        const sectionGroups = groupedVids.filter(g => getSectionIndex(g[0]) === currentIdx);
        
        // Start: First Group's First Vid
        const startVid = sectionGroups[0][0]; 
        // End: Last Group's *Last* Vid (to get true extent)
        const lastGroup = sectionGroups[sectionGroups.length - 1];
        const endVid = lastGroup[lastGroup.length - 1];

        // For display labels in intro, we want to align with English perception.
        // If Hebrew 19.1 (Title) is merged with 19.2 (Verse 1), English readers see "19:1".
        // The `getSlotContent` logic handles rendering labels, but here we just need rough "Chapter X Verse Y".
        // We'll use the *English Mapped* verse ID if possible for the intro to match user expectation.
        
        const getEnglishVid = (v) => {
             const d = verseMap[v];
             const t = d ? d[focalSlot.source] : null;
             return t?.displayVid || v;
        };

        const [book, ch, verse] = getEnglishVid(startVid).split('.');
        const [endBook, endCh, endVerse] = getEnglishVid(endVid).split('.');
        
        let introText = '';
        if (currentIdx === 0) {
            introText = `Today's reading from the Old Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 1) {
            introText = `Today's reading from the New Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 2) {
            introText = `Today's reading from the Psalms, chapter ${ch} verse ${verse}`;
        } else {
            introText = `Today's reading from the Proverbs, chapter ${ch} verse ${verse}`;
        }
        
        if (startVid !== endVid) { // Compare original IDs for range check
            if (book !== endBook) {
                introText += ` to ${BOOK_NAMES[endBook] || endBook} chapter ${endCh} verse ${endVerse}`;
            } else if (endCh !== ch) {
                introText += ` to chapter ${endCh} verse ${endVerse}`;
            } else {
                introText += ` to verse ${endVerse}`;
            }
        }
      
        const intro = new SpeechSynthesisUtterance(introText);
        intro.voice = preferredVoice; 
        intro.rate = 0.9;
        intro.onend = () => {
            window.speechSynthesis.speak(mainUtterance);
        };
        window.speechSynthesis.speak(intro);
    } else {
        window.speechSynthesis.speak(mainUtterance);
    }
};

  const handleToggle = () => {
    if (playbackStatus === 'playing') { 
      synthRef.current.pause();

      isTransitioningRef.current = false; 
    }
    else if (playbackStatus === 'paused') { 
      setPlaybackStatus('playing');
      isTransitioningRef.current = true;
      // Resume from current highlighted verse (where user scrolled to while paused)
      const resumeVerse = activeVerseId || playbackVerseId || sortedVids[0];
      if (resumeVerse && verseMap[resumeVerse]) {
        playVerse(resumeVerse);
      }
    }
    else { 
      setPlaybackStatus('playing'); 
      isTransitioningRef.current = true; 
      // Start from current visible verse, or first verse if none visible
      const startVerse = activeVerseId || sortedVids[0];
      setPlaybackVerseId(startVerse);
      playVerse(startVerse);
    }
  };

  const navigateDate = (direction) => {
    const month = parseInt(currentDate.substring(0, 2)), day = parseInt(currentDate.substring(2, 4));
    // Use 2025 (non-leap year) to ensure Feb 28 -> Mar 1 transition matches the data generation
    const date = new Date(2025, month - 1, day); date.setDate(date.getDate() + direction);
    const nm = String(date.getMonth() + 1).padStart(2, '0'), nd = String(date.getDate()).padStart(2, '0');
    setCurrentDate(`${nm}${nd}`); window.scrollTo({ top: 0 });
  };

  const scrollToSection = (index) => {
    if (playbackStatus === 'playing' || activeSectionIndex === index) return;
    const targetVid = sortedVids.find(vid => getSectionIndex(vid) === index);
    if (targetVid) {
      const el = document.getElementById(`verse-${targetVid}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center bg-[#fdfcfb]"><div className="text-center"><div className="w-8 h-8 border-2 border-stone-200 border-t-stone-800 rounded-full animate-spin mx-auto mb-4"></div><p className="text-stone-400 font-serif italic text-xs uppercase tracking-widest">Loading God's Word</p></div></div>;

  if (error) return (
      <div className="min-h-screen flex items-center justify-center bg-[#fdfcfb] px-4">
          <div className="max-w-md w-full bg-white border-l-4 border-red-500 shadow-lg rounded-r-lg p-6">
              <h2 className="text-xl font-bold text-stone-800 mb-2 font-serif">Data Integrity Error</h2>
              <p className="text-stone-600 mb-4 text-sm">{error}</p>
              <div className="flex justify-end gap-2">
                  <button onClick={() => window.location.reload()} className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-bold uppercase tracking-wider rounded transition-colors">Reload</button>
                  <button onClick={() => navigateDate(1)} className="px-4 py-2 bg-stone-800 hover:bg-stone-900 text-white text-xs font-bold uppercase tracking-wider rounded transition-colors">Next Day</button>
              </div>
          </div>
      </div>
  );

  return (
    <div className="min-h-screen bg-[#fdfcfb] text-stone-900 pb-12">
      <header className="w-full bg-white/95 border-b border-stone-200 py-1 px-3 sticky top-0 z-50 backdrop-blur-md shadow-sm">
        <div className="max-w-5xl mx-auto flex items-center justify-between gap-3 h-8 md:h-10">
          <div className="flex items-center gap-1 min-w-0 flex-1">
             <div className="flex items-center bg-stone-100 rounded-md px-0.5">
               <button onClick={() => navigateDate(-1)} aria-label="Previous Day" title="Previous Day (Left Arrow)" className="p-1 font-black text-stone-900 hover:text-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={4} d="M15 19l-7-7 7-7" /></svg></button>
               <h1 className="text-[11px] md:text-sm font-black text-stone-900 uppercase px-1 whitespace-nowrap">{formatDate(currentDate)}</h1>
               <button onClick={() => navigateDate(1)} aria-label="Next Day" title="Next Day (Right Arrow)" className="p-1 font-black text-stone-900 hover:text-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 rounded"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={4} d="M9 5l7 7-7 7" /></svg></button>
             </div>
             <div className="flex items-center gap-1 min-w-0 overflow-hidden">
                {labelParts.map((part, i) => {
                  const isActive = activeSectionIndex === i;
                  const isClickable = !isActive && playbackStatus !== 'playing';
                  const sectionNames = ['Old Testament', 'New Testament', 'Psalms', 'Proverbs'];

                  return (
                    <button
                        key={i}
                        type="button"
                        onClick={() => scrollToSection(i)}
                        title={isClickable ? `Jump to ${sectionNames[i]}` : ''}
                        aria-label={isActive ? `Current section: ${sectionNames[i]}` : `Jump to ${sectionNames[i]}`}
                        aria-current={isActive ? 'step' : undefined}
                        aria-disabled={!isClickable && !isActive}
                        className={`transition-all duration-500 flex items-center shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 ${isActive
                            ? 'bg-amber-600 px-2 py-0.5 rounded-full shadow-sm cursor-default'
                            : isClickable
                                ? 'px-1.5 py-0.5 rounded hover:bg-stone-200 cursor-pointer text-stone-300 hover:text-stone-600'
                                : 'px-1.5 py-0.5 rounded cursor-default text-stone-300 opacity-50'
                        }`}
                    >
                        {isActive
                            ? <span className="text-[10px] md:text-xs font-bold text-white whitespace-nowrap">{part}</span>
                            : <span className="text-[9px] font-black uppercase tracking-tighter">{PILL_LABELS[i]}</span>
                        }
                    </button>
                  );
                })}
             </div>
          </div>
             <div className="flex items-center gap-2 shrink-0">
             {/* Slot 2 Selector (Middle) */}
             {/* Only show selector if there are enough options to actually make a choice (i.e. > 2 options total, because 1 is focal) */}
             {availableTranslations.length > 2 ? (
              <div className="relative">
                <button onClick={() => { setIsCompareOpen(!isCompareOpen); setIsFocalOpen(false); }} aria-haspopup="true" aria-expanded={isCompareOpen} aria-label="Select Comparison Translation" className="flex items-center gap-1 text-[9px] md:text-[10px] font-bold uppercase text-stone-300 hover:text-stone-500 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500 rounded" title="Select Translation for Middle Slot">
                  CMP: {compareTranslation ? compareTranslation.toUpperCase() : '-'}
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                </button>
                {isCompareOpen && (
                  <>
                    <div className="fixed inset-0 z-40" onClick={() => setIsCompareOpen(false)}></div>
                    <div className="absolute right-0 top-full mt-1 w-24 bg-white border border-stone-200 shadow-lg rounded-md overflow-hidden z-50">
                      {availableTranslations.filter(k => k !== focalTranslation).map(key => (

                      ))}
                    </div>
                  </>

              </div>
             ) : (
                /* Static Label if only 2 options exist (since the other MUST be the compare version) */
                availableTranslations.length > 1 && (
                  <span className="text-[9px] md:text-[10px] font-bold uppercase text-stone-300 cursor-default" title="Middle Slot (Fixed)">
                    CMP: {compareTranslation ? compareTranslation.toUpperCase() : '-'}
                  </span>

             )}

             {/* Slot 3 Selector (Focal) */}
             {availableTranslations.length > 0 && (
              <div className="relative mr-1">

                  {focalTranslation ? focalTranslation.toUpperCase() : '-'}
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                </button>
                {isFocalOpen && (
                  <>
                    <div className="fixed inset-0 z-40" onClick={() => setIsFocalOpen(false)}></div>
                    <div className="absolute right-0 top-full mt-1 w-24 bg-white border border-stone-200 shadow-lg rounded-md overflow-hidden z-50">
                      {availableTranslations.map(key => (
                        <button key={key} onClick={() => handleFocalChange(key)} className={`block w-full text-left px-3 py-2 text-[10px] font-bold uppercase hover:bg-stone-100 focus:outline-none focus:bg-stone-100 ${focalTranslation === key ? 'text-amber-600' : 'text-stone-600'}`}>{key}</button>
                      ))}
                    </div>
                  </>
                )}
              </div>
             )}

             {playbackStatus !== 'stopped' && <button onClick={() => { synthRef.current.cancel(); setPlaybackStatus('stopped'); }} aria-label="Stop Playback" title="Stop Playback (Escape)" className="p-1.5 text-stone-300 hover:text-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 rounded"><svg xmlns="http://www.w3.org/2000/svg" className="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" /></svg></button>}
             <button onClick={handleToggle} title="Toggle Playback (k)" className={`px-3 md:px-5 py-1 rounded-full font-black text-[12px] md:text-[12px] uppercase tracking-tighter transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500 focus-visible:ring-offset-2 ${playbackStatus === 'playing' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-600'}`}>{playbackStatus === 'playing' ? 'Pause' : playbackStatus === 'paused' ? 'Resume' : 'Listen'}</button>
          </div>
        </div>

        {error ? (
          <div className="flex flex-col items-center justify-center py-12 px-4 text-center animate-in fade-in zoom-in duration-300">
            <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4 ring-1 ring-red-100">
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 className="text-lg font-serif font-bold text-stone-800 mb-2">Reading Unavailable</h3>
            <p className="text-stone-500 text-sm mb-6 max-w-xs mx-auto leading-relaxed">
                We couldn't load the reading for <span className="font-semibold text-stone-700">{formatDate(currentDate)}</span>.
                It might be missing or you may be offline.
            </p>
            <button
                onClick={() => window.location.reload()}
                className="inline-flex items-center gap-2 px-4 py-2 bg-white border border-stone-200 rounded-md text-xs font-bold uppercase tracking-wider text-stone-600 hover:bg-stone-50 hover:text-stone-900 hover:border-stone-300 transition-all focus:outline-none focus:ring-2 focus:ring-stone-400 focus:ring-offset-1 shadow-sm"
            >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Retry Connection
            </button>
          </div>
        ) : groupedVids.map(group => {
            const vid = group[0];
            const isPlaying = playbackStatus === 'playing';
            const isCurrentGroup = isPlaying ? group.includes(playbackVerseId) : false;
            const isActive = isPlaying ? isCurrentGroup : group.includes(activeVerseId);
            const isDimmed = isPlaying && !isCurrentGroup;

            return (
                <VerseGroup
                    key={vid}
                    group={group}
                    verseMap={verseMap}
                    dynamicSlots={dynamicSlots}
                    isActive={isActive}
                    isDimmed={isDimmed}
                />
            );
        })}
        
      </main>
      <footer id="footer" className="w-full bg-stone-100 border-t border-stone-200 mt-2 py-2 px-1">
        
        <div className="max-w-4xl mx-auto text-[8px] md:text-[8px] text-stone-500 leading-relaxed text-center font-serif">
          <span className="font-serif italic block mb-1 tracking-widest text-stone-400 max-w-xl mx-auto">{readingLabel}</span>
          <p className="mb-2 text-[7px] text-stone-400">
            <span id="orig-note">* OH = Original Hebrew / OG = Original Greek versification.</span>
          </p>
