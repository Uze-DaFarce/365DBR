    <script type="text/tsx">
import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';

/** --- CONFIGURATION --- **/
const TRANSLATION_REGISTRY = {
  // Original Language (Always present as 'content')
  original: {
    source: 'original', // Explicit source key for data lookup
    label: (isHebrew) => `ORIGINAL ${isHebrew ? 'HEBREW' : 'GREEK'}`,
    isHebrewGreek: true
  },
  // English Parallels (Detected by bibleId)
  kjv: {
    idPrefix: 'de4e12af',
    label: 'KJV - King James Version'
  },
  lsv: {
    idPrefix: '06125ada', // Covers 06125adad2d5898a-01
    altIds: ['01b29f4b342acc35-01'],
    label: 'LSV - Literal Standard Version',
    attribution: {
      text: '©',
      link: '#footer',
      title: 'View Copyright Information'
    }
  },
  web: {
    idPrefix: '9879dbb7',
    label: 'WEB - World English Bible'
  },
  nlt: {
    idPrefix: 'd6e14a62',
    label: 'NLT - New Living Translation',
    attribution: {
        text: '©',
        link: '#footer', // Placeholder, would need update if NLT specific footer requirement
        title: 'View Copyright Information'
    }
  }
};

/** --- DATA UTILITIES --- **/
// Recursive walker with active verse context to safely handle nested structures and orphans
const walkItems = (items, map, versionKey, useOrgId, buffer, context) => {
  if (!items) return;
  for (const item of items) {
    let previousActiveVid = context.activeVid; // Store stack for backtracking

    // 1. Enter Verse Scope?
    if (item.attrs?.verseId) {
      let keyVid = item.attrs.verseId;
      // If parallels have explicit mapping to original verse (verseOrgIds), use it.
      if (useOrgId && item.attrs.verseOrgIds && item.attrs.verseOrgIds.length > 0) {
        keyVid = item.attrs.verseOrgIds[0];
      }
      context.activeVid = keyVid;
      context.lastSeenVid = keyVid; // Track linear progression across hierarchy

      if (!map[keyVid]) map[keyVid] = {};
      if (!map[keyVid][versionKey]) {
         map[keyVid][versionKey] = {
            text: [],
            displayVid: item.attrs.verseId // Store the native ID for display (e.g. LEV.6.1)
         };
      }
      
      // Flush buffer if exists (orphaned content found BEFORE this verse belongs here, e.g. Titles)
      if (buffer && buffer.text.length > 0) {
         map[keyVid][versionKey].text.push(...buffer.text);
         buffer.text = []; // Clear buffer
      }
    }

    // 2. Process Text Content
    if (item.type === 'text' && item.text) {
        if (context.activeVid) {
            // Case A: Inside a verse container. Safe add.
            if (map[context.activeVid] && map[context.activeVid][versionKey]) {
                map[context.activeVid][versionKey].text.push(item.text);
            }
        } else {
            // Case B: Orphaned Text (No active container)
            if (item.text.trim().length > 0) {
                if (context.lastSeenVid) {
                    // Sub-case B1: We have seen a verse before. This orphan likely belongs to it (e.g. formatting sibling).
                    // Append to PREVIOUS/LAST SEEN verse.
                    if (map[context.lastSeenVid] && map[context.lastSeenVid][versionKey]) {
                        map[context.lastSeenVid][versionKey].text.push(item.text);
                    }
                } else {
                    // Sub-case B2: No verse seen yet (Start of file). This is likely a Title.
                    // Buffer it for the NEXT verse.
                    if (buffer) {
                        buffer.text.push(item.text);
                    }
                }
            }
        }
    }
    
    // 3. Recurse
    if (item.items && item.items.length > 0) {
        walkItems(item.items, map, versionKey, useOrgId, buffer, context);
    }

    // 4. Exit Scope
    context.activeVid = previousActiveVid;
  }
};

const processContent = (contentArray, map, versionKey, useOrgId = false) => {
  if (!contentArray) return;
  // Buffer context for this processing pass
  const buffer = { text: [] }; 
  // Context MUST be shared across the entire section to track lastSeenVid linearly
  const context = { activeVid: null, lastSeenVid: null };
  for (const section of contentArray) {
      if (section.items) walkItems(section.items, map, versionKey, useOrgId, buffer, context); 
  }
};

const loadDailyBread = async (dateFolder) => {
  const manifestPath = `data/${dateFolder}/manifest.json`;
  const manifestRes = await fetch(manifestPath);
  if (!manifestRes.ok) throw new Error(`Manifest for folder ${dateFolder} not found.`);
  const manifest = await manifestRes.json();
  const verseMap = {};
  const availableKeys = new Set(['original']); // Track what we found

  const results = await Promise.all(
    manifest.files.map(async fileName => {
        const res = await fetch(`data/${dateFolder}/${fileName}`);
        if (!res.ok) throw new Error(`Failed to load ${fileName} (Status: ${res.status})`);
        const json = await res.json();
        // Integrity Check: Must have data.content OR data.parallels
        // Our API response wrapper usually has { data: { content: ... } } or { data: { parallels: ... } }
        // But api.bible returns { data: { content: ... } }
        // Let's check for 'data' property
        if (!json || !json.data) {
             throw new Error(`Invalid data structure in ${fileName}`);
        }
        return json;
    })
  );

  results.forEach((source) => {
    const data = source.data;
    if (!data) return;

    // 1. Process Original Content (if present)
    if (data.content) {
      processContent(data.content, verseMap, 'original', false);
    }

    // 2. Process Parallels (Dynamic Discovery)
    if (data.parallels) {
      data.parallels.forEach(parallel => {
         // Find which registry key matches this parallel's bibleId
         const matchedKey = Object.keys(TRANSLATION_REGISTRY).find(key => {
            const config = TRANSLATION_REGISTRY[key];
            if (!config.idPrefix) return false; // Skip 'original'
            if (parallel.bibleId.includes(config.idPrefix)) return true;
            if (config.altIds && config.altIds.some(id => parallel.bibleId === id)) return true;
            return false;
         });

         if (matchedKey && parallel.content) {
            processContent(parallel.content, verseMap, matchedKey, true);
            availableKeys.add(matchedKey);
         }
      });
    }
  });
  
  // Sort keys to ensure consistent order (e.g. KJV, LSV, etc.)
  const sortedKeys = Array.from(availableKeys).filter(k => k !== 'original');

  // ⚡ Bolt Optimization: Flatten text arrays into single strings to reduce memory and render cost.
  // WARNING: If this logic changes (e.g., reverting to arrays), ensure `playVerse` is updated to handle the new format.
  Object.values(verseMap).forEach(verseData => {
      Object.keys(verseData).forEach(key => {
          const entry = verseData[key];
          if (entry.text && Array.isArray(entry.text)) {
              const config = TRANSLATION_REGISTRY[key];
              const separator = config && config.isHebrewGreek ? '' : ' ';
              entry.text = entry.text.join(separator);
          }
      });
  });

  return { verseMap, label: manifest.label, availableTranslations: sortedKeys };
};

/** --- APP COMPONENT --- **/
const BOOK_NAMES = {
  GEN: 'Genesis', EXO: 'Exodus', LEV: 'Leviticus', NUM: 'Numbers', DEU: 'Deuteronomy', PSA: 'Psalms', PRO: 'Proverbs', MAT: 'Matthew', MRK: 'Mark', LUK: 'Luke', JHN: 'John'
};

const BIBLE_BOOK_ORDER = [
  // OT
  "GEN", "EXO", "LEV", "NUM", "DEU", "JOS", "JDG", "RUT", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NEH", "EST", "JOB", "PSA", "PRO", "ECC", "SON", "ISA", "JER", "LAM", "EZK", "DAN", "HOS", "JOE", "AMO", "OBA", "JON", "MIC", "NAH", "HAB", "ZEP", "HAG", "ZEC", "MAL",
  // NT
  "MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"
];

// O(1) Lookups for Sorting
const BIBLE_BOOK_ORDER_MAP = new Map(BIBLE_BOOK_ORDER.map((b, i) => [b, i]));
const NT_BOOKS = new Set(["MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"]);

const PILL_LABELS = ['OT', 'NT', 'PS', 'PR'];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"];

const getSectionIndex = (vid) => {
    if (!vid) return -1;
    const book = vid.substring(0, 3);
    if (book === 'PSA') return 2;
    if (book === 'PRO') return 3;
    return NT_BOOKS.has(book) ? 1 : 0;
};

// ⚡ Bolt Optimization: Optimized VID parser to avoid array allocation from split()
const parseVid = (vid) => {
    const dot1 = vid.indexOf('.');
    const dot2 = vid.indexOf('.', dot1 + 1);

    // Fallback for malformed VIDs (though unlikely given strict data)
    if (dot1 === -1 || dot2 === -1) {
        const parts = vid.split('.');
        return { book: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
    }

    return {
        book: vid.substring(0, dot1),
        chapter: parseInt(vid.substring(dot1 + 1, dot2)),
        verse: parseInt(vid.substring(dot2 + 1))
    };
};

const generateSmartLabel = (verseMap, sortedVids, focalKey) => {
    if (!verseMap) return "";

    const getEngVid = (vid) => {
        if (!focalKey) return vid;
        const d = verseMap[vid];
        if (d && d[focalKey] && d[focalKey].displayVid) {
            return d[focalKey].displayVid;
        }
        return vid;
    };

    const vids = sortedVids || [];

    const sections = [[], [], [], []];
    vids.forEach(vid => sections[getSectionIndex(vid)].push(vid));

    const parts = [];
    sections.forEach((grp, idx) => {
        if (grp.length === 0) return;

        const startVid = grp[0];
        const endVid = grp[grp.length - 1];

        // English Range
        const sEngVid = getEngVid(startVid);
        const eEngVid = getEngVid(endVid);
        const sEng = parseVid(sEngVid);
        const eEng = parseVid(eEngVid);

        let engStr = `${sEng.book} ${sEng.chapter}:${sEng.verse}`;
        if (sEngVid !== eEngVid) {
            if (sEng.book === eEng.book) {
                if (sEng.chapter === eEng.chapter) {
                    engStr += `-${eEng.verse}`;
                } else {
                    engStr += `-${eEng.chapter}:${eEng.verse}`;
                }
            } else {
                engStr += ` – ${eEng.book} ${eEng.chapter}:${eEng.verse}`;
            }
        }

        // Original Range
        const sOrig = parseVid(startVid);
        const eOrig = parseVid(endVid);
        let origStr = `${sOrig.book} ${sOrig.chapter}:${sOrig.verse}`;
        if (startVid !== endVid) {
            if (sOrig.book === eOrig.book) {
                 if (sOrig.chapter === eOrig.chapter) {
                    origStr += `-${eOrig.verse}`;
                } else {
                    origStr += `-${eOrig.chapter}:${eOrig.verse}`;
                }
            } else {
                origStr += ` – ${eOrig.book} ${eOrig.chapter}:${eOrig.verse}`;
            }
        }

        if (engStr !== origStr) {
            const suffix = (idx === 1) ? "OG" : "OH";
            // Shorten Orig if matches Eng context
            let shortOrig = origStr;
            // 1. Same Book
            if (sOrig.book === sEng.book && (sEng.book === eEng.book) && (sOrig.book === eOrig.book)) {
                 shortOrig = shortOrig.replace(`${sOrig.book} `, '');
            }
            parts.push(`${engStr} (${shortOrig} ${suffix}*)`);
        } else {
            parts.push(engStr);
        }
    });

    return parts.join(', ');
};

const CopyButton = ({ text, reference, version, ...props }) => {
    const [status, setStatus] = useState('idle');

    useEffect(() => {
        setStatus('idle');
    }, [text, reference]);

    const handleCopy = async (e) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        try {
            setStatus('copying');
            const content = `${text}\n— ${reference} (${version})`;
            await navigator.clipboard.writeText(content);
            setStatus('copied');
            setTimeout(() => setStatus('idle'), 2000);
        } catch (err) {
            console.error("Failed to copy", err);
            setStatus('idle');
        }
    };

    return (
        <button
            {...props}
            onClick={handleCopy}
            type="button"
            className="ml-2 p-1 rounded hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 print:hidden"
            aria-label={status === 'copied' ? "Copied" : "Copy verse"}
            title={status === 'copied' ? "Copied!" : `Copy ${version}`}
        >
            {status === 'copied' ? (
                 <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 text-green-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                </svg>
            ) : (
                <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 text-stone-400 hover:text-stone-900 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
            )}
        </button>
    );
};

const VerseGroup = React.memo(({ group, verseMap, dynamicSlots, isActive, isDimmed, isPlaying }) => {
    const vid = group[0];
    const book = vid.substring(0, 3);
    const sectionIndex = getSectionIndex(vid);
    const focalTheme = FOCAL_THEMES[sectionIndex] || FOCAL_THEMES[0];

    // ⚡ Bolt Optimization: Use O(1) Set lookup instead of O(N) array includes + allocation
    const isHebrew = !NT_BOOKS.has(book);

    const handleVerseClick = (e) => {
        if (isPlaying) return;

        // Prevent scroll if selecting text
        const selection = window.getSelection();
        if (selection && selection.type === 'Range' && selection.toString().length > 0) return;

        const el = document.getElementById(`verse-${vid}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    // ⚡ Bolt Optimization: Memoize content generation to prevent expensive string operations
    // on every render (e.g. during scroll/highlight transitions).
    // The content only changes if translations or data change, not when 'isActive' toggles.
    const renderedSlots = useMemo(() => {
        const getSlotContent = (slot) => {
            if (!slot || !slot.source) return { text: '', displayLabel: '' };

            let fullText = '';
            let displayLabel = '';
            const contributing = [];

            group.forEach((gVid) => {
                const data = verseMap[gVid];
                const slotData = data ? data[slot.source] : null;
                if (slotData && slotData.text) {
                    // ⚡ Bolt Optimization: Text is now pre-joined in loadDailyBread
                    fullText += (fullText ? ' ' : '') + slotData.text;

                    contributing.push(slotData.displayVid || gVid);
                }
            });

            if (contributing.length > 0) {
                const first = contributing[0];
                const last = contributing[contributing.length - 1];

                const s = parseVid(first);
                const e = parseVid(last);
                const bName = BOOK_NAMES[s.book] || s.book;

                if (first === last) {
                    displayLabel = `${bName} ${s.chapter}:${s.verse}`;
                } else if (s.book === e.book) {
                    if (s.chapter === e.chapter) {
                        displayLabel = `${bName} ${s.chapter}:${s.verse}-${e.verse}`;
                    } else {
                        displayLabel = `${bName} ${s.chapter}:${s.verse}-${e.chapter}:${e.verse}`;
                    }
                } else {
                    const eName = BOOK_NAMES[e.book] || e.book;
                    displayLabel = `${bName} ${s.chapter}:${s.verse} - ${eName} ${e.chapter}:${e.verse}`;
                }

            } else if (group.length > 0) {
                const [b, c, v] = group[0].split('.');
                displayLabel = `${BOOK_NAMES[b] || b} ${c}:${v}`;
            }

            return { text: fullText, displayLabel };
        };

        const getLabel = (slot) => typeof slot.label === 'function' ? slot.label(isHebrew) : slot.label;

        return {
            top: { ...getSlotContent(dynamicSlots.top), label: getLabel(dynamicSlots.top), config: dynamicSlots.top },
            middle: { ...getSlotContent(dynamicSlots.middle), label: getLabel(dynamicSlots.middle), config: dynamicSlots.middle },
            bottom: { ...getSlotContent(dynamicSlots.bottom), label: getLabel(dynamicSlots.bottom), config: dynamicSlots.bottom, attribution: dynamicSlots.bottom.attribution }
        };
    }, [group, verseMap, dynamicSlots, isHebrew]);

    return (
        <div id={`verse-${vid}`} onClick={handleVerseClick} className={`verse-block group transition-all duration-700 scroll-mt-12 md:scroll-mt-14 ${isDimmed ? 'opacity-10 grayscale' : 'opacity-100'} ${!isPlaying ? 'cursor-pointer' : ''}`}>
            <div className="flex flex-col gap-1">
            {/* SLOT 1: TOP (Usually Original) */}
            {(() => {
                const { text, displayLabel, label, config } = renderedSlots.top;
                return (
                    <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-900 border-amber-600 shadow-md' : 'bg-stone-50/50 border-stone-100'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                        <span className={`text-[7px] md:text-[10px] uppercase font-black tracking-widest ${isActive ? 'text-amber-500' : 'text-stone-400'}`}>{label}</span>
                        <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-mono font-bold ${isActive ? 'text-amber-500' : 'text-stone-400'} uppercase`}>
                             <span>{displayLabel}</span>
                             {!isPlaying && (
                                <CopyButton
                                    text={text}
                                    reference={displayLabel}
                                    version={isHebrew ? 'OH' : 'OG'}
                                    tabIndex={isActive ? 0 : -1}
                                    aria-hidden={!isActive}
                                />
                             )}
                        </div>
                    </div>
                    <div className={`leading-tight tracking-tight break-words ${config.isHebrewGreek ? (isHebrew ? 'hebrew text-[12px] md:text-xl text-right' : 'greek text-base md:text-lg text-left') : 'text-lg md:text-3xl font-serif italic'}`} style={{ direction: config.isHebrewGreek && isHebrew ? 'rtl' : 'ltr' }}>
                        <span className={isActive ? 'text-white' : 'text-stone-500'}>{text}</span>
                    </div>
                    </div>
                );
            })()}

            {/* SLOT 2: MIDDLE (Secondary) */}
            {(() => {
                const { text, displayLabel, label } = renderedSlots.middle;
                return (
                <div className={`px-2 py-1 md:px-3 md:py-15 rounded-lg transition-all duration-300 border-b-2 ${isActive ? 'bg-stone-200 shadow-lg border-stone-800 ring-1 ring-stone-800/50' : 'bg-white/40 border-transparent opacity-80'}`}>
                    <div className="flex justify-between items-center mb-0.5">
                    <span className={`text-[7px] md:text-[10px] font-black uppercase mb-0.5 block ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>{label}</span>
                    <div className={`flex items-center gap-1 text-[7px] md:text-[10px] font-black uppercase mb-0.5 ${isActive ? 'text-stone-900' : 'text-stone-400'}`}>
                        <span>{displayLabel}</span>
                        {!isPlaying && dynamicSlots.middle.source && (
                            <CopyButton
                                text={text}
                                reference={displayLabel}
                                version={dynamicSlots.middle.source.toUpperCase()}
                                tabIndex={isActive ? 0 : -1}
                                aria-hidden={!isActive}
                            />
                        )}
                    </div>
                    </div>

// Helper to format MMDD into a human date like "Jan 2nd"
const formatDate = (mmdd) => {
  const m = parseInt(mmdd.substring(0, 2)) - 1;
  const d = parseInt(mmdd.substring(2, 4));
  const j = d % 10, k = d % 100;
  let suffix = "th";
  if (j == 1 && k != 11) suffix = "st";
  else if (j == 2 && k != 12) suffix = "nd";
  else if (j == 3 && k != 13) suffix = "rd";
  return `${MONTHS[m]} ${d}${suffix}`;
};

const ReadingProgress = React.memo(({ sectionIndex }) => {
  const barRef = useRef(null);
  // Default to OT theme if sectionIndex is invalid or initial
  const theme = SECTION_THEMES[sectionIndex] || SECTION_THEMES[0];

  useEffect(() => {
    let ticking = false;
    const updateWidth = () => {
       if (barRef.current) {
          const scrollHeight = document.body.scrollHeight - window.innerHeight;
          if (scrollHeight > 0) {
            const scrolled = (window.scrollY / scrollHeight) * 100;
            const val = Math.min(100, Math.max(0, scrolled));
            barRef.current.style.width = `${val}%`;
            barRef.current.setAttribute('aria-valuenow', Math.round(val));
          }
       }
       ticking = false;
    };

    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(updateWidth);
        ticking = true;
      }
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    updateWidth(); // Initial check
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  return (
    <div className="absolute bottom-0 left-0 right-0 h-[3px] bg-transparent pointer-events-none z-50 print:hidden flex justify-center">
      <div className="w-full max-w-7xl h-full relative">
        <div
            ref={barRef}
            className={`h-full w-0 transition-all duration-300 ease-out shadow-lg ${theme.bg} ${theme.shadow}`}
            role="progressbar"
            aria-valuemin={0}
            aria-valuemax={100}
            aria-valuenow={0}
            aria-label={`Reading Progress (Current Section: ${['Old Testament', 'New Testament', 'Psalms', 'Proverbs'][sectionIndex] || 'Unknown'})`}

  );
});

const ScrollToTop = () => {
  const [show, setShow] = useState(false);

  useEffect(() => {
    let ticking = false;
    const handleScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
            setShow(window.scrollY > 400);
            ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <button
      onClick={scrollToTop}
      aria-label="Scroll to top"
      title="Scroll to top"
      className={`fixed bottom-20 right-4 z-40 p-2 rounded-full bg-stone-900/80 text-white shadow-xl transition-all duration-300 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 print:hidden ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
    >
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  );
};

const App = () => {
  // Helper to resolve initial state from URL -> LocalStorage -> Today
  const getInitialState = () => {
    // 1. URL Parameter (High Priority)
    const params = new URLSearchParams(window.location.search);
    const urlDate = params.get('startDate');
    if (urlDate && /^\d{4}$/.test(urlDate)) {
        // Try to load extra settings from storage even if URL overrides date
        try {
            const saved = localStorage.getItem('biblical_reading_state');
            if (saved) {
                const state = JSON.parse(saved);
                // If the stored date matches the URL date, we can restore the exact position!
                // If not, we still restore translation preferences.
                return { ...state, date: urlDate, verseId: (state.date === urlDate ? state.verseId : null) };
            }
        } catch (e) {}
        return { date: urlDate };
    }

    // 2. Saved Session
    try {
        const saved = localStorage.getItem('biblical_reading_state');
        if (saved) {
            const state = JSON.parse(saved);
            if (state.date && /^\d{4}$/.test(state.date)) {
                return state;
            }
        }
    } catch (e) {
        console.warn("Failed to load saved state", e);
    }

    // 3. Today (Fallback)
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return { date: `${month}${day}` };
  };

  const initialState = useMemo(() => getInitialState(), []);

  const todayString = useMemo(() => {
    const now = new Date();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${m}${d}`;
  }, []);

  const [verseMap, setVerseMap] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [currentDate, setCurrentDate] = useState(initialState.date);

  // ⚡ Bolt Optimization: Memoize formatted date string to avoid parsing/formatting on every render frame
  const formattedDate = useMemo(() => formatDate(currentDate), [currentDate]);
  const [playbackStatus, setPlaybackStatus] = useState('stopped');
  const [activeVerseId, setActiveVerseId] = useState(initialState.verseId || null); // Visual position (scroll tracking)
  const activeVerseIdRef = useRef(activeVerseId);
  useEffect(() => { activeVerseIdRef.current = activeVerseId; }, [activeVerseId]);

  const [playbackVerseId, setPlaybackVerseId] = useState(null); // Where playback is at
  const playbackVerseIdRef = useRef(playbackVerseId);
  useEffect(() => { playbackVerseIdRef.current = playbackVerseId; }, [playbackVerseId]);
  
  // Dynamic State for Translation Slots
  const [availableTranslations, setAvailableTranslations] = useState([]);
  const [focalTranslation, setFocalTranslation] = useState(initialState.focal || null); // Slot 3 (Bottom)
  const [compareTranslation, setCompareTranslation] = useState(initialState.compare || null); // Slot 2 (Middle)

  // Scroll target for restoration
  const [targetScrollVerse, setTargetScrollVerse] = useState(initialState.verseId || null);

  // Persistence with Smart Debounce
  // ⚡ Bolt Optimization: Debounce scroll updates (activeVerseId) to prevent blocking main thread with synchronous localStorage writes.
  // Immediate saves are still performed for critical user actions (Date/Translation changes).
  const prevDate = useRef(currentDate);
  const prevFocal = useRef(focalTranslation);
  const prevCompare = useRef(compareTranslation);

  useEffect(() => {
      if (loading) return;

      const isCriticalChange = (
          currentDate !== prevDate.current ||
          focalTranslation !== prevFocal.current ||
          compareTranslation !== prevCompare.current
      );

      const save = () => {
          // Smart Bookmark: Only save progress if reading today or in the past.
          // This prevents "looking ahead" (e.g., previewing tomorrow) from overwriting your actual spot.
          // Translation preferences (focal/compare) are always saved.
          const today = new Date();
          // Reset time to ensure we compare just dates
          today.setHours(0, 0, 0, 0);

          const currentMonth = parseInt(currentDate.substring(0, 2)) - 1;
          const currentDay = parseInt(currentDate.substring(2, 4));
          // Use current year (or next year if Jan is viewed in Dec context, though simplistic 2025 logic used elsewhere)
          // Consistent with navigateDate logic: use 2025.
          const viewDate = new Date(2025, currentMonth, currentDay);

          // Allow saving if viewDate is <= Today (ignoring year for recurring reading plan logic safety?
          // Actually, let's just use MMDD string comparison for simplicity and robustness since years rotate)
          const todayMMDD = String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');

          // Simple string comparison works for MMDD (e.g. "0101" < "1231")
          // Logic: Save verseId ONLY if currentDate <= todayString (calculated in App)
          const isFuture = currentDate > todayString;

          const state = {
              date: currentDate,
              focal: focalTranslation,
              compare: compareTranslation,
              // If viewing future, preserve the LAST SAVED verseId (from initial load or previous save)
              // rather than overwriting it with the future date's scroll position.
              // However, we only have 'activeVerseId' or 'targetScrollVerse' here.
              // We need to know what the *persisted* verseId was if we want to "not save" the new one.
              // Actually, simply NOT updating the 'verseId' field in the new state object would delete it if we overwrite.
              // So we should read the OLD state to preserve it?
              // No, simpler: If future, just save the preferences, BUT keep the date synced?
              // User requirement: "If they look ahead... they will have to remember where they were."
              // Wait, the user said: "I am trying to keep track of where they are in their reading, not in their looking ahead."
              // This implies we should NOT update the 'date' and 'verseId' in localStorage if they are just peeking.
              // BUT, if we don't save 'date', when they reload, they will be back at the old date.
              // This might be what they want? "Smart Bookmark" usually implies "save my place in the book", not "save which page I'm looking at right now".

              // Let's interpret "Smart Bookmark" strictly:
              // 1. Always save TRANSLATION preferences (focal/compare).
              // 2. If Date <= Today: Save Date + VerseID.
              // 3. If Date > Today: Do NOT save Date + VerseID (keep the old ones in localStorage).

              // Implementation: Read existing state to merge? Or just conditional update?
              // LocalStorage is a key-value store. We overwrite the whole JSON.
          };

          // We need to fetch the PREVIOUSLY SAVED state to preserve it if we are "looking ahead".
          let previousState = {};
          try {
              previousState = JSON.parse(localStorage.getItem('biblical_reading_state') || '{}');
          } catch (e) {}

          const newState = {
              ...previousState, // Keep old date/verse if we don't overwrite them
              focal: focalTranslation,
              compare: compareTranslation
          };

          if (!isFuture) {
              // We are in the past/present -> Update Reading Progress
              newState.date = currentDate;
              newState.verseId = activeVerseId || targetScrollVerse;
          }

          localStorage.setItem('biblical_reading_state', JSON.stringify(newState));

          // Update refs to current state
          prevDate.current = currentDate;
          prevFocal.current = focalTranslation;
          prevCompare.current = compareTranslation;
      };

      if (isCriticalChange) {
          save();
      } else {
          // Debounce scroll updates
          const handler = setTimeout(save, 500);
          return () => clearTimeout(handler);
      }
  }, [currentDate, focalTranslation, compareTranslation, activeVerseId, loading]);

  // URL Sync
  useEffect(() => {
      const url = new URL(window.location);
      if (url.searchParams.get('startDate') !== currentDate) {
          url.searchParams.set('startDate', currentDate);
          window.history.pushState({}, '', url);
      }
  }, [currentDate]);

  // Scroll Restoration
  useEffect(() => {
      if (!loading && targetScrollVerse && verseMap) {
          const el = document.getElementById(`verse-${targetScrollVerse}`);
          if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              setTargetScrollVerse(null);
          }
      }
  }, [loading, targetScrollVerse, verseMap]);

  // Dropdown States
  const [isCompareOpen, setIsCompareOpen] = useState(false);
  const [isFocalOpen, setIsFocalOpen] = useState(false);

  const synthRef = useRef(window.speechSynthesis);
  const isTransitioningRef = useRef(false);
  const playbackStatusRef = useRef('stopped'); // Track playback status in ref for callbacks

  // Handler for Focal Translation change with auto-swap logic for Compare slot
  const handleFocalChange = useCallback((newFocal) => {
    if (newFocal === compareTranslation) {
        // If user picks a focal that matches current compare, we must change compare.
        // Pick the first available key that is NOT the new focal.
        const newCompare = availableTranslations.find(k => k !== newFocal);
        setCompareTranslation(newCompare);
    }
    setFocalTranslation(newFocal);
    setIsFocalOpen(false);
  }, [compareTranslation, availableTranslations]);

  // getSectionIndex moved outside App

  const sortedVids = useMemo(() => {
    if (!verseMap) return [];
    return Object.keys(verseMap).sort((a, b) => {
      // ⚡ Bolt Optimization: Use fast substring(0,3) for book extraction and manual integer parsing
      // instead of slow localeCompare(numeric:true) and split(). 25x faster for large sets.

      const bookA = a.substring(0, 3);
      const bookB = b.substring(0, 3);

      // 1. Primary Sort: By Section (OT, NT, Psalms, Proverbs)
      // Inline getSectionIndex logic to reuse bookA/bookB
      const getW = (bk) => (bk === 'PSA' ? 2 : bk === 'PRO' ? 3 : NT_BOOKS.has(bk) ? 1 : 0);
      const wA = getW(bookA);
      const wB = getW(bookB);
      if (wA !== wB) return wA - wB;

      // 2. Secondary Sort: By Book Order (Canonical)
      if (bookA !== bookB) {
        return (BIBLE_BOOK_ORDER_MAP.get(bookA) ?? 999) - (BIBLE_BOOK_ORDER_MAP.get(bookB) ?? 999);
      }

      // 3. Tertiary Sort: By Chapter/Verse (Numeric)
      // Since books are equal, we can skip the first 4 chars "XXX."
      const dotA = a.indexOf('.', 4);
      const dotB = b.indexOf('.', 4);

      const chA = parseInt(a.substring(4, dotA));
      const chB = parseInt(b.substring(4, dotB));

      if (chA !== chB) return chA - chB;

      const vA = parseInt(a.substring(dotA + 1));
      const vB = parseInt(b.substring(dotB + 1));

      return vA - vB;
    });
  }, [verseMap]);

  // ⚡ Bolt Optimization: Calculate reading label during render to avoid extra commit/render cycle.
  // This ensures the label is ready on first paint after data load.
  const readingLabel = useMemo(() =>
      generateSmartLabel(verseMap, sortedVids, focalTranslation),
  [verseMap, sortedVids, focalTranslation]);

  const labelParts = useMemo(() => readingLabel.split(',').map(s => s.trim()), [readingLabel]);
  const activeSectionIndex = useMemo(() => getSectionIndex(playbackStatus === 'playing' ? playbackVerseId || sortedVids[0] : activeVerseId || sortedVids[0]), [playbackStatus, playbackVerseId, activeVerseId, sortedVids]);

  // Dynamically generate the slots based on the selected focal/compare translations
  const dynamicSlots = useMemo(() => {
    if (!focalTranslation || !compareTranslation) return { top: TRANSLATION_REGISTRY.original, middle: {}, bottom: {} };

    const focalConfig = TRANSLATION_REGISTRY[focalTranslation];
    const compareConfig = TRANSLATION_REGISTRY[compareTranslation];

    return {
        top: TRANSLATION_REGISTRY.original,
        middle: {
            source: compareTranslation,
            label: compareConfig?.label || compareTranslation.toUpperCase(),
            isHebrewGreek: false
        },
        bottom: {
            source: focalTranslation,
            label: focalConfig?.label || focalTranslation.toUpperCase(),
            isFocal: true,
            isHebrewGreek: false,
            attribution: focalConfig?.attribution
        }
    };
  }, [focalTranslation, compareTranslation]);

  // Grouping Logic to handle versification mismatches (e.g. Psalm Titles)
  const groupedVids = useMemo(() => {
      const groups = [];
      let i = 0;
      
      const hasTranslationContent = (vid) => {
          if (!verseMap || !verseMap[vid]) return false;
          const t1 = dynamicSlots.middle.source;
          const t2 = dynamicSlots.bottom.source;
          // Check if either slot has content
          const hasT1 = t1 && verseMap[vid][t1] && verseMap[vid][t1].text.length > 0;
          const hasT2 = t2 && verseMap[vid][t2] && verseMap[vid][t2].text.length > 0;
          return hasT1 || hasT2;
      };

      while (i < sortedVids.length) {
          const currentVid = sortedVids[i];
          const group = [currentVid];
          
          // Check if we need to merge with next
          // Condition: Current has NO English, Next HAS English, Same Chapter
          // This catches the Psalm Title (Verse 1) vs English (Verse 1 in Verse 2 slot) case
          if (!hasTranslationContent(currentVid) && i + 1 < sortedVids.length) {
              const nextVid = sortedVids[i+1];
              // Ensure same book/chapter to avoid merges across boundaries
              const [b1, c1] = currentVid.split('.');
              const [b2, c2] = nextVid.split('.');
              
              if (b1 === b2 && c1 === c2 && hasTranslationContent(nextVid)) {
                  group.push(nextVid);
                  i++; // Skip next one since we consumed it
              }
          }
          groups.push(group);
          i++;
      }
      return groups;
  }, [sortedVids, dynamicSlots, verseMap]);

  useEffect(() => {
    if (playbackStatus === 'playing' || loading || !verseMap || groupedVids.length === 0) return;
    const observer = new IntersectionObserver((entries) => {
      const intersecting = entries.filter(e => e.isIntersecting);
      if (intersecting.length > 0) {
        const bestEntry = intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top - 120) - Math.abs(b.boundingClientRect.top - 120))[0];
        setActiveVerseId(bestEntry.target.id.replace('verse-', ''));
      }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
    groupedVids.forEach((group) => {
      const vid = group[0]; // Observe the group container ID
      const el = document.getElementById(`verse-${vid}`);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [playbackStatus, loading, verseMap, groupedVids]);

  useEffect(() => {
    playbackStatusRef.current = playbackStatus;
  }, [playbackStatus]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;
      switch(e.key) {
        case 'ArrowLeft': navigateDate(-1); break;
        case 'ArrowRight': navigateDate(1); break;
        case 'ArrowUp': e.preventDefault(); navigateVerse(-1); break;
        case 'ArrowDown': e.preventDefault(); navigateVerse(1); break;
        case 'k': case 'K': handleToggle(); break;
        case 'Escape':
          if (isCompareOpen || isFocalOpen) { setIsCompareOpen(false); setIsFocalOpen(false); }
          else if (playbackStatus !== 'stopped') { synthRef.current.cancel(); setPlaybackStatus('stopped'); }
          break;
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentDate, playbackStatus, isCompareOpen, isFocalOpen, sortedVids, verseMap]);

  useEffect(() => {
    let isMounted = true;
    const initDay = async () => {
      setLoading(true);
      setError(null);
      synthRef.current.cancel();
      setPlaybackStatus('stopped');
      setPlaybackVerseId(null);
      setActiveVerseId(null);
      try {
        const data = await loadDailyBread(currentDate);
        if (!isMounted) return;
        setVerseMap(data.verseMap);
        // setReadingLabel(data.label); // REMOVED: Now handled by useEffect
        setAvailableTranslations(data.availableTranslations);

        // Smart Defaults: 
        // 1. Try to keep current selection if valid.
        // 2. Fallback to LSV then KJV if available.
        // 3. Fallback to first available.
        const keys = data.availableTranslations;
        if (keys.length > 0) {
           let newFocal = keys.includes(focalTranslation) ? focalTranslation : (keys.includes('lsv') ? 'lsv' : keys[0]);
           let newCompare = keys.includes(compareTranslation) ? compareTranslation : (keys.includes('kjv') ? 'kjv' : keys.find(k => k !== newFocal) || keys[0]);
           
           // If we only have one translation, ensure both slots aren't empty (though rendering handles this)
           if (newCompare === newFocal && keys.length > 1) {
              newCompare = keys.find(k => k !== newFocal);
           }

           setFocalTranslation(newFocal);
           setCompareTranslation(newCompare);
        }

        setLoading(false);
      } catch (err) {
        console.error("Data loading error:", err);
        if (isMounted) {
            setError(err.message || "Unknown error occurred while loading reading.");
            setLoading(false);
        }
      }
    };
    initDay();
    return () => { isMounted = false; };
  }, [currentDate]);

  const playVerse = (vid, previousVid = null) => {
    if (!verseMap) return;

    // 1. Resolve Group Logic: We always play "Groups"
    // Find the group containing this vid
    const group = groupedVids.find(g => g.includes(vid)) || [vid];
    const leaderVid = group[0];

    // 1. CRITICAL: Stop any current speech
    window.speechSynthesis.cancel();

    setPlaybackVerseId(leaderVid);

    // 2. Prepare SPEECH-only text (Focal Version)
    // Accumulate English text for the whole group
    const focalSlot = dynamicSlots.bottom;
    if (!focalSlot) return;

    let groupText = '';
    group.forEach(gVid => {
        const slotData = verseMap[gVid] ? verseMap[gVid][focalSlot.source] : null;
        if (slotData && slotData.text) {
            // Robustly handle string (optimized) or array (defensive) text
            const textStr = Array.isArray(slotData.text) ? slotData.text.join(' ') : slotData.text;
            groupText += textStr.trim() + ' ';
        }
    });
    
    const rawText = groupText.trim();
    if (!rawText) {
        // Skip to next GROUP if this group is empty
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], previousVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
        return;
    }

    // Improve pronunciation: 
    const speechText = rawText
        .replace(/YHWH/g, 'Yaw-weigh')
        .replace(/WHO/g, 'Who')
        .replace(/[\[\]]/g, ''); 

    // Scroll to the LEADER vid container
    const el = document.getElementById(`verse-${leaderVid}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const currentIdx = getSectionIndex(leaderVid);
    const prevIdx = previousVid ? getSectionIndex(previousVid) : -1; 
    
    // 3. Voice Selection
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices[0];
    
    // 5. Play LSV Verse with corrected pronunciation
    const mainUtterance = new SpeechSynthesisUtterance(speechText);
    mainUtterance.voice = preferredVoice;
    mainUtterance.rate = 0.9;

    // 6. Move to next GROUP automatically
    mainUtterance.onend = () => {
        if (playbackStatusRef.current !== 'playing') return; 
        const currentGroupIdx = groupedVids.findIndex(g => g[0] === leaderVid);
        if (currentGroupIdx < groupedVids.length - 1) {
            playVerse(groupedVids[currentGroupIdx + 1][0], leaderVid);
        } else {
            setPlaybackStatus('stopped');
            setPlaybackVerseId(null);
        }
    };

    // 4. Handle Section Intro
    if (currentIdx !== prevIdx) {
        // Range calc based on Group Leaders to accurately reflect visual start/end
        const sectionGroups = groupedVids.filter(g => getSectionIndex(g[0]) === currentIdx);
        
        // Start: First Group's First Vid
        const startVid = sectionGroups[0][0]; 
        // End: Last Group's *Last* Vid (to get true extent)
        const lastGroup = sectionGroups[sectionGroups.length - 1];
        const endVid = lastGroup[lastGroup.length - 1];

        // For display labels in intro, we want to align with English perception.
        // If Hebrew 19.1 (Title) is merged with 19.2 (Verse 1), English readers see "19:1".
        // The `getSlotContent` logic handles rendering labels, but here we just need rough "Chapter X Verse Y".
        // We'll use the *English Mapped* verse ID if possible for the intro to match user expectation.
        
        const getEnglishVid = (v) => {
             const d = verseMap[v];
             const t = d ? d[focalSlot.source] : null;
             return t?.displayVid || v;
        };

        const [book, ch, verse] = getEnglishVid(startVid).split('.');
        const [endBook, endCh, endVerse] = getEnglishVid(endVid).split('.');
        
        let introText = '';
        if (currentIdx === 0) {
            introText = `Today's reading from the Old Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 1) {
            introText = `Today's reading from the New Testament, ${BOOK_NAMES[book] || book} chapter ${ch} verse ${verse}`;
        } else if (currentIdx === 2) {
            introText = `Today's reading from the Psalms, chapter ${ch} verse ${verse}`;
        } else {
            introText = `Today's reading from the Proverbs, chapter ${ch} verse ${verse}`;
        }
        
        if (startVid !== endVid) { // Compare original IDs for range check
            if (book !== endBook) {
                introText += ` to ${BOOK_NAMES[endBook] || endBook} chapter ${endCh} verse ${endVerse}`;
            } else if (endCh !== ch) {
                introText += ` to chapter ${endCh} verse ${endVerse}`;
            } else {
                introText += ` to verse ${endVerse}`;
            }
        }
      
        const intro = new SpeechSynthesisUtterance(introText);
        intro.voice = preferredVoice; 
        intro.rate = 0.9;
        intro.onend = () => {
            window.speechSynthesis.speak(mainUtterance);
        };
        window.speechSynthesis.speak(intro);
    } else {
        window.speechSynthesis.speak(mainUtterance);
    }
};

  const handleToggle = useCallback(() => {
    // ⚡ Bolt Optimization: Use ref to access latest activeVerseId inside stale closures (like event listeners)
    // to avoid recreating the listener on every scroll event.
    const currentActive = activeVerseIdRef.current;
    const currentPlayback = playbackVerseIdRef.current;

    if (playbackStatus === 'playing') { 
      synthRef.current.pause(); 
      setPlaybackStatus('paused');
      isTransitioningRef.current = false; 
    }
    else if (playbackStatus === 'paused') { 
      setPlaybackStatus('playing');
      isTransitioningRef.current = true;
      // Resume from current highlighted verse (where user scrolled to while paused)
      const resumeVerse = currentActive || currentPlayback || sortedVids[0];
      if (resumeVerse && verseMap[resumeVerse]) {
        playVerse(resumeVerse);
      }
    }
    else { 
      setPlaybackStatus('playing'); 
      isTransitioningRef.current = true; 
      // Start from current visible verse, or first verse if none visible
      const startVerse = currentActive || sortedVids[0];
      setPlaybackVerseId(startVerse);
      playVerse(startVerse);
    }
  }, [playbackStatus, sortedVids, verseMap]);

  const navigateDate = useCallback((direction) => {
    const month = parseInt(currentDate.substring(0, 2)), day = parseInt(currentDate.substring(2, 4));
    // Use 2025 (non-leap year) to ensure Feb 28 -> Mar 1 transition matches the data generation
    const date = new Date(2025, month - 1, day); date.setDate(date.getDate() + direction);
    const nm = String(date.getMonth() + 1).padStart(2, '0'), nd = String(date.getDate()).padStart(2, '0');
    setCurrentDate(`${nm}${nd}`); window.scrollTo({ top: 0 });
  }, [currentDate]);

  const navigateVerse = useCallback((direction) => {
    if (!sortedVids || sortedVids.length === 0) return;

    // Find current index
    let currentIndex = -1;
    if (activeVerseIdRef.current) {
        currentIndex = sortedVids.indexOf(activeVerseIdRef.current);
    }
    // If no active verse (e.g., at very top), assume first verse is next logical step
    if (currentIndex === -1 && direction > 0) currentIndex = -1;
    else if (currentIndex === -1 && direction < 0) currentIndex = 0;

    let nextIndex = currentIndex + direction;

    // Bounds check
    if (nextIndex < 0) nextIndex = 0;
    if (nextIndex >= sortedVids.length) nextIndex = sortedVids.length - 1;

    if (nextIndex !== currentIndex) {
        const nextVid = sortedVids[nextIndex];
        // ⚡ Bolt Optimization: Update state immediately so subsequent key presses have correct reference context
        // and the UI highlights the target verse even if smooth scrolling lands outside the observer rootMargin.
        setActiveVerseId(nextVid);

        const el = document.getElementById(`verse-${nextVid}`);
        if (el) {
            // Align with Reading Zone (approx 125px from top) to trigger IntersectionObserver correctly
            const rect = el.getBoundingClientRect();
            const absoluteTop = window.scrollY + rect.top;
            const targetY = absoluteTop - 125;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
    }
  }, [sortedVids]);

  const scrollToSection = useCallback((index) => {
    if (playbackStatus === 'playing' || activeSectionIndex === index) return;
    const targetVid = sortedVids.find(vid => getSectionIndex(vid) === index);
    if (targetVid) {
      const el = document.getElementById(`verse-${targetVid}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [playbackStatus, activeSectionIndex, sortedVids]);

  const onStopPlayback = useCallback(() => {
    synthRef.current.cancel();
    setPlaybackStatus('stopped');
  }, []);

  return (
    <div className="min-h-screen bg-[#fdfcfb] text-stone-900 pb-12">
      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-stone-900 focus:text-white focus:font-bold focus:rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xl transition-all print:hidden">Skip to Content</a>
      <Header
        currentDate={currentDate}
        todayString={todayString}
        formattedDate={formattedDate}
        navigateDate={navigateDate}
        setCurrentDate={setCurrentDate}
        labelParts={labelParts}
        activeSectionIndex={activeSectionIndex}
        scrollToSection={scrollToSection}
        availableTranslations={availableTranslations}
        compareTranslation={compareTranslation}
        focalTranslation={focalTranslation}
        isCompareOpen={isCompareOpen}
        setIsCompareOpen={setIsCompareOpen}
        isFocalOpen={isFocalOpen}
        setIsFocalOpen={setIsFocalOpen}
        setCompareTranslation={setCompareTranslation}
        handleFocalChange={handleFocalChange}
        playbackStatus={playbackStatus}
        onStopPlayback={onStopPlayback}
        handleToggle={handleToggle}
      />

      <main id="main-content" tabIndex={-1} className="max-w-7xl mx-auto py-3 md:py-6 px-2 pb-32 md:pb-40 space-y-6 md:space-y-10 outline-none">
        {loading ? (
          <Loader />
        ) : error ? (
          <ErrorDisplay error={error} date={currentDate} onRetry={() => window.location.reload()} />
        ) : groupedVids.map(group => {
            const vid = group[0];
            const isPlaying = playbackStatus === 'playing';
            // ⚡ Bolt Optimization: Short-circuit includes() checks for single-item groups (99% of cases).
            // This avoids O(N) array scans in the hot render path.
            const isCurrentGroup = isPlaying ? (playbackVerseId === vid || (group.length > 1 && group.includes(playbackVerseId))) : false;
            const isActive = isPlaying ? isCurrentGroup : (activeVerseId === vid || (group.length > 1 && group.includes(activeVerseId)));
            const isDimmed = isPlaying && !isCurrentGroup;

            return (
                <VerseGroup
                    key={vid}
                    group={group}
                    verseMap={verseMap}
                    dynamicSlots={dynamicSlots}
                    isActive={isActive}
                    isDimmed={isDimmed}
                    isPlaying={isPlaying}
                />
            );
        })}
        
      </main>
      <Footer
        readingLabel={readingLabel}
        navigateDate={navigateDate}
        navigateVerse={navigateVerse}
        handleToggle={handleToggle}
      />

      <ScrollToTop />
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
    <!-- The ESM Run script to execute the TSX code -->
    <script src="https://esm.sh/run" type="module"></script>
</body>
</html>
